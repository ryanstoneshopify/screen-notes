    async function renameSession(id, newTitle) {
      const session = allSessions.find(s => s.id === id);
      if (session) {
        session.title = newTitle.trim() || 'Untitled Session';
        await saveSession(session);
      }
    }

    async function viewSession(id, options = {}) {
      if (isRecording && id !== activeSessionId) {
        if (!confirm('Stop current recording to view this session?')) return;
        await stopRecording();
      }
      activeSessionId = id;
      if (options.updateUrl !== false) setSessionUrl(id);
      const session = allSessions.find(s => s.id === id);
      if (session) {
        sessionListTab = isMySession(session) ? 'yours' : 'others';
        currentNotes = session.notes || [];
      }
      render();
      // Initialize canvas after DOM is ready
      requestAnimationFrame(() => initCanvas(session));
      // Join presence room
      joinPresenceRoom(id);
    }

    // ════════════════════════════════════════════
    // ── Canvas (pan / zoom / items) ──
    // ════════════════════════════════════════════
    const canvas = {
      x: 0, y: 0, scale: 1,
      items: [],          // {id, type, x, y, w, h, ...}
      selectedId: null,
      selectedIds: [],
      session: null,
      saveTimer: null,
      undoStack: [],
      clipboardItems: [],
    };

    function newCanvasItemId(type) {
      return `${type || 'item'}-${Math.random().toString(36).slice(2, 9)}`;
    }

    function snapshotCanvasState() {
      return {
        x: canvas.x,
        y: canvas.y,
        scale: canvas.scale,
        items: JSON.parse(JSON.stringify(canvas.items)),
      };
    }

    function pushUndoState() {
      canvas.undoStack.push(snapshotCanvasState());
      if (canvas.undoStack.length > 80) canvas.undoStack.shift();
    }

    function undoCanvasAction() {
      const prev = canvas.undoStack.pop();
      if (!prev) return;
      canvas.x = prev.x;
      canvas.y = prev.y;
      canvas.scale = prev.scale;
      canvas.items = JSON.parse(JSON.stringify(prev.items));
      canvas.selectedId = null;
      canvas.selectedIds = [];
      renderCanvas();
      saveCanvasDebounced();
    }

    function copySelectedCanvasItems() {
      if (!canvas.selectedIds.length) return false;
      const selectedSet = new Set(canvas.selectedIds);
      canvas.clipboardItems = canvas.items
        .filter(item => selectedSet.has(item.id))
        .map(item => JSON.parse(JSON.stringify(item)));
      if (canvas.clipboardItems.length) writeCanvasItemsToSystemClipboard(canvas.clipboardItems);
      return canvas.clipboardItems.length > 0;
    }

    function escapeXml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function wrapSvgText(text, x, y, maxWidth, fontSize = 14, lineHeight = 20, color = '#1f1e1d', weight = 400, family = 'Arial, sans-serif') {
      const words = String(text || '').trim().split(/\s+/).filter(Boolean);
      if (!words.length) return '';
      const maxChars = Math.max(8, Math.floor(maxWidth / (fontSize * 0.55)));
      const lines = [];
      let line = '';
      words.forEach(word => {
        const next = line ? `${line} ${word}` : word;
        if (next.length > maxChars && line) {
          lines.push(line);
          line = word;
        } else {
          line = next;
        }
      });
      if (line) lines.push(line);

      // Figma ignores SVG/CSS text wrapping on import. Using tspan x=... wraps
      // visually, but Figma turns every line into a separate text layer. Instead,
      // keep one <text> with relative tspans. The negative dx returns each line
      // to the original x without per-line absolute positioning, which Figma is
      // much more likely to preserve as one editable text object.
      const measure = (() => {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        ctx.font = `${weight} ${fontSize}px ${family}`;
        return value => Math.max(1, ctx.measureText(value).width);
      })();
      let previousLineWidth = measure(lines[0]);
      const tspans = lines.slice(1).map(line => {
        const dx = -previousLineWidth;
        previousLineWidth = measure(line);
        return `<tspan dx="${dx.toFixed(2)}" dy="${lineHeight}">${escapeXml(line)}</tspan>`;
      }).join('');
      return `<text x="${x}" y="${y}" fill="${color}" font-family="${family}" font-size="${fontSize}" font-weight="${weight}">${escapeXml(lines[0])}${tspans}</text>`;
    }

    async function imageUrlToClipboardHref(url) {
      if (!url) return '';
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Image fetch failed');
        const blob = await response.blob();
        return await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      } catch (_) {
        return url;
      }
    }

    async function getImageDimensions(src) {
      if (!src) return null;
      return await new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve({ w: img.naturalWidth || 1, h: img.naturalHeight || 1 });
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function svgLayerName(item) {
      if (item.type === 'text') return `Text layer ${item.id}`;
      if (item.type === 'image') return `Image layer ${item.id}`;
      if (item.type === 'screenshot') {
        const note = (canvas.session?.notes || [])[item.noteIndex];
        const timestamp = note ? formatDuration(note.timestamp) : '';
        return `Screenshot ${timestamp || item.id}`;
      }
      return `Layer ${item.id}`;
    }

    function svgSafeId(name) {
      return String(name || 'layer').replace(/[^a-zA-Z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') || 'layer';
    }

    function namedSvgGroup(item, content) {
      const name = svgLayerName(item);
      return `<g id="${escapeXml(svgSafeId(name))}" data-name="${escapeXml(name)}"><title>${escapeXml(name)}</title>${content}</g>`;
    }

    async function svgContainImage(href, x, y, boxW, boxH, options = {}) {
      const clip = options.clipId ? `<defs><clipPath id="${escapeXml(options.clipId)}" clipPathUnits="userSpaceOnUse"><rect x="${options.clipX ?? x}" y="${options.clipY ?? y}" width="${options.clipW ?? boxW}" height="${options.clipH ?? boxH}" rx="${options.clipRx ?? 0}" ry="${options.clipRx ?? 0}"/></clipPath></defs>` : '';
      const clipAttr = options.clipId ? ` clip-path="url(#${escapeXml(options.clipId)})"` : '';
      const dims = await getImageDimensions(href);
      if (!dims) {
        return `${clip}<image href="${escapeXml(href)}" x="${x}" y="${y}" width="${boxW}" height="${boxH}"${clipAttr}/>`;
      }
      const scale = Math.min(boxW / dims.w, boxH / dims.h);
      const imageW = dims.w * scale;
      const imageH = dims.h * scale;
      const imageX = x + (boxW - imageW) / 2;
      const imageY = y + (boxH - imageH) / 2;
      return `${clip}<image href="${escapeXml(href)}" x="${imageX}" y="${imageY}" width="${imageW}" height="${imageH}"${clipAttr}/>`;
    }

    async function canvasItemsToSvg(items) {
      const entries = items.map(item => ({ item, bounds: getRenderedItemBounds(item) }));
      const minX = Math.min(...entries.map(e => e.bounds.x1));
      const minY = Math.min(...entries.map(e => e.bounds.y1));
      const maxX = Math.max(...entries.map(e => e.bounds.x2));
      const maxY = Math.max(...entries.map(e => e.bounds.y2));
      const width = Math.max(1, maxX - minX);
      const height = Math.max(1, maxY - minY);
      const parts = [];

      for (const { item, bounds } of entries) {
        const x = item.x - minX;
        const y = item.y - minY;
        const w = bounds.w;
        const h = bounds.h;

        if (item.type === 'text') {
          const fontSize = item.fontSize || 16;
          const content = `
            <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#faf9f5" stroke="#ded9cc"/>
            ${wrapSvgText(item.text || 'Text', x + 12, y + 10 + fontSize, Math.max(1, w - 24), fontSize, Math.round(fontSize * 1.45), '#1f1e1d', 400, 'Inter, Arial, sans-serif')}
          `;
          parts.push(namedSvgGroup(item, content));
          continue;
        }

        if (item.type === 'image') {
          const href = await imageUrlToClipboardHref(item.url);
          const imageSvg = await svgContainImage(href, x, y, w, item.h, {
            clipId: svgSafeId(`clip-${item.id}`),
            clipX: x,
            clipY: y,
            clipW: w,
            clipH: h,
            clipRx: 12,
          });
          const content = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#faf9f5" stroke="#ded9cc"/>${imageSvg}${item.note ? wrapSvgText(item.note, x + 14, y + item.h + 28, w - 28, 14, 20) : ''}`;
          parts.push(namedSvgGroup(item, content));
          continue;
        }

        if (item.type === 'screenshot') {
          const note = (canvas.session?.notes || [])[item.noteIndex];
          if (!note) continue;
          const href = await imageUrlToClipboardHref(note.screenshotUrl || note.screenshot);
          const imageSvg = await svgContainImage(href, x, y, w, item.h, {
            clipId: svgSafeId(`clip-${item.id}`),
            clipX: x,
            clipY: y,
            clipW: w,
            clipH: h,
            clipRx: 12,
          });
          const timestamp = formatDuration(note.timestamp);
          const noteText = note.text ? wrapSvgText(note.text, x + 14, y + item.h + 28, w - 28, 14, 20) : '';
          const timeY = y + item.h + 48 + (note.text ? Math.max(0, Math.ceil(String(note.text).length / Math.max(8, Math.floor((w - 28) / (14 * 0.55)))) - 1) * 20 : 0);
          const content = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#faf9f5" stroke="#ded9cc"/>${imageSvg}${noteText}<rect x="${x + 14}" y="${timeY}" width="${Math.max(64, timestamp.length * 8 + 22)}" height="24" rx="12" fill="var(--surface-hover)"/><text x="${x + 25}" y="${timeY + 16}" fill="#6f6a61" font-family="Inter, Arial, sans-serif" font-size="12">${escapeXml(timestamp)}</text>`;
          parts.push(namedSvgGroup(item, content));
        }
      }

      return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(width)}" height="${Math.ceil(height)}" viewBox="0 0 ${Math.ceil(width)} ${Math.ceil(height)}">${parts.join('')}</svg>`;
    }

    async function writeCanvasItemsToSystemClipboard(items) {
      if (!navigator.clipboard?.write) return;
      try {
        const svg = await canvasItemsToSvg(items);
        const html = `<div>${svg}</div>`;
        const data = {
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([svg], { type: 'text/plain' }),
        };
        try {
          data['image/svg+xml'] = new Blob([svg], { type: 'image/svg+xml' });
        } catch (_) {}
        await navigator.clipboard.write([new ClipboardItem(data)]);
      } catch (err) {
        console.warn('[screen-notes] Failed to write SVG clipboard:', err);
      }
    }

    function pasteCanvasItems() {
      if (!canvas.clipboardItems.length) return false;
      pushUndoState();
      const offset = 32;
      const pasted = canvas.clipboardItems.map(item => {
        const clone = JSON.parse(JSON.stringify(item));
        clone.id = newCanvasItemId(clone.type);
        clone.x = (clone.x || 0) + offset;
        clone.y = (clone.y || 0) + offset;
        return clone;
      });
      canvas.items.push(...pasted);
      canvas.clipboardItems = pasted.map(item => JSON.parse(JSON.stringify(item)));
      renderCanvas();
      setSelectedItems(pasted.map(item => item.id));
      saveCanvasDebounced();
      return true;
    }

    function initCanvas(session) {
      const viewport = document.getElementById('canvasViewport');
      if (!viewport) return;
      canvas.session = session;

      // Presence: broadcast cursor on mousemove
      viewport.addEventListener('mousemove', broadcastCursorPosition);

      // Load existing canvas state OR auto-generate from notes
      if (session.canvas && session.canvas.items && session.canvas.items.length) {
        canvas.items = JSON.parse(JSON.stringify(session.canvas.items)).map(item => {
          if (item.type === 'screenshot') {
            const note = (session.notes || [])[item.noteIndex];
            const hasScreenshot = !!(note?.screenshotUrl || note?.screenshot);
            if (!hasScreenshot) {
              return {
                ...item,
                type: 'text',
                text: note?.text || item.text || '',
                fontSize: item.fontSize || 16,
                w: estimateTextNoteWidth(note?.text || item.text || ''),
                h: 60,
              };
            }
          }
          return item;
        });
        canvas.x = session.canvas.viewport?.x ?? 0;
        canvas.y = session.canvas.viewport?.y ?? 0;
        canvas.scale = session.canvas.viewport?.scale ?? 1;
      } else {
        canvas.items = generateInitialLayout(session.notes || []);
        canvas.x = 0; canvas.y = 0; canvas.scale = 1;
        // Center initial layout
        setTimeout(fitToScreen, 50);
      }
      canvas.selectedId = null;
      canvas.selectedIds = [];
      canvas.undoStack = [];

      renderCanvas();
      attachCanvasListeners(viewport);
    }

    function estimateScreenshotCardHeight(note, cardW, imageH) {
      // Screenshot cards are auto-height: image + note region. Before the DOM
      // exists we estimate the note block so first-load layouts don't overlap.
      const text = (note?.text || '').trim();
      const charsPerLine = Math.max(24, Math.floor((cardW - 28) / 8));
      const lines = Math.max(1, Math.ceil(text.length / charsPerLine));
      const noteTextH = lines * 22;
      const noteChromeH = 14 + 14 + 26 + 8; // padding + time badge + gap
      return imageH + noteTextH + noteChromeH;
    }

    function estimateTextNoteWidth(text) {
      const longestLine = String(text || '').split('\n').reduce((max, line) => Math.max(max, line.length), 0);
      return Math.max(120, Math.min(280, Math.ceil(longestLine * 9 + 48)));
    }

    function generateInitialLayout(notes) {
      // Masonry-arrange screenshots from the start so auto-height note sections
      // don't overlap when the session first opens after recording stops.
      const items = [];
      const cardW = 960, cardH = 640, gap = 64;
      const cols = Math.max(1, Math.ceil(Math.sqrt(notes.length || 1)));
      const colHeights = Array(cols).fill(0);

      notes.forEach((note, i) => {
        let col = 0;
        for (let c = 1; c < cols; c++) {
          if (colHeights[c] < colHeights[col]) col = c;
        }

        const x = col * (cardW + gap);
        const y = colHeights[col];
        const hasScreenshot = !!(note.screenshotUrl || note.screenshot);

        if (hasScreenshot) {
          const estimatedH = estimateScreenshotCardHeight(note, cardW, cardH);
          items.push({
            id: 'note-' + i + '-' + Math.random().toString(36).slice(2, 7),
            type: 'screenshot',
            noteIndex: i,
            x,
            y,
            w: cardW,
            h: cardH,
          });
          colHeights[col] += estimatedH + gap;
        } else {
          // Text-only note → standalone text box on canvas
          const textW = estimateTextNoteWidth(note.text || '');
          const textH = 60;
          items.push({
            id: 'note-' + i + '-' + Math.random().toString(36).slice(2, 7),
            type: 'text',
            text: note.text || '',
            fontSize: 16,
            noteIndex: i,
            x,
            y,
            w: textW,
            h: textH,
          });
          colHeights[col] += textH + gap;
        }
      });
      return items;
    }

    function renderCanvas() {
      const world = document.getElementById('canvasWorld');
      if (!world) return;
      world.style.transform = `translate(${canvas.x}px, ${canvas.y}px) scale(${canvas.scale})`;

      world.innerHTML = canvas.items.map(item => renderCanvasItem(item)).join('') + '<div class="group-selection-box" id="groupSelectionBox"><div class="resize-handle" data-group-handle="true"></div></div>';
      updateZoomIndicator();
      updateCanvasGrid();
      updateGroupSelectionBox();
      renderRemoteCursors();
    }

    function renderCanvasItem(item) {
      const selected = isItemSelected(item.id);
      const sel = selected ? 'selected' : '';
      const baseStyle = `left:${item.x}px;top:${item.y}px;width:${item.w}px;height:${item.h}px;`;
      const handle = selected && canvas.selectedIds.length <= 1 ? `<div class="resize-handle" data-handle="${item.id}"></div>` : '';

      if (item.type === 'screenshot') {
        const note = (canvas.session?.notes || [])[item.noteIndex];
        if (!note) return '';
        const src = note.screenshotUrl || note.screenshot;
        if (!src) {
          // Notes with no screenshot should behave like plain text boxes on canvas,
          // not like empty screenshot cards.
          const fontSize = item.fontSize || 16;
          const textW = estimateTextNoteWidth(note.text || '');
          const textStyle = `left:${item.x}px;top:${item.y}px;width:${textW}px;`;
          return `
            <div class="canvas-item ${sel}" data-id="${item.id}" style="${textStyle}">
              <div class="ci-text ci-text-note" style="font-size:${fontSize}px;">
                <div class="ci-note-text" data-note-index="${item.noteIndex}">${escapeHtml(note.text || 'Text')}</div>
                <div class="ci-note-time">${formatDuration(note.timestamp)}</div>
              </div>
              ${handle}
            </div>
          `;
        }
        // Screenshot cards are AUTO-HEIGHT and shrink-wrap to the rendered image.
        // item.w / item.h are max bounds; the note below uses that same rendered
        // image width instead of stretching across any empty contain space.
        const cardStyle = `left:${item.x}px;top:${item.y}px;max-width:${item.w}px;`;
        return `
          <div class="canvas-item ci-screenshot ${sel}" data-id="${item.id}" style="${cardStyle}">
            <div class="ci-screenshot-img-wrap" style="max-width:${item.w}px;max-height:${item.h}px;">
              <img src="${src}" alt="" draggable="false" style="max-width:${item.w}px;max-height:${item.h}px;">
            </div>
            <div class="ci-note">
              <div class="ci-note-text" data-note-index="${item.noteIndex}">${escapeHtml(note.text)}</div>
              <div class="ci-note-time">${formatDuration(note.timestamp)}</div>
            </div>
            ${handle}
          </div>
        `;
      }
      if (item.type === 'text') {
        const fontSize = item.fontSize || 16;
        const noteIndex = Number.isInteger(item.noteIndex) ? item.noteIndex : null;
        const note = noteIndex !== null ? (canvas.session?.notes || [])[noteIndex] : null;
        // Text boxes are AUTO-HEIGHT: item.h is a minimum height only.
        // The container should never clip or be smaller than its text.
        const textW = note ? estimateTextNoteWidth(note.text || '') : item.w;
        const textStyle = `left:${item.x}px;top:${item.y}px;width:${textW}px;`;
        return `
          <div class="canvas-item ${sel}" data-id="${item.id}" style="${textStyle}">
            ${note ? `<div class="ci-text ci-text-note" style="font-size:${fontSize}px;">
              <div class="ci-note-text" data-note-index="${noteIndex}">${escapeHtml(note.text || 'Text')}</div>
              <div class="ci-note-time">${formatDuration(note.timestamp)}</div>
            </div>` : `<div class="ci-text" data-text-id="${item.id}" style="font-size:${fontSize}px;min-height:${item.h}px;">${escapeHtml(item.text || 'Text')}</div>`}
            ${handle}
          </div>
        `;
      }
      if (item.type === 'image') {
        // Dropped images are AUTO-HEIGHT too: item.h controls image height;
        // the optional note field grows below it.
        const imageStyle = `left:${item.x}px;top:${item.y}px;width:${item.w}px;`;
        return `
          <div class="canvas-item ci-image ${sel}" data-id="${item.id}" style="${imageStyle}">
            <div class="ci-image-img-wrap" style="height:${item.h}px;">
              <img src="${item.url}" alt="" draggable="false">
            </div>
            <div class="ci-note">
              <div class="ci-note-text" data-image-note-id="${item.id}">${escapeHtml(item.note || '')}</div>
            </div>
            ${handle}
          </div>
        `;
      }
      return '';
    }

    function updateZoomIndicator() {
      const el = document.getElementById('zoomIndicator');
      if (el) el.textContent = Math.round(canvas.scale * 100) + '%';
    }

    function updateCanvasGrid() {
      const viewport = document.getElementById('canvasViewport');
      if (!viewport) return;
      const base = 32;
      const size = Math.max(8, base * canvas.scale);
      const dot = Math.max(0.65, Math.min(2.25, 1.25 * Math.sqrt(canvas.scale)));
      viewport.style.setProperty('--grid-size', `${size}px`);
      viewport.style.setProperty('--grid-dot', `${dot}px`);
      viewport.style.setProperty('--grid-x', `${canvas.x % size}px`);
      viewport.style.setProperty('--grid-y', `${canvas.y % size}px`);
    }

    // ── Canvas event handlers ──
    let isPanning = false, isDraggingItem = false, isResizing = false, isResizingGroup = false, isSelecting = false;
    let dragStart = { x: 0, y: 0, itemX: 0, itemY: 0, itemW: 0, itemH: 0 };
    let selectionStart = { x: 0, y: 0, worldX: 0, worldY: 0 };
    let spaceDown = false;
    const SNAP_THRESHOLD_PX = 8;

    function attachCanvasListeners(viewport) {
      // Mouse down — start pan or item drag
      viewport.addEventListener('mousedown', onCanvasMouseDown);
      viewport.addEventListener('wheel', onCanvasWheel, { passive: false });
      viewport.addEventListener('dblclick', onCanvasDblClick);

      // Drag-and-drop image files — use enter/leave counter so child elements
      // don't make the overlay flicker
      let dragDepth = 0;
      viewport.addEventListener('dragenter', e => {
        e.preventDefault();
        dragDepth++;
        document.getElementById('dropOverlay')?.classList.add('visible');
      });
      viewport.addEventListener('dragover', e => {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      });
      viewport.addEventListener('dragleave', e => {
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) document.getElementById('dropOverlay')?.classList.remove('visible');
      });
      viewport.addEventListener('drop', e => {
        dragDepth = 0;
        document.getElementById('dropOverlay')?.classList.remove('visible');
        onCanvasDrop(e);
      });

      // Window-level for drag continuity
      window.addEventListener('mousemove', onWindowMouseMove);
      window.addEventListener('mouseup', onWindowMouseUp);
      window.addEventListener('keydown', onCanvasKeyDown);
      window.addEventListener('keyup', onCanvasKeyUp);
    }

    function onCanvasMouseDown(e) {
      const viewport = document.getElementById('canvasViewport');

      // Never start a drag or re-render if the user clicked into an editable
      // text area — but do select/focus the parent layer first.
      const noteText = e.target.closest('.ci-note-text');
      if (noteText) {
        const parentItem = noteText.closest('.canvas-item');
        if (parentItem) setSelectedItem(parentItem.dataset.id);
        return;
      }
      if (e.target.closest('.ci-text[contenteditable="true"]')) {
        const parentItem = e.target.closest('.canvas-item');
        if (parentItem) setSelectedItem(parentItem.dataset.id);
        return;
      }

      // Space + drag pans the canvas. This works even if the pointer starts on an item.
      if ((spaceDown && e.button === 0) || e.button === 1) {
        isPanning = true;
        dragStart = { x: e.clientX, y: e.clientY, canvasX: canvas.x, canvasY: canvas.y };
        viewport.classList.add('panning');
        e.preventDefault();
        return;
      }

      // Resize handle?
      if (e.target.classList.contains('resize-handle')) {
        if (e.target.dataset.groupHandle === 'true') {
          const bounds = getSelectionBounds();
          if (bounds) {
            pushUndoState();
            isResizingGroup = true;
            dragStart = {
              x: e.clientX, y: e.clientY,
              bounds,
              itemSnapshots: canvas.selectedIds.map(id => {
                const selected = canvas.items.find(i => i.id === id);
                return selected ? { id, x: selected.x, y: selected.y, w: selected.w, h: selected.h } : null;
              }).filter(Boolean),
            };
            e.preventDefault();
            return;
          }
        }

        const id = e.target.dataset.handle;
        const item = canvas.items.find(i => i.id === id);
        if (item) {
          pushUndoState();
          isResizing = true;
          dragStart = {
            x: e.clientX, y: e.clientY,
            itemW: item.w, itemH: item.h, itemId: id,
          };
          e.preventDefault();
          return;
        }
      }

      // Click on item?
      const itemEl = e.target.closest('.canvas-item');
      if (itemEl && e.button === 0) {
        const id = itemEl.dataset.id;
        const item = canvas.items.find(i => i.id === id);
        if (!item) return;

        // Shift-click toggles layers into/out of the current selection.
        if (e.shiftKey) {
          const next = new Set(canvas.selectedIds);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          setSelectedItems([...next]);
          e.preventDefault();
          return;
        }

        if (!isItemSelected(id)) setSelectedItem(id);

        pushUndoState();
        isDraggingItem = true;
        dragStart = {
          x: e.clientX, y: e.clientY,
          itemX: item.x, itemY: item.y, itemId: id,
          itemPositions: canvas.selectedIds.map(selectedId => {
            const selected = canvas.items.find(i => i.id === selectedId);
            return selected ? { id: selected.id, x: selected.x, y: selected.y } : null;
          }).filter(Boolean),
        };
        e.preventDefault();
        return;
      }

      // Empty-canvas drag creates a marquee selection. Panning requires Space.
      if (e.button === 0) {
        const rect = viewport.getBoundingClientRect();
        isSelecting = true;
        setSelectedItems([]);
        selectionStart = {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
          worldX: (e.clientX - rect.left - canvas.x) / canvas.scale,
          worldY: (e.clientY - rect.top - canvas.y) / canvas.scale,
        };
        updateSelectionRect(selectionStart.x, selectionStart.y, selectionStart.x, selectionStart.y);
        e.preventDefault();
      }
    }

    function isItemSelected(id) {
      return canvas.selectedIds.includes(id);
    }

    function setSelectedItem(id) {
      setSelectedItems(id ? [id] : []);
    }

    // Toggle selected classes + resize handle without full re-rendering.
    function setSelectedItems(ids) {
      const uniqueIds = [...new Set(ids.filter(Boolean))];
      canvas.selectedIds = uniqueIds;
      canvas.selectedId = uniqueIds[0] || null;

      document.querySelectorAll('.canvas-item').forEach(el => {
        const id = el.dataset.id;
        const selected = uniqueIds.includes(id);
        el.classList.toggle('selected', selected);
        el.querySelector(':scope > .resize-handle')?.remove();

        if (selected && uniqueIds.length === 1) {
          const handle = document.createElement('div');
          handle.className = 'resize-handle';
          handle.dataset.handle = id;
          el.appendChild(handle);
        }
      });
      updateGroupSelectionBox();
    }

    function updateSelectionRect(x1, y1, x2, y2) {
      const el = document.getElementById('selectionRect');
      if (!el) return;
      const left = Math.min(x1, x2);
      const top = Math.min(y1, y2);
      const width = Math.abs(x2 - x1);
      const height = Math.abs(y2 - y1);
      el.style.display = 'block';
      el.style.left = `${left}px`;
      el.style.top = `${top}px`;
      el.style.width = `${width}px`;
      el.style.height = `${height}px`;
    }

    function clearSelectionRect() {
      const el = document.getElementById('selectionRect');
      if (el) el.style.display = 'none';
    }

    function rectsIntersect(a, b) {
      return a.x1 <= b.x2 && a.x2 >= b.x1 && a.y1 <= b.y2 && a.y2 >= b.y1;
    }

    function getSelectionBounds() {
      if (canvas.selectedIds.length < 2) return null;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      canvas.selectedIds.forEach(id => {
        const item = canvas.items.find(i => i.id === id);
        if (!item) return;
        const b = getRenderedItemBounds(item);
        minX = Math.min(minX, b.x1);
        minY = Math.min(minY, b.y1);
        maxX = Math.max(maxX, b.x2);
        maxY = Math.max(maxY, b.y2);
      });
      if (!Number.isFinite(minX)) return null;
      return { x1: minX, y1: minY, x2: maxX, y2: maxY, w: maxX - minX, h: maxY - minY };
    }

    function updateGroupSelectionBox() {
      const box = document.getElementById('groupSelectionBox');
      if (!box) return;
      const bounds = getSelectionBounds();
      if (!bounds) {
        box.style.display = 'none';
        return;
      }
      box.style.display = 'block';
      box.style.left = bounds.x1 + 'px';
      box.style.top = bounds.y1 + 'px';
      box.style.width = bounds.w + 'px';
      box.style.height = bounds.h + 'px';
    }

    function onWindowMouseMove(e) {
      if (isPanning) {
        canvas.x = dragStart.canvasX + (e.clientX - dragStart.x);
        canvas.y = dragStart.canvasY + (e.clientY - dragStart.y);
        applyTransform();
      } else if (isDraggingItem) {
        const item = canvas.items.find(i => i.id === dragStart.itemId);
        if (item) {
          const dx = (e.clientX - dragStart.x) / canvas.scale;
          const dy = (e.clientY - dragStart.y) / canvas.scale;
          const rawX = dragStart.itemX + dx;
          const rawY = dragStart.itemY + dy;
          const snapped = getSnappedDragPosition(item, rawX, rawY);
          const snapDx = snapped.x - rawX;
          const snapDy = snapped.y - rawY;

          dragStart.itemPositions.forEach(pos => {
            const selected = canvas.items.find(i => i.id === pos.id);
            if (!selected) return;
            selected.x = pos.x + dx + snapDx;
            selected.y = pos.y + dy + snapDy;
            updateItemPosition(selected);
          });
          updateAlignmentGuides(snapped.guideX, snapped.guideY);
          updateGroupSelectionBox();
        }
      } else if (isSelecting) {
        const viewport = document.getElementById('canvasViewport');
        if (!viewport) return;
        const rect = viewport.getBoundingClientRect();
        const sx = selectionStart.x;
        const sy = selectionStart.y;
        const ex = e.clientX - rect.left;
        const ey = e.clientY - rect.top;
        updateSelectionRect(sx, sy, ex, ey);

        const worldRect = {
          x1: Math.min(selectionStart.worldX, (ex - canvas.x) / canvas.scale),
          y1: Math.min(selectionStart.worldY, (ey - canvas.y) / canvas.scale),
          x2: Math.max(selectionStart.worldX, (ex - canvas.x) / canvas.scale),
          y2: Math.max(selectionStart.worldY, (ey - canvas.y) / canvas.scale),
        };
        const selected = canvas.items
          .filter(item => rectsIntersect(worldRect, getRenderedItemBounds(item)))
          .map(item => item.id);
        setSelectedItems(selected);
      } else if (isResizingGroup) {
        const { bounds, itemSnapshots } = dragStart;
        if (bounds && itemSnapshots) {
          const minW = 24;
          const minH = 24;
          const newW = Math.max(minW, bounds.w + (e.clientX - dragStart.x) / canvas.scale);
          const newH = Math.max(minH, bounds.h + (e.clientY - dragStart.y) / canvas.scale);
          const sx = newW / bounds.w;
          const sy = newH / bounds.h;

          itemSnapshots.forEach(snapshot => {
            const item = canvas.items.find(i => i.id === snapshot.id);
            if (!item) return;
            item.x = bounds.x1 + (snapshot.x - bounds.x1) * sx;
            item.y = bounds.y1 + (snapshot.y - bounds.y1) * sy;
            item.w = Math.max(40, snapshot.w * sx);
            item.h = Math.max(24, snapshot.h * sy);
            updateItemPosition(item);
            updateItemSize(item);
          });
          updateGroupSelectionBox();
        }
      } else if (isResizing) {
        const item = canvas.items.find(i => i.id === dragStart.itemId);
        if (item) {
          item.w = Math.max(60, dragStart.itemW + (e.clientX - dragStart.x) / canvas.scale);
          item.h = Math.max(40, dragStart.itemH + (e.clientY - dragStart.y) / canvas.scale);
          updateItemSize(item);
        }
      }
    }

    function onWindowMouseUp() {
      const viewport = document.getElementById('canvasViewport');
      if (viewport) viewport.classList.remove('panning');
      const wasInteracting = isPanning || isDraggingItem || isResizing || isResizingGroup || isSelecting;
      isPanning = isDraggingItem = isResizing = isResizingGroup = isSelecting = false;
      clearAlignmentGuides();
      clearSelectionRect();
      if (wasInteracting && !isSelecting) saveCanvasDebounced();
    }

    function onCanvasWheel(e) {
      e.preventDefault();

      if (e.ctrlKey || e.metaKey) {
        // Zoom
        const viewport = document.getElementById('canvasViewport');
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const oldScale = canvas.scale;
        const delta = -e.deltaY * 0.01;
        const newScale = Math.min(4, Math.max(0.1, oldScale * (1 + delta)));
        const ratio = newScale / oldScale;

        canvas.x = mouseX - (mouseX - canvas.x) * ratio;
        canvas.y = mouseY - (mouseY - canvas.y) * ratio;
        canvas.scale = newScale;
        applyTransform();
        saveCanvasDebounced();
      } else {
        // Pan with wheel/trackpad two-finger
        canvas.x -= e.deltaX;
        canvas.y -= e.deltaY;
        applyTransform();
        saveCanvasDebounced();
      }
    }

    function onCanvasDblClick(e) {
      // 1) Editable note attached to a screenshot or dropped image
      const noteEl = e.target.closest('.ci-note-text');
      if (noteEl) {
        if (noteEl.dataset.imageNoteId) startEditingImageNoteText(noteEl);
        else startEditingNoteText(noteEl);
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      // 2) Free-floating text item on the canvas
      const textEl = e.target.closest('.ci-text');
      if (textEl) {
        if (textEl.dataset.noteIndex) startEditingNoteText(textEl);
        else startEditingText(textEl);
        e.preventDefault();
        e.stopPropagation();
      }
    }

    // Generic helper: turn an element into a contenteditable, run onCommit on blur
    function makeEditable(el, onCommit) {
      el.contentEditable = 'true';
      el.focus();
      // Select all text
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(el);
      sel.removeAllRanges();
      sel.addRange(range);

      const finish = () => {
        el.contentEditable = 'false';
        el.removeEventListener('blur', finish);
        el.removeEventListener('keydown', onKey);
        onCommit(el.textContent);
      };
      const onKey = (ev) => {
        if (ev.key === 'Escape') { ev.preventDefault(); el.blur(); }
      };
      el.addEventListener('blur', finish);
      el.addEventListener('keydown', onKey);
    }

    function startEditingText(textEl) {
      const id = textEl.dataset.textId;
      const item = canvas.items.find(i => i.id === id);
      if (!item) return;
      pushUndoState();
      makeEditable(textEl, (newText) => {
        item.text = newText;
        // Persist at least the rendered height so future renders never shrink
        // below what the text currently needs.
        item.h = Math.max(item.h || 0, textEl.scrollHeight);
        saveCanvasDebounced();
      });
    }

    function startEditingNoteText(noteEl) {
      const idx = parseInt(noteEl.dataset.noteIndex, 10);
      if (isNaN(idx) || !canvas.session?.notes?.[idx]) return;
      makeEditable(noteEl, (newText) => {
        canvas.session.notes[idx].text = newText;
        // Keep the in-memory currentNotes in sync if this is the active session
        if (activeSessionId === canvas.session.id) {
          currentNotes = canvas.session.notes;
        }
        // Save the session itself (notes live there, not on the canvas item)
        saveSession(canvas.session);
      });
    }

    function startEditingImageNoteText(noteEl) {
      const id = noteEl.dataset.imageNoteId;
      const item = canvas.items.find(i => i.id === id);
      if (!item) return;
      pushUndoState();
      makeEditable(noteEl, (newText) => {
        item.note = newText;
        saveCanvasDebounced();
      });
    }

    function onCanvasKeyDown(e) {
      // Ignore if typing
      if (['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
      if (document.activeElement?.isContentEditable) return;

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'c' && !e.shiftKey) {
        if (copySelectedCanvasItems()) {
          e.preventDefault();
          return;
        }
      }

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'v' && !e.shiftKey) {
        if (pasteCanvasItems()) {
          e.preventDefault();
          return;
        }
      }

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        undoCanvasAction();
        e.preventDefault();
        return;
      }

      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key) && canvas.selectedIds.length) {
        pushUndoState();
        const step = e.shiftKey ? 10 : 1;
        const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
        const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
        canvas.selectedIds.forEach(id => {
          const item = canvas.items.find(i => i.id === id);
          if (!item) return;
          item.x += dx;
          item.y += dy;
          updateItemPosition(item);
        });
        updateGroupSelectionBox();
        saveCanvasDebounced();
        e.preventDefault();
        return;
      }

      if (e.code === 'Space') {
        spaceDown = true;
        document.getElementById('canvasViewport')?.classList.add('space-down');
        e.preventDefault();
      }

      if (e.key.toLowerCase() === 't' && !e.metaKey && !e.ctrlKey && !e.altKey) {
        addTextItem();
        e.preventDefault();
        return;
      }

      if ((e.key === 'Delete' || e.key === 'Backspace') && canvas.selectedIds.length) {
        pushUndoState();
        const toDelete = new Set(canvas.selectedIds);
        canvas.items = canvas.items.filter(i => !toDelete.has(i.id));
        canvas.selectedId = null;
        canvas.selectedIds = [];
        renderCanvas();
        saveCanvasDebounced();
        e.preventDefault();
      }
    }

    function onCanvasKeyUp(e) {
      if (e.code === 'Space') {
        spaceDown = false;
        document.getElementById('canvasViewport')?.classList.remove('space-down');
      }
    }

    function toggleCanvasHelp(event) {
      event?.stopPropagation();
      document.getElementById('canvasHelp')?.classList.toggle('visible');
    }

    document.addEventListener('mousedown', (event) => {
      const help = document.getElementById('canvasHelp');
      if (!help?.classList.contains('visible')) return;
      if (event.target.closest('.canvas-help') || event.target.closest('.help-fab')) return;
      help.classList.remove('visible');
    }, true);

    async function onCanvasDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('dropOverlay')?.classList.remove('visible');

      const allFiles = Array.from(e.dataTransfer?.files || []);
      console.log(`[screen-notes] drop received ${allFiles.length} files:`,
        allFiles.map(f => `${f.name} (${f.type})`));

      const files = allFiles.filter(f => f.type.startsWith('image/'));
      if (!files.length) {
        if (allFiles.length) alert('Only image files are supported.');
        return;
      }

      const viewport = document.getElementById('canvasViewport');
      const rect = viewport.getBoundingClientRect();
      const dropX = (e.clientX - rect.left - canvas.x) / canvas.scale;
      const dropY = (e.clientY - rect.top - canvas.y) / canvas.scale;

      let offset = 0;
      for (const file of files) {
        await addImageItem(file, dropX + offset, dropY + offset);
        offset += 30;
      }
    }

    async function onImageUpload(e) {
      const files = Array.from(e.target.files || []);
      const viewport = document.getElementById('canvasViewport');
      const rect = viewport.getBoundingClientRect();
      const cx = (rect.width / 2 - canvas.x) / canvas.scale;
      const cy = (rect.height / 2 - canvas.y) / canvas.scale;
      let offset = 0;
      for (const file of files) {
        await addImageItem(file, cx + offset - 150, cy + offset - 100);
        offset += 30;
      }
      e.target.value = '';
    }

    async function addImageItem(file, x, y) {
      console.log(`[screen-notes] adding image: ${file.name} ${(file.size/1024).toFixed(1)} KB ${file.type}`);
      let url = null;
      try {
        const result = await quick.fs.uploadFile(file);
        console.log('[screen-notes] image upload response:', result);
        const f = result?.files?.[0] || result?.[0] || result?.file || null;
        url = f?.fullUrl || f?.url || result?.url || result?.fullUrl || null;
      } catch(err) {
        console.error('[screen-notes] image upload threw:', err);
        alert('Image upload failed: ' + (err?.message || err));
        return;
      }
      if (!url) {
        alert('Image upload returned no URL. Check console for response shape.');
        return;
      }
      // Get natural dimensions
      const dims = await new Promise(r => {
        const img = new Image();
        img.onload  = () => r({ w: img.naturalWidth, h: img.naturalHeight });
        img.onerror = () => r({ w: 300, h: 200 });
        img.src = url;
      });
      const maxW = 800;
      const ratio = dims.w > maxW ? maxW / dims.w : 1;
      pushUndoState();
      canvas.items.push({
        id: 'img-' + Math.random().toString(36).slice(2, 9),
        type: 'image',
        url,
        note: '',
        x, y,
        w: dims.w * ratio,
        h: dims.h * ratio,
      });
      renderCanvas();
      saveCanvasDebounced();
    }

    function addTextItem() {
      const viewport = document.getElementById('canvasViewport');
      const rect = viewport.getBoundingClientRect();
      const cx = (rect.width / 2 - canvas.x) / canvas.scale;
      const cy = (rect.height / 2 - canvas.y) / canvas.scale;
      const id = 'text-' + Math.random().toString(36).slice(2, 9);
      pushUndoState();
      canvas.items.push({
        id, type: 'text', text: 'Double-click to edit',
        x: cx - 100, y: cy - 20,
        w: 200, h: 60,
        fontSize: 16,
      });
      setSelectedItem(id);
      renderCanvas();
      saveCanvasDebounced();
      // Auto-edit
      requestAnimationFrame(() => {
        const el = document.querySelector(`[data-text-id="${id}"]`);
        if (el) startEditingText(el);
      });
    }

    function applyTransform() {
      const world = document.getElementById('canvasWorld');
      if (world) world.style.transform = `translate(${canvas.x}px, ${canvas.y}px) scale(${canvas.scale})`;
      updateZoomIndicator();
      updateCanvasGrid();
    }

    function updateItemPosition(item) {
      const el = document.querySelector(`.canvas-item[data-id="${item.id}"]`);
      if (el) {
        el.style.left = item.x + 'px';
        el.style.top = item.y + 'px';
      }
    }
    function updateItemSize(item) {
      const el = document.querySelector(`.canvas-item[data-id="${item.id}"]`);
      if (!el) return;
      el.style.width = item.w + 'px';
      if (item.type === 'screenshot') {
        // For screenshot cards, item.w/item.h bound the image; card width hugs the image.
        el.style.width = '';
        el.style.maxWidth = item.w + 'px';
        const wrap = el.querySelector('.ci-screenshot-img-wrap');
        if (wrap) {
          wrap.style.maxWidth = item.w + 'px';
          wrap.style.maxHeight = item.h + 'px';
          wrap.style.height = '';
        }
        const img = el.querySelector('.ci-screenshot-img-wrap img');
        if (img) {
          img.style.maxWidth = item.w + 'px';
          img.style.maxHeight = item.h + 'px';
        }
        el.style.height = '';
      } else if (item.type === 'image') {
        // For dropped image cards, item.h controls image height; note height is auto.
        const wrap = el.querySelector('.ci-image-img-wrap');
        if (wrap) wrap.style.height = item.h + 'px';
        el.style.height = '';
      } else if (item.type === 'text') {
        // Text item height is a minimum. Actual rendered height is content-driven.
        const textEl = el.querySelector('.ci-text');
        if (textEl) textEl.style.minHeight = item.h + 'px';
        el.style.height = '';
      } else {
        el.style.height = item.h + 'px';
      }
    }

    function getRenderedItemSize(item) {
      const el = document.querySelector(`.canvas-item[data-id="${item.id}"]`);
      if (el) {
        return {
          w: el.offsetWidth || item.w,
          h: el.offsetHeight || item.h,
        };
      }
      return { w: item.w || 1, h: item.h || 1 };
    }

    function getRenderedItemBounds(item) {
      const size = getRenderedItemSize(item);
      return {
        x1: item.x,
        y1: item.y,
        x2: item.x + size.w,
        y2: item.y + size.h,
        w: size.w,
        h: size.h,
      };
    }



    function getSnappedDragPosition(item, rawX, rawY) {
      const size = getRenderedItemSize(item);
      const threshold = SNAP_THRESHOLD_PX / canvas.scale;
      const movingX = [
        { value: rawX, offset: 0 },
        { value: rawX + size.w / 2, offset: size.w / 2 },
        { value: rawX + size.w, offset: size.w },
      ];
      const movingY = [
        { value: rawY, offset: 0 },
        { value: rawY + size.h / 2, offset: size.h / 2 },
        { value: rawY + size.h, offset: size.h },
      ];

      let bestX = null;
      let bestY = null;

      // Snap to other items (overrides grid if closer)
      let itemSnapX = null;
      let itemSnapY = null;
      const selectedSet = new Set(canvas.selectedIds);
      canvas.items.forEach(other => {
        if (other.id === item.id || selectedSet.has(other.id)) return;
        const b = getRenderedItemBounds(other);
        const targetX = [b.x1, b.x1 + b.w / 2, b.x2];
        const targetY = [b.y1, b.y1 + b.h / 2, b.y2];

        movingX.forEach(m => {
          targetX.forEach(t => {
            const diff = t - m.value;
            const abs = Math.abs(diff);
            if (abs <= threshold && (!bestX || abs < bestX.abs)) {
              bestX = { abs, diff, target: t };
              itemSnapX = t;
            }
          });
        });

        movingY.forEach(m => {
          targetY.forEach(t => {
            const diff = t - m.value;
            const abs = Math.abs(diff);
            if (abs <= threshold && (!bestY || abs < bestY.abs)) {
              bestY = { abs, diff, target: t };
              itemSnapY = t;
            }
          });
        });
      });

      return {
        x: rawX + (bestX ? bestX.diff : 0),
        y: rawY + (bestY ? bestY.diff : 0),
        guideX: itemSnapX,
        guideY: itemSnapY,
      };
    }

    function updateAlignmentGuides(worldX, worldY) {
      const vertical = document.getElementById('guideVertical');
      const horizontal = document.getElementById('guideHorizontal');

      if (vertical) {
        if (worldX == null) {
          vertical.style.display = 'none';
        } else {
          vertical.style.display = 'block';
          vertical.style.left = `${canvas.x + worldX * canvas.scale}px`;
        }
      }

      if (horizontal) {
        if (worldY == null) {
          horizontal.style.display = 'none';
        } else {
          horizontal.style.display = 'block';
          horizontal.style.top = `${canvas.y + worldY * canvas.scale}px`;
        }
      }
    }

    function clearAlignmentGuides() {
      const vertical = document.getElementById('guideVertical');
      const horizontal = document.getElementById('guideHorizontal');
      if (vertical) vertical.style.display = 'none';
      if (horizontal) horizontal.style.display = 'none';
    }

    function autoArrangeCanvas() {
      if (!canvas.items.length) return;
      pushUndoState();

      const gap = 48;

      // Preserve every layer's current size. Arrange only changes x/y.
      // Render once first so auto-height notes/text/images can be measured accurately.
      renderCanvas();

      const items = canvas.items;
      const measured = new Map(items.map(item => [item.id, getRenderedItemSize(item)]));
      const maxItemW = Math.max(...items.map(item => measured.get(item.id).w || item.w || 960));
      const cols = Math.max(1, Math.ceil(Math.sqrt(items.length)));
      const colW = maxItemW + gap;
      const colHeights = Array(cols).fill(0);

      items.forEach(item => {
        const size = measured.get(item.id) || { w: item.w, h: item.h };
        let col = 0;
        for (let i = 1; i < cols; i++) {
          if (colHeights[i] < colHeights[col]) col = i;
        }

        item.x = col * colW;
        item.y = colHeights[col];
        colHeights[col] += size.h + gap;
      });

      renderCanvas();
      fitToScreen(false);
      saveCanvasDebounced();
    }

    function fitToScreen(recordUndo = true) {
      if (recordUndo) pushUndoState();
      if (!canvas.items.length) { resetView(false); return; }
      const viewport = document.getElementById('canvasViewport');
      if (!viewport) return;
      const rect = viewport.getBoundingClientRect();
      const padding = 60;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      canvas.items.forEach(it => {
        const b = getRenderedItemBounds(it);
        minX = Math.min(minX, b.x1);
        minY = Math.min(minY, b.y1);
        maxX = Math.max(maxX, b.x2);
        maxY = Math.max(maxY, b.y2);
      });
      const contentW = Math.max(1, maxX - minX);
      const contentH = Math.max(1, maxY - minY);
      const scaleX = (rect.width - padding * 2) / contentW;
      const scaleY = (rect.height - padding * 2) / contentH;
      canvas.scale = Math.min(1, scaleX, scaleY);
      canvas.x = padding - minX * canvas.scale + (rect.width - padding * 2 - contentW * canvas.scale) / 2;
      canvas.y = padding - minY * canvas.scale + (rect.height - padding * 2 - contentH * canvas.scale) / 2;
      applyTransform();
      saveCanvasDebounced();
    }

    function resetView(recordUndo = true) {
      if (recordUndo) pushUndoState();
      canvas.scale = 1;
      canvas.x = 0;
      canvas.y = 0;
      applyTransform();
      saveCanvasDebounced();
    }

    function saveCanvasDebounced() {
      clearTimeout(canvas.saveTimer);
      canvas.saveTimer = setTimeout(async () => {
        if (!canvas.session) return;
        canvas.session.canvas = {
          viewport: { x: canvas.x, y: canvas.y, scale: canvas.scale },
          items: canvas.items,
        };
        await saveSession(canvas.session);
      }, 500);
    }

    // ── Utilities ──
    function formatDuration(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      const pad = n => String(n).padStart(2, '0');
      if (h > 0) return `${pad(h)}:${pad(m % 60)}:${pad(s % 60)}`;
      return `${pad(m)}:${pad(s % 60)}`;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    }

    function formatSessionDateOnly(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric'
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Event listeners ──
    document.getElementById('newSessionBtn').addEventListener('click', startRecording);

    // ── Boot ──
    init();
  </script>
</body>
</html>
