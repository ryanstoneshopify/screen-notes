            console.error('[screen-notes] ' + msg);
            if (indicator) indicator.innerHTML = `${icon('warning', 'icon icon-sm')} ${escapeHtml(msg)}`;
            return null;
          }
          return url;
        } catch(err) {
          console.error('[screen-notes] upload threw:', err);
          const msg = err?.message || err?.toString() || 'Unknown error';
          if (indicator) indicator.innerHTML = `${icon('warning', 'icon icon-sm')} ${escapeHtml(msg)}`;
          return null;
        }
      })();

      pendingScreenshot = { previewDataUrl: preview, uploadPromise, capturedTimestampMs: currentCaptureTimestampMs() };
      updateSaveNoteButtonState();

      uploadPromise.then(() => {});

      return pendingScreenshot;
    }

    function updateSaveNoteButtonState() {
      const input = document.getElementById('noteInput');
      const button = document.getElementById('saveNoteBtn');
      if (!button) return;
      const hasText = !!input?.value.trim();
      const hasScreenshot = !!pendingScreenshot && !screenshotRemoved;
      button.disabled = !(hasText || hasScreenshot);
    }

    async function retakeScreenshot(focusNoteInput = true) {
      pendingScreenshot = null;
      screenshotRemoved = false;
      updateSaveNoteButtonState();
      const indicator = document.getElementById('screenshotIndicator');
      if (indicator) indicator.innerHTML = '';
      const previewEl = document.getElementById('screenshotPreview');
      const previewTimestamp = document.getElementById('screenshotPreviewTimestamp');
      if (previewEl) previewEl.classList.remove('has-image', 'saving-out', 'capturing-image');
      if (previewTimestamp) previewTimestamp.innerHTML = '';
      await beginNoteScreenshotCapture();
      updateSaveNoteButtonState();
      const input = document.getElementById('noteInput');
      if (focusNoteInput) input?.focus();
    }

    function removeScreenshot() {
      pendingScreenshot = null;
      screenshotRemoved = true;
      const indicator = document.getElementById('screenshotIndicator');
      if (indicator) {
        indicator.classList.remove('visible');
        indicator.innerHTML = '';
      }
      const previewEl = document.getElementById('screenshotPreview');
      const previewImg = document.getElementById('screenshotPreviewImg');
      const previewTimestamp = document.getElementById('screenshotPreviewTimestamp');
      if (previewEl) previewEl.classList.remove('has-image', 'saving-out', 'capturing-image');
      if (previewImg) previewImg.src = '';
      if (previewTimestamp) previewTimestamp.innerHTML = '';
      updateSaveNoteButtonState();
    }

    function onNoteFocus() {
      if (suppressNextNoteFocusCapture) {
        suppressNextNoteFocusCapture = false;
        return;
      }
      // Preserve existing behaviour: clicking into the box captures the moment.
      beginNoteScreenshotCapture();
    }

    function onNoteInput() {
      // Important after saving: the textarea remains focused, so focus won't fire
      // again. The next screenshot should be captured when typing starts.
      const input = document.getElementById('noteInput');
      updateSaveNoteButtonState();
      if (input?.value.trim()) beginNoteScreenshotCapture().then(updateSaveNoteButtonState);
      requestAnimationFrame(updateVoiceDictationMarker);
    }

    function animateScreenshotPreviewOut() {
      const previewEl = document.getElementById('screenshotPreview');
      if (!previewEl?.classList.contains('has-image')) return Promise.resolve();
      previewEl.classList.remove('capturing-image');
      previewEl.classList.add('saving-out');
      return new Promise(resolve => window.setTimeout(resolve, 250));
    }

    function openPendingScreenshotLightbox() {
      openComposerMarkupLightbox();
    }

    async function addNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();

      let url = null;
      if (!screenshotRemoved) {
        if (!pendingScreenshot) {
          await beginNoteScreenshotCapture();
        }
        if (pendingScreenshot) {
          url = await pendingScreenshot.uploadPromise;
          if (!url) {
            alert('Screenshot upload failed — please try the note again.');
            return;
          }
        }
      }

      // Allow image-only or text-only notes, but don't save a completely empty note.
      if (!text && !url) return;

      const note = {
        text,
        screenshotUrl: url,    // null = text-only note (no screenshot)
        timestamp: pendingScreenshot?.capturedTimestampMs ?? currentCaptureTimestampMs(),
        createdAt: new Date().toISOString(),
      };
      // Carry composer markup over so the saved note stays re-editable
      if (url && pendingScreenshot?.markupStrokes) {
        note.markupStrokes = pendingScreenshot.markupStrokes;
        note.markupNatW = pendingScreenshot.markupNatW;
        note.markupNatH = pendingScreenshot.markupNatH;
        note._mkPreview = pendingScreenshot._mkPreview;
      }

      const saveButton = document.getElementById('saveNoteBtn');
      if (saveButton) saveButton.disabled = true;
      if (url) await animateScreenshotPreviewOut();

      currentNotes.push(note);
      enteringNoteCreatedAt = note.createdAt;
      input.value = '';
      input.scrollTop = 0;
      input.scrollLeft = 0;
      input.setSelectionRange(0, 0);
      pendingScreenshot = null;
      screenshotRemoved = false;
      voiceInterimStart = null;
      voiceInterimText = '';
      voiceCaptureOnFirstDictationText = voiceCommandsShouldListen && voiceNoteDictationActive;
      updateVoiceCommandControl();

      const indicator = document.getElementById('screenshotIndicator');
      if (indicator) indicator.classList.remove('visible');
      const previewEl = document.getElementById('screenshotPreview');
      const previewImg = document.getElementById('screenshotPreviewImg');
      const previewTimestamp = document.getElementById('screenshotPreviewTimestamp');
      if (previewEl) previewEl.classList.remove('has-image', 'saving-out', 'capturing-image');
      if (previewImg) previewImg.src = '';
      if (previewTimestamp) previewTimestamp.innerHTML = '';
      updateSaveNoteButtonState();

      // Save to DB (no data URLs included)
      const session = allSessions.find(s => s.id === activeSessionId);
      if (session) {
        session.notes = composedSessionNotes();
        session.duration = recordingBaseDuration + (Date.now() - recordingStartTime);
        await saveSession(session);
      }

      renderNotesList();
    }

    function deleteNote(index) {
      currentNotes.splice(index, 1);
      const session = allSessions.find(s => s.id === activeSessionId);
      if (session) {
        session.notes = composedSessionNotes();
        // Canvas is not created during recording, but if it exists later, keep
        // screenshot items aligned to the remaining note indexes.
        const fullIndex = recordingIntoCanvas ? recordingBaseNotes.length + index : index;
        if (session.canvas?.items) {
          session.canvas.items = session.canvas.items
            .filter(item => item.type !== 'screenshot' || item.noteIndex !== fullIndex)
            .map(item => item.type === 'screenshot' && item.noteIndex > fullIndex
              ? { ...item, noteIndex: item.noteIndex - 1 }
              : item);
        }
        saveSession(session);
      }
      renderNotesList();
    }

    async function updateRecordingNote(index, value) {
      if (!currentNotes[index]) return;
      currentNotes[index].text = value;
      const session = allSessions.find(s => s.id === activeSessionId);
      if (session) {
        session.notes = composedSessionNotes();
        await saveSession(session);
      }
    }

    async function uploadCurrentFrameScreenshot() {
      const blob = await captureScreenshotBlob();
      if (!blob) throw new Error('Could not capture a screenshot yet. Please try again.');
      const file = new File([blob], `screenshot-${Date.now()}.jpg`, { type: 'image/jpeg' });
      const r = await quick.fs.uploadFile(file);
      const f = r?.files?.[0] || r?.[0] || r?.file || null;
      const url = f?.fullUrl || f?.url || r?.url || r?.fullUrl || null;
      if (!url) throw new Error('Screenshot upload failed — please try again.');
      return url;
    }

    async function removeRecordingNoteScreenshot(index) {
      if (!currentNotes[index]) return;
      currentNotes[index].screenshotUrl = null;
      delete currentNotes[index].screenshot;
      const session = allSessions.find(s => s.id === activeSessionId);
      if (session) {
        session.notes = composedSessionNotes();
        await saveSession(session);
      }
      renderNotesList();
    }

    async function retakeRecordingNoteScreenshot(index) {
      if (!currentNotes[index]) return;
      try {
        const url = await uploadCurrentFrameScreenshot();
        currentNotes[index].screenshotUrl = url;
        currentNotes[index].timestamp = currentCaptureTimestampMs();
        delete currentNotes[index].screenshot;
        const session = allSessions.find(s => s.id === activeSessionId);
        if (session) {
          session.notes = composedSessionNotes();
          await saveSession(session);
        }
        renderNotesList();
      } catch (err) {
        alert(err?.message || 'Screenshot capture failed — please try again.');
      }
    }

    function startNotesPanelResize(e) {
      e.preventDefault();
      const handle = e.currentTarget;
      handle.classList.add('dragging');
      const root = document.documentElement;
      const startX = e.clientX;
      const startW = parseFloat(getComputedStyle(root).getPropertyValue('--notes-w')) || 400;
      const onMove = (ev) => {
        // Dragging left grows the panel
        const w = Math.min(800, Math.max(300, startW + (startX - ev.clientX)));
        root.style.setProperty('--notes-w', `${w}px`);
      };
      const onUp = () => {
        handle.classList.remove('dragging');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        growAllNoteTextareas();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    function growAllNoteTextareas() {
      document.querySelectorAll('.recording-note-edit').forEach(autoGrowTextarea);
    }

    function autoGrowTextarea(el) {
      el.style.height = 'auto';
      el.style.height = `${el.scrollHeight}px`;
    }

    // ── Lightbox ──
    function openLightbox(src) {
      const lb = document.createElement('div');
      lb.className = 'lightbox';
      lb.innerHTML = `<img src="${src}" alt="Screenshot">`;
      lb.onclick = () => {
        lb.classList.remove('show');
        setTimeout(() => lb.remove(), 200);
      };
      document.body.appendChild(lb);
      requestAnimationFrame(() => lb.classList.add('show'));
    }

    // ── Rendering ──
    // ── Theme ──
    function isDarkMode() {
      return document.documentElement.classList.contains('dark');
    }
    function toggleTheme() {
      const dark = !isDarkMode();
      document.documentElement.classList.toggle('dark', dark);
      try { localStorage.setItem('sn-theme', dark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('themeToggle');
      if (btn) {
        btn.innerHTML = icon(dark ? 'sun' : 'moon');
        const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
        btn.title = label;
        btn.setAttribute('aria-label', label);
      }
    }

    function render() {
      const appLayout = document.getElementById('appLayout');
      appLayout?.classList.toggle('recording-active', isRecording);
      appLayout?.classList.toggle('session-active', !!activeSessionId && !isRecording);
      document.body.classList.toggle('recording-active', isRecording);
      updateNavPill();
      renderSidebar();
      renderMain();
    }

    function updateNavPill() {
      const label = document.getElementById('navPillLabel');
      if (!label) return;
      const session = activeSessionId && !isRecording
        ? allSessions.find(s => s.id === activeSessionId) : null;
      label.textContent = session ? (session.title || 'Untitled session') : 'Screen Notes';
    }

    // True when the user explicitly collapsed the drawer on a large screen —
    // resizing bigger won't auto-reopen it in that case.
    let drawerUserCollapsed = false;

    function toggleNavDrawer(e) {
      e?.stopPropagation();
      const drawer = document.getElementById('sidebarDrawer');
      if (!drawer) return;
      const opening = !drawer.classList.contains('open');
      if (window.innerWidth >= 900) drawerUserCollapsed = !opening;
      else if (opening) drawerUserCollapsed = false;
      drawer.classList.toggle('open', opening);
      document.getElementById('navPill')?.classList.toggle('drawer-open', opening);
      if (opening) {
        setTimeout(() => document.addEventListener('mousedown', onNavDrawerOutside, true), 0);
      } else {
        document.removeEventListener('mousedown', onNavDrawerOutside, true);
      }
    }

    // force = explicit user action (close button). Automatic closes only apply below 900px.
    function closeNavDrawer(force = false) {
      if (!force && window.innerWidth >= 900) return;
      const drawer = document.getElementById('sidebarDrawer');
      if (drawer?.classList.contains('open')) {
        if (force && window.innerWidth >= 900) drawerUserCollapsed = true;
        drawer.classList.remove('open');
        document.getElementById('navPill')?.classList.remove('drawer-open');
        document.removeEventListener('mousedown', onNavDrawerOutside, true);
      }
    }

    // Auto-condense below 900px; auto-expand again when the window grows,
    // unless the user deliberately collapsed it at a larger size.
    let navDrawerWasWide = window.innerWidth >= 900;
    window.addEventListener('resize', () => {
      const wide = window.innerWidth >= 900;
      if (!wide) {
        closeNavDrawer();
      } else if (!navDrawerWasWide && !drawerUserCollapsed) {
        document.getElementById('sidebarDrawer')?.classList.add('open');
        document.getElementById('navPill')?.classList.add('drawer-open');
      }
      navDrawerWasWide = wide;
    });

    function onNavDrawerOutside(e) {
      const drawer = document.getElementById('sidebarDrawer');
      if (!drawer) return;
      if (drawer.contains(e.target) || e.target.closest('.nav-pill') || e.target.closest('.session-menu-popover')) return;
      closeNavDrawer();
    }

    function ownerLabel(session) {
      if (isMySession(session)) return session.ownerName || currentUser?.fullName || currentUser?.email || 'You';
      return session.ownerName || session.ownerEmail || 'Unknown owner';
    }

    function setSessionListTab(tab) {
      sessionListTab = tab;
      renderSidebar();
    }

    function renderSidebar() {
      document.getElementById('sessionTabs')?.setAttribute('data-active', sessionListTab);
      document.getElementById('sessionsTabYours')?.classList.toggle('active', sessionListTab === 'yours');
      document.getElementById('sessionsTabOthers')?.classList.toggle('active', sessionListTab === 'others');

      const renderSessionItem = (s) => `
        <div class="session-item ${s.id === activeSessionId ? 'active' : ''}"
             data-session-id="${s.id}"
             onclick="viewSession('${s.id}')">
          ${renamingSessionId === s.id
            ? `<input class="session-title-input" value="${escapeHtml(s.title)}"
                      onclick="event.stopPropagation()"
                      onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){renamingSessionId=null;renderSidebar();}"
                      onblur="commitRenameSession('${s.id}', this.value)">`
            : `<div class="session-item-title">${escapeHtml(s.title)}</div>`}
          ${isMySession(s) ? `<button class="session-menu-btn" title="More actions"
                  onclick="event.stopPropagation(); openSessionMenu(event, '${s.id}')">${icon('more')}</button>` : ''}
          <div class="session-item-meta">
            ${sessionListTab === 'others' ? `
              <span>${escapeHtml(ownerLabel(s))}</span>
              <span class="session-meta-separator">•</span>
            ` : ''}
            <span>${formatSessionDateOnly(s.created_at)}</span>
          </div>
        </div>
      `;

      const list = document.getElementById('sessionList');
      const visibleSessions = sessionListTab === 'others' ? sharedSessions : sessions;
      if (visibleSessions.length === 0) {
        list.innerHTML = `<div class="session-empty-state">${sessionListTab === 'others' ? 'No sessions shared with you' : 'No sessions'}</div>`;
        return;
      }
      list.innerHTML = visibleSessions.map(renderSessionItem).join('');

      if (renamingSessionId) {
        const input = list.querySelector('.session-title-input');
        if (input) { input.focus(); input.select(); }
      }
    }

    // ── Session item menu ──
    let renamingSessionId = null;
    let openMenuEl = null;

    function closeSessionMenu() {
      if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; }
      document.querySelectorAll('.session-menu-btn.open').forEach(b => b.classList.remove('open'));
      document.removeEventListener('mousedown', onSessionMenuOutside, true);
    }

    function onSessionMenuOutside(e) {
      if (openMenuEl && !openMenuEl.contains(e.target)) closeSessionMenu();
    }

    // ── "New" popover (sidebar plus) ──
    let newMenuEl = null;
    let newMenuBtn = null;
    function closeNewMenu() {
      if (newMenuEl) { newMenuEl.remove(); newMenuEl = null; }
      newMenuBtn?.classList.remove('open');
      newMenuBtn = null;
      document.removeEventListener('mousedown', onNewMenuOutside, true);
    }
    function onNewMenuOutside(e) {
      if (newMenuEl && !newMenuEl.contains(e.target)) closeNewMenu();
    }
    function openNewMenu(event) {
      if (newMenuEl) { closeNewMenu(); return; }
      const btn = event.currentTarget;
      btn.classList.add('open');
      newMenuBtn = btn;
      const menu = document.createElement('div');
      menu.className = 'session-menu-popover';
      menu.innerHTML = `
        <button class="session-menu-item" onclick="closeNewMenu(); startRecording()">${icon('camcorder')} Session</button>
        <button class="session-menu-item" onclick="closeNewMenu(); createNewCanvas()">${icon('cursor')} Canvas</button>
      `;
      document.body.appendChild(menu);
      const r = btn.getBoundingClientRect();
      const mw = menu.offsetWidth, mh = menu.offsetHeight;
      let left = r.right - mw;
      let top = r.bottom + 6;
      if (top + mh > window.innerHeight - 8) top = r.top - mh - 6;
      if (left < 8) left = 8;
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
      newMenuEl = menu;
      document.addEventListener('mousedown', onNewMenuOutside, true);
    }

    function openSessionMenu(event, id) {
      if (openMenuEl) { closeSessionMenu(); return; }
      const btn = event.currentTarget;
      btn.classList.add('open');
      const menu = document.createElement('div');
      menu.className = 'session-menu-popover';
      menu.innerHTML = `
        <button class="session-menu-item" onclick="menuShareSession('${id}')">${icon('link')} Share</button>
        <button class="session-menu-item" onclick="menuRenameSession('${id}')">${icon('pencil')} Rename</button>
        <button class="session-menu-item danger" onclick="menuDeleteSession('${id}')">${icon('trash')} Delete</button>
      `;
      document.body.appendChild(menu);
      const r = btn.getBoundingClientRect();
      const mw = menu.offsetWidth, mh = menu.offsetHeight;
      let left = r.right - mw;
      let top = r.bottom + 6;
      if (top + mh > window.innerHeight - 8) top = r.top - mh - 6;
      if (left < 8) left = 8;
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
      openMenuEl = menu;
      document.addEventListener('mousedown', onSessionMenuOutside, true);
    }

    async function menuShareSession(id) {
      closeSessionMenu();
      const session = allSessions.find(s => s.id === id);
      if (session && canViewSession(session)) openShareModal(id);
      else { await shareSession(id); showToast('Link copied'); }
    }

    function menuRenameSession(id) {
      closeSessionMenu();
      renamingSessionId = id;
      renderSidebar();
    }

    async function menuDeleteSession(id) {
      closeSessionMenu();
      const deleted = await deleteSession(id);
      if (deleted) showToast('Session deleted');
    }

    async function commitRenameSession(id, value) {
      if (renamingSessionId !== id) return;
      renamingSessionId = null;
      const session = allSessions.find(s => s.id === id);
      const newTitle = value.trim() || 'Untitled session';
      const changed = session && session.title !== newTitle;
      await renameSession(id, newTitle);
      renderSidebar();
      if (activeSessionId === id) {
        renderMain();
        const s2 = allSessions.find(s => s.id === id);
        if (s2) requestAnimationFrame(() => initCanvas(s2));
      }
      if (changed) showToast('Session renamed');
    }

    // ── Center toast ──
    let toastTimer = null;
    function showToast(message) {
      let toast = document.getElementById('centerToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'centerToast';
        toast.className = 'toast-center';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      const toolbar = document.querySelector('.canvas-toolbar');
      if (toolbar) {
        // Emerge from behind the canvas toolbar, resting 24px above it
        const r = toolbar.getBoundingClientRect();
        toast.style.left = `${r.left + r.width / 2}px`;
        toast.style.bottom = `${window.innerHeight - r.top + 24}px`;
        toast.style.zIndex = '15'; // below .canvas-toolbar (20)
      } else {
        const main = document.getElementById('mainContent');
        if (main) {
          const r = main.getBoundingClientRect();
          toast.style.left = `${r.left + r.width / 2}px`;
        }
        toast.style.bottom = '24px';
        toast.style.zIndex = '500';
      }
      clearTimeout(toastTimer);
      toast.classList.remove('visible');
      void toast.offsetHeight; // restart animation from below
      requestAnimationFrame(() => toast.classList.add('visible'));
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 1000 + 1000);
    }

    // ── Sidebar resize ──
    function initSidebarResize() {
      const handle = document.getElementById('sidebarResize');
      const sidebar = document.querySelector('.sidebar');
      if (!handle || !sidebar) return;
      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handle.classList.add('dragging');
        const startX = e.clientX;
        const startW = sidebar.getBoundingClientRect().width;
        const onMove = (ev) => {
          const w = Math.min(400, Math.max(240, startW + (ev.clientX - startX)));
          sidebar.style.width = `${w}px`;
          document.documentElement.style.setProperty('--sidebar-w', `${w}px`);
        };
        const onUp = () => {
          handle.classList.remove('dragging');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    // ── Markup (draw on images / canvas) ──
    const markupStyle = { color: '#e5484d', width: 3, dash: 'solid' };
    const canvasMarkup = { active: false };
    let noteMarkup = null; // { noteIndex, strokes, src, natW, natH }

    function markupControlsHTML() {
      return `
        <input type="color" class="mk-color" value="${markupStyle.color}" oninput="setMarkupStyle('color', this.value)" title="Line color">
        <span class="mk-width-val">${markupStyle.width}</span>
        <input type="range" class="mk-width" min="1" max="12" step="1" value="${markupStyle.width}" style="--mk-fill: ${(markupStyle.width - 1) / 11 * 100}%" oninput="setMarkupStyle('width', this.value)" title="Line width">
        <button type="button" class="tb-btn mk-style-btn${markupStyle.dash === 'solid' ? ' active' : ''}" data-dash="solid" onclick="setMarkupStyle('dash', 'solid')" title="Solid line"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h18"/></svg></button>
        <button type="button" class="tb-btn mk-style-btn${markupStyle.dash === 'dashed' ? ' active' : ''}" data-dash="dashed" onclick="setMarkupStyle('dash', 'dashed')" title="Dashed line"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3.2" aria-hidden="true"><path d="M3 12h18"/></svg></button>`;
    }

    function setMarkupStyle(key, value) {
      markupStyle[key] = key === 'width' ? Number(value) : value;
      document.querySelectorAll('.mk-width-val').forEach(el => { el.textContent = markupStyle.width; });
      if (key === 'width') {
        document.querySelectorAll('.mk-width').forEach(el => {
          el.style.setProperty('--mk-fill', `${(markupStyle.width - 1) / 11 * 100}%`);
        });
      }
      if (key === 'dash') {
        document.querySelectorAll('.mk-style-btn').forEach(el => {
          el.classList.toggle('active', el.dataset.dash === markupStyle.dash);
        });
      }
    }

    function strokePathD(points) {
      return points.map(([x, y], i) => `${i ? 'L' : 'M'}${x} ${y}`).join(' ');
    }

    function strokeDashAttr(stroke, scale = 1) {
      return stroke.dash === 'dashed'
        ? ` stroke-dasharray="${stroke.width * 3 * scale} ${stroke.width * 2.5 * scale}"`
        : '';
    }

    function drawStrokesOnContext(ctx, strokes) {
      strokes.forEach(s => {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.setLineDash(s.dash === 'dashed' ? [s.width * 3, s.width * 2.5] : []);
        ctx.beginPath();
        s.points.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.stroke();
      });
    }

    function loadMarkupImage(src) {
      return new Promise((resolve, reject) => {
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = () => resolve(im);
        im.onerror = reject;
        im.src = src;
      });
    }

    // ── Note markup lightbox (recording rail) ──
    function openMarkupLightbox(noteIndex) {
      const note = currentNotes[noteIndex];
      const src = note && (note.markupOriginalUrl || note.screenshotUrl || note.screenshot);
      if (!src) return;
      openMarkupSession({ mode: 'note', noteIndex, src, strokes: note.markupStrokes || [] });
    }

    async function openComposerMarkupLightbox(e) {
      e?.stopPropagation();
      if (!pendingScreenshot || screenshotRemoved) return;
      const src = await pendingScreenshot.uploadPromise;
      if (!src) return showToast('Screenshot is still uploading…');
      if (!pendingScreenshot || screenshotRemoved) return; // may have changed while awaiting
      openMarkupSession({ mode: 'composer', src, strokes: pendingScreenshot.markupStrokes || [] });
    }

    function openMarkupSession({ mode, noteIndex = null, src, strokes }) {
      document.getElementById('markupLightbox')?.remove();
      noteMarkup = {
        mode, noteIndex, src,
        strokes: JSON.parse(JSON.stringify(strokes || [])),
        natW: 0, natH: 0, tool: 'cursor', selectedIds: [], marquee: null, dirty: false,
      };
      const lb = document.createElement('div');
      lb.className = 'lightbox markup-lightbox';
      lb.id = 'markupLightbox';
      lb.innerHTML = `
        <div class="markup-stage">
          <img id="markupImg" src="${src}" alt="Screenshot" draggable="false">
          <svg class="markup-svg" id="markupSvg" preserveAspectRatio="none"></svg>
          <div class="markup-toolbar" id="markupToolbar">
            <div class="markup-tools" id="markupTools">${markupControlsHTML()}<div class="tb-divider"></div></div>
            <button class="tb-btn tb-markup-toggle" id="lbCursorBtn" onclick="setLightboxTool('cursor')" title="Cursor (⇧C)">${icon('cursor')}</button>
            <button class="tb-btn tb-markup-toggle active" id="lbDrawBtn" onclick="setLightboxTool('draw')" title="Draw (⇧D)">${icon('scribble')}</button>
          </div>
        </div>`;
      document.body.appendChild(lb);
      const img = lb.querySelector('#markupImg');
      const ready = () => {
        noteMarkup.natW = img.naturalWidth;
        noteMarkup.natH = img.naturalHeight;
        const svg = lb.querySelector('#markupSvg');
        svg.setAttribute('viewBox', `0 0 ${noteMarkup.natW} ${noteMarkup.natH}`);
        renderNoteMarkupSvg();
        attachNoteMarkupDrawing(svg);
        // Measured max-width so collapse/expand animate symmetrically
        const tools = lb.querySelector('#markupTools');
        if (tools) tools.style.maxWidth = noteMarkup.tool === 'cursor' ? '0px' : `${tools.scrollWidth}px`;
      };
      if (img.complete && img.naturalWidth) ready(); else img.onload = ready;
      // Opens in cursor mode: tools collapsed, mode toggle visible
      lb.querySelector('#markupToolbar')?.classList.add('cursor-mode');
      lb.querySelector('#markupSvg')?.classList.add('cursor-mode');
      lb.querySelector('#lbCursorBtn')?.classList.add('active');
      lb.querySelector('#lbDrawBtn')?.classList.remove('active');
      lb.addEventListener('mousedown', (e) => { if (e.target === lb) closeMarkupLightbox(); });
      document.addEventListener('keydown', onMarkupKeydown);
      requestAnimationFrame(() => requestAnimationFrame(() => lb.classList.add('show', 'in')));
    }

    // Auto-save: every change persists after a short debounce
    let markupSaveTimer = null;
    function markupChanged() {
      if (!noteMarkup) return;
      noteMarkup.dirty = true;
      clearTimeout(markupSaveTimer);
      const state = noteMarkup;
      markupSaveTimer = setTimeout(() => persistMarkup(state), 600);
    }

    function setLightboxTool(tool) {
      if (!noteMarkup) return;
      noteMarkup.tool = tool;
      noteMarkup.selectedIds = [];
      const tools = document.getElementById('markupTools');
      if (tools) tools.style.maxWidth = tool === 'cursor' ? '0px' : `${tools.scrollWidth}px`;
      document.getElementById('markupToolbar')?.classList.toggle('cursor-mode', tool === 'cursor');
      document.getElementById('markupSvg')?.classList.toggle('cursor-mode', tool === 'cursor');
      document.getElementById('lbCursorBtn')?.classList.toggle('active', tool === 'cursor');
      document.getElementById('lbDrawBtn')?.classList.toggle('active', tool === 'draw');
      renderNoteMarkupSvg();
    }

    function onMarkupKeydown(e) {
      if (!noteMarkup) return;
      if (e.key === 'Escape') {
        closeMarkupLightbox();
        e.preventDefault();
        return;
      }
      // Shift+C / Shift+D — switch between cursor and draw mode
      if (e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey && ['c', 'd'].includes(e.key.toLowerCase())
          && !e.target.matches?.('input, textarea, select, [contenteditable="true"]')) {
        setLightboxTool(e.key.toLowerCase() === 'd' ? 'draw' : 'cursor');
        e.preventDefault();
        return;
      }
      if ((e.key === 'Delete' || e.key === 'Backspace') && noteMarkup.selectedIds.length
          && !e.target.matches?.('input, textarea, select, [contenteditable="true"]')) {
        noteMarkup.strokes = noteMarkup.strokes.filter(s => !noteMarkup.selectedIds.includes(s.id));
        noteMarkup.selectedIds = [];
        renderNoteMarkupSvg();
        markupChanged();
        e.preventDefault();
      }
    }

    function closeMarkupLightbox() {
      const lb = document.getElementById('markupLightbox');
      const state = noteMarkup;
      noteMarkup = null;
      clearTimeout(markupSaveTimer);
      if (state?.dirty) persistMarkup(state); // flush pending auto-save
      document.removeEventListener('keydown', onMarkupKeydown);
      if (!lb) return;
      lb.classList.remove('show', 'in');
      lb.style.pointerEvents = 'none';
      setTimeout(() => lb.remove(), 400);
    }

    function markupStrokeBBox(s) {
      const xs = s.points.map(p => p[0]);
      const ys = s.points.map(p => p[1]);
      const pad = s.width / 2 + 4;
      const x = Math.min(...xs) - pad;
      const y = Math.min(...ys) - pad;
      return { x, y, w: Math.max(...xs) - Math.min(...xs) + pad * 2, h: Math.max(...ys) - Math.min(...ys) + pad * 2 };
    }

    function markupNatScale() {
      const svg = document.getElementById('markupSvg');
      const w = svg?.getBoundingClientRect().width;
      return w && noteMarkup ? noteMarkup.natW / w : 1;
    }

    function markupSelectedStrokes() {
      return noteMarkup ? noteMarkup.strokes.filter(s => noteMarkup.selectedIds.includes(s.id)) : [];
    }

    function markupUnionBBox(strokes) {
      const boxes = strokes.map(markupStrokeBBox);
      const x = Math.min(...boxes.map(b => b.x));
      const y = Math.min(...boxes.map(b => b.y));
      return {
        x, y,
        w: Math.max(...boxes.map(b => b.x + b.w)) - x,
        h: Math.max(...boxes.map(b => b.y + b.h)) - y,
      };
    }

    function renderNoteMarkupSvg() {
      const svg = document.getElementById('markupSvg');
      if (!svg || !noteMarkup) return;
      const k = markupNatScale(); // screen px → image px
      const paths = noteMarkup.strokes.map(s =>
        `<path d="${strokePathD(s.points)}" data-stroke-id="${s.id}" fill="none" stroke="${s.color}" stroke-width="${s.width}" stroke-linecap="round" stroke-linejoin="round"${strokeDashAttr(s)}/>`
      ).join('');
      // Selection UI matches the canvas: solid outline + round terra-cotta handle
      let selection = '';
      const selected = markupSelectedStrokes();
      if (selected.length) {
        const bb = markupUnionBBox(selected);
        selection = `
          <rect data-mk-move="1" x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" fill="rgba(0,0,0,0)" pointer-events="all" style="cursor:grab"/>
          <rect x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" rx="${9.6 * k}" fill="none" stroke-width="${2 * k}" pointer-events="none" style="stroke: var(--terra-cotta)"/>
          <circle data-mk-handle="1" cx="${bb.x + bb.w}" cy="${bb.y + bb.h}" r="${7 * k}" stroke-width="${2 * k}" pointer-events="all" style="cursor:nwse-resize; fill: var(--terra-cotta); stroke: var(--vellum-white)"/>`;
      }
      let marquee = '';
      if (noteMarkup.marquee) {
        const m = noteMarkup.marquee;
        marquee = `<rect x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" rx="${4 * k}" fill="rgba(204,219,232,0.28)" stroke="rgba(31,30,29,0.55)" stroke-width="${1 * k}" pointer-events="none"/>`;
      }
      svg.innerHTML = paths + selection + marquee;
    }

    function attachNoteMarkupDrawing(svg) {
      const toNatural = (e) => {
        const r = svg.getBoundingClientRect();
        return [
          Math.round((e.clientX - r.left) / r.width * noteMarkup.natW * 10) / 10,
          Math.round((e.clientY - r.top) / r.height * noteMarkup.natH * 10) / 10,
        ];
      };
      svg.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || !noteMarkup) return;
        e.preventDefault();
        e.stopPropagation();
        if (noteMarkup.tool === 'cursor') {
          // Resize the selection from the corner handle
          if (e.target.dataset?.mkHandle) {
            const sel = markupSelectedStrokes();
            if (!sel.length) return;
            const bb = markupUnionBBox(sel);
            const start = toNatural(e);
            const snapshots = sel.map(s => ({ s, pts: s.points.map(p => [...p]) }));
            const onMove = ev => {
              const p = toNatural(ev);
              const sx = Math.max(0.05, (bb.w + p[0] - start[0]) / bb.w);
              const sy = Math.max(0.05, (bb.h + p[1] - start[1]) / bb.h);
              snapshots.forEach(({ s, pts }) => {
                s.points = pts.map(([x, y]) => [
                  Math.round((bb.x + (x - bb.x) * sx) * 10) / 10,
                  Math.round((bb.y + (y - bb.y) * sy) * 10) / 10,
                ]);
              });
              renderNoteMarkupSvg();
            };
            const onUp = () => {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
              markupChanged();
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
            return;
          }
          // Drag inside the selection bounds, or on a line (selecting it first)
          const hitId = e.target.closest('path[data-stroke-id]')?.dataset.strokeId;
          if (e.target.dataset?.mkMove || hitId) {
            if (hitId && !noteMarkup.selectedIds.includes(hitId)) noteMarkup.selectedIds = [hitId];
            renderNoteMarkupSvg();
            const sel = markupSelectedStrokes();
            let last = toNatural(e);
            const onMove = ev => {
              const p = toNatural(ev);
              const dx = p[0] - last[0];
              const dy = p[1] - last[1];
              last = p;
              sel.forEach(s => {
                s.points = s.points.map(([x, y]) => [Math.round((x + dx) * 10) / 10, Math.round((y + dy) * 10) / 10]);
              });
              renderNoteMarkupSvg();
            };
            const onUp = () => {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
              markupChanged();
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
            return;
          }
          // Empty area: marquee to select squiggles
          noteMarkup.selectedIds = [];
          const start = toNatural(e);
          const onMove = ev => {
            const p = toNatural(ev);
            noteMarkup.marquee = {
              x: Math.min(start[0], p[0]),
              y: Math.min(start[1], p[1]),
              w: Math.abs(p[0] - start[0]),
              h: Math.abs(p[1] - start[1]),
            };
            renderNoteMarkupSvg();
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            const m = noteMarkup?.marquee;
            if (noteMarkup) {
              if (m && m.w > 2 && m.h > 2) {
                noteMarkup.selectedIds = noteMarkup.strokes.filter(s => {
                  const b = markupStrokeBBox(s);
                  return b.x < m.x + m.w && b.x + b.w > m.x && b.y < m.y + m.h && b.y + b.h > m.y;
                }).map(s => s.id);
              }
              noteMarkup.marquee = null;
              renderNoteMarkupSvg();
            }
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
          renderNoteMarkupSvg();
          return;
        }
        // Width slider is in screen px; store in image px so it bakes 1:1
        const scale = noteMarkup.natW / svg.getBoundingClientRect().width;
        const stroke = {
          id: `mk-${Math.random().toString(36).slice(2, 9)}`,
          color: markupStyle.color,
          width: Math.max(1, Math.round(markupStyle.width * scale * 10) / 10),
          dash: markupStyle.dash,
          points: [toNatural(e)],
        };
        noteMarkup.strokes.push(stroke);
        const onMove = ev => { stroke.points.push(toNatural(ev)); renderNoteMarkupSvg(); };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          if (stroke.points.length < 2 && noteMarkup) {
            noteMarkup.strokes = noteMarkup.strokes.filter(s => s !== stroke);
          }
          renderNoteMarkupSvg();
          markupChanged();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        renderNoteMarkupSvg();
      });
    }

    // Display-only composite (data URL, never persisted or exported directly)
    async function bakeMarkupDataUrl(originalSrc, strokes) {
      const img = await loadMarkupImage(originalSrc);
      const cnv = document.createElement('canvas');
      cnv.width = img.naturalWidth;
      cnv.height = img.naturalHeight;
      const ctx = cnv.getContext('2d');
      ctx.drawImage(img, 0, 0);
      drawStrokesOnContext(ctx, strokes);
      return cnv.toDataURL('image/jpeg', 0.9);
    }

    async function persistMarkup(state) {
      if (!state) return;
      state.dirty = false;
      const strokes = JSON.parse(JSON.stringify(state.strokes));
      try {
        if (state.mode === 'composer') {
          if (!pendingScreenshot) return;
          const previewImg = document.getElementById('screenshotPreviewImg');
          if (!strokes.length) {
            delete pendingScreenshot.markupStrokes;
            delete pendingScreenshot.markupNatW;
            delete pendingScreenshot.markupNatH;
            delete pendingScreenshot._mkPreview;
            if (previewImg) previewImg.src = state.src;
          } else {
            pendingScreenshot.markupStrokes = strokes;
            pendingScreenshot.markupNatW = state.natW;
            pendingScreenshot.markupNatH = state.natH;
            pendingScreenshot._mkPreview = await bakeMarkupDataUrl(state.src, strokes);
            if (previewImg) previewImg.src = pendingScreenshot._mkPreview;
          }
        } else {
          const note = currentNotes[state.noteIndex];
          if (!note) return;
          // Migrate legacy baked markup back to the original image
          if (note.markupOriginalUrl) {
            note.screenshotUrl = note.markupOriginalUrl;
            delete note.markupOriginalUrl;
          }
          if (!strokes.length) {
            delete note.markupStrokes;
            delete note.markupNatW;
            delete note.markupNatH;
            delete note._mkPreview;
          } else {
            note.markupStrokes = strokes;
            note.markupNatW = state.natW;
            note.markupNatH = state.natH;
            note._mkPreview = await bakeMarkupDataUrl(state.src, strokes);
            console.log('[screen-notes] markup persist', {
              natW: state.natW, natH: state.natH,
              maxX: Math.max(...strokes.flatMap(s => s.points.map(p => p[0]))),
              maxY: Math.max(...strokes.flatMap(s => s.points.map(p => p[1]))),
            });
          }
          const session = allSessions.find(s => s.id === activeSessionId);
          if (session) {
            session.notes = composedSessionNotes();
            await saveSession(session);
          }
          renderNotesList();
        }
      } catch (err) {
        console.error('[screen-notes] markup save failed', err);
        showToast('Could not save markup');
      }
    }

    // ── Canvas markup mode ──
    function tbGroupContentWidth(group, gap) {
      const visible = [...group.children].filter(el => getComputedStyle(el).display !== 'none');
      return visible.reduce((w, el) => {
        const s = getComputedStyle(el);
        return w + el.offsetWidth + (parseFloat(s.marginLeft) || 0) + (parseFloat(s.marginRight) || 0);
      }, 0) + gap * Math.max(0, visible.length - 1);
    }

    // Draw mode has fewer controls — the toolbar hugs them instead of keeping
    // the default group's width (animated with the same ease-out).
    function syncToolbarWidth(active) {
      const swap = document.querySelector('#canvasToolbar .tb-swap');
      if (!swap) return;
      const def = swap.querySelector('.tb-default');
      const mk = swap.querySelector('.tb-markup-controls');
      if (!def || !mk) return;
      const from = swap.offsetWidth;
      const to = active ? tbGroupContentWidth(mk, 10) : tbGroupContentWidth(def, 4);
      swap.style.width = `${from}px`;
      void swap.offsetWidth; // flush so the width change transitions
      swap.style.width = `${to}px`;
    }

    function setCanvasMarkup(active) {
      if (active && canvasReadOnly()) return;
      if (canvasMarkup.active === active) return;
      canvasMarkup.active = active;
      document.getElementById('canvasToolbar')?.classList.toggle('markup-mode', active);
      document.getElementById('markupToggleBtn')?.classList.toggle('active', active);
      document.getElementById('markupCursorBtn')?.classList.toggle('active', !active);
      document.getElementById('canvasViewport')?.classList.toggle('markup-mode', active);
      syncToolbarWidth(active);
      if (active) setSelectedItems([]);
    }

    function handleMarkupCanvasMouseDown(e) {
      if (e.button !== 0 || spaceDown) return false;
      if (e.target.closest('.canvas-toolbar, .canvas-help, .help-fab, .zoom-indicator')) return false;
      const viewport = document.getElementById('canvasViewport');
      if (!viewport) return false;
      const rect = viewport.getBoundingClientRect();
      const toWorld = (ev) => [
        Math.round((ev.clientX - rect.left - canvas.x) / canvas.scale * 10) / 10,
        Math.round((ev.clientY - rect.top - canvas.y) / canvas.scale * 10) / 10,
      ];
      const stroke = {
        id: newCanvasItemId('stroke'),
        type: 'stroke',
        color: markupStyle.color,
        width: markupStyle.width,
        dash: markupStyle.dash,
        points: [toWorld(e)],
      };
      const live = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      live.setAttribute('class', 'markup-live');
      viewport.appendChild(live);
      const draw = () => {
        const pts = stroke.points.map(([x, y]) => [x * canvas.scale + canvas.x, y * canvas.scale + canvas.y]);
        live.innerHTML = `<path d="${strokePathD(pts)}" fill="none" stroke="${stroke.color}" stroke-width="${stroke.width * canvas.scale}" stroke-linecap="round" stroke-linejoin="round"${strokeDashAttr(stroke, canvas.scale)}/>`;
      };
      const onMove = ev => { stroke.points.push(toWorld(ev)); draw(); };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        live.remove();
        if (stroke.points.length >= 2) {
          const xs = stroke.points.map(p => p[0]);
          const ys = stroke.points.map(p => p[1]);
          stroke.x = Math.min(...xs) - stroke.width;
          stroke.y = Math.min(...ys) - stroke.width;
          stroke.w = Math.max(...xs) - Math.min(...xs) + stroke.width * 2;
          stroke.h = Math.max(...ys) - Math.min(...ys) + stroke.width * 2;
          // Points stored relative to the item origin so dragging the item moves the stroke
          stroke.points = stroke.points.map(([px, py]) => [px - stroke.x, py - stroke.y]);
          // Original bounds = SVG viewBox; resizing stretches the path against these
          stroke.vw = stroke.w;
          stroke.vh = stroke.h;
          pushUndoState();
          canvas.items.push(stroke);
          renderCanvas();
          saveCanvasDebounced();
        }
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      draw();
      e.preventDefault();
      return true;
    }

    // Unconverted lightbox squiggles (session never opened on canvas) bake at export
    async function bakeNoteMarkupIntoBlob(note, blob) {
      try {
        if (!note?.markupStrokes?.length) return blob;
        const objUrl = URL.createObjectURL(blob);
        let img;
        try { img = await loadMarkupImage(objUrl); } finally { URL.revokeObjectURL(objUrl); }
        const cnv = document.createElement('canvas');
        cnv.width = img.naturalWidth;
        cnv.height = img.naturalHeight;
        const ctx = cnv.getContext('2d');
        ctx.drawImage(img, 0, 0);
        drawStrokesOnContext(ctx, note.markupStrokes);
        return await new Promise(res => cnv.toBlob(res, 'image/jpeg', 0.92)) || blob;
      } catch (err) {
        console.warn('[screen-notes] note markup baking failed, exporting original', err);
        return blob;
      }
    }

    // ── Export baking: strokes drawn over a screenshot get burned into it ──
    async function bakeStrokesForRect(session, blob, getRect) {
      try {
        const items = session.canvas?.items || [];
        const strokes = items.filter(i => i.type === 'stroke' && Array.isArray(i.points) && i.points.length > 1);
        if (!strokes.length) return blob;
        const objUrl = URL.createObjectURL(blob);
        let img;
        try { img = await loadMarkupImage(objUrl); } finally { URL.revokeObjectURL(objUrl); }
        const rect = getRect(img);
        if (!rect || rect.w <= 0 || rect.h <= 0) return blob;
        const hits = strokes.filter(s =>
          s.x < rect.x + rect.w && s.x + s.w > rect.x &&
          s.y < rect.y + rect.h && s.y + s.h > rect.y);
        if (!hits.length) return blob;
        const f = img.naturalWidth / rect.w; // world px → image px
        const cnv = document.createElement('canvas');
        cnv.width = img.naturalWidth;
        cnv.height = img.naturalHeight;
        const ctx = cnv.getContext('2d');
        ctx.drawImage(img, 0, 0);
        drawStrokesOnContext(ctx, hits.map(s => {
          // Account for strokes that were resized after drawing (viewBox stretch)
          const sx = s.vw ? s.w / s.vw : 1;
          const sy = s.vh ? s.h / s.vh : 1;
          return {
            ...s,
            width: s.width * f * (sx + sy) / 2,
            points: s.points.map(([x, y]) => [(s.x + x * sx - rect.x) * f, (s.y + y * sy - rect.y) * f]),
          };
        }));
        return await new Promise(res => cnv.toBlob(res, 'image/jpeg', 0.92)) || blob;
      } catch (err) {
        console.warn('[screen-notes] stroke baking failed, exporting original', err);
        return blob;
      }
    }

    function bakeCanvasStrokesIntoNoteBlob(session, noteIndex, blob) {
      const shot = (session.canvas?.items || []).find(i => i.type === 'screenshot' && i.noteIndex === noteIndex);
      if (!shot) return Promise.resolve(blob);
      return bakeStrokesForRect(session, blob, img => {
        // The screenshot card contain-fits the image without upscaling
        const fit = Math.min(shot.w / img.naturalWidth, shot.h / img.naturalHeight, 1);
        return { x: shot.x, y: shot.y, w: img.naturalWidth * fit, h: img.naturalHeight * fit };
      });
    }

    function bakeCanvasStrokesIntoImageItemBlob(session, item, blob) {
      return bakeStrokesForRect(session, blob, img => {
        // Dropped images contain-fit (centered) inside the item box
        const fit = Math.min(item.w / img.naturalWidth, item.h / img.naturalHeight);
        const w = img.naturalWidth * fit;
        const h = img.naturalHeight * fit;
        return { x: item.x + (item.w - w) / 2, y: item.y + (item.h - h) / 2, w, h };
      });
    }

    // Canvas-only content (dropped images + standalone text) included in exports
    function sessionCanvasExtras(session, filter = null) {
      const items = session.canvas?.items || [];
      return {
        images: items.filter(i => i.type === 'image' && i.url && (!filter || filter.imageIds.has(i.id))),
        texts: items.filter(i => i.type === 'text' && !Number.isInteger(i.noteIndex) && (i.text || '').trim()
          && (!filter || filter.textIds.has(i.id))),
      };
    }

    function sessionExportTotal(session, filter = null) {
      const extras = sessionCanvasExtras(session, filter);
      const noteCount = filter ? filter.noteIndexes.size : (session?.notes?.length || 0);
      return noteCount + extras.images.length + extras.texts.length;
    }

    // Build a filter from the current canvas selection (null = nothing exportable selected)
    function selectedExportFilter(session) {
      if (!session || canvas.session?.id !== session.id || !canvas.selectedIds.length) return null;
      const noteIndexes = new Set();
      const imageIds = new Set();
      const textIds = new Set();
      canvas.items.filter(i => canvas.selectedIds.includes(i.id)).forEach(i => {
        if ((i.type === 'screenshot' || i.type === 'text') && Number.isInteger(i.noteIndex)) noteIndexes.add(i.noteIndex);
        else if (i.type === 'image' && i.url) imageIds.add(i.id);
        else if (i.type === 'text' && (i.text || '').trim()) textIds.add(i.id);
      });
      const count = noteIndexes.size + imageIds.size + textIds.size;
      return count ? { noteIndexes, imageIds, textIds, count } : null;
    }

    // GitHub / download buttons: with a canvas selection, offer "all" vs "selected"
    let exportMenuEl = null;
    function closeExportMenu() {
      if (exportMenuEl) { exportMenuEl.remove(); exportMenuEl = null; }
      document.removeEventListener('mousedown', onExportMenuOutside, true);
    }
    function onExportMenuOutside(e) {
      if (exportMenuEl && !exportMenuEl.contains(e.target)) closeExportMenu();
    }

    function onExportButtonClick(event, sessionId, kind) {
      if (exportMenuEl) { closeExportMenu(); return; }
      const session = allSessions.find(s => s.id === sessionId);
      if (!session) return;
      const run = (filter) => kind === 'zip'
        ? exportSessionPackage(sessionId, filter)
        : openGithubExportDialog(sessionId, filter);
      const filter = selectedExportFilter(session);
      const total = sessionExportTotal(session);
      if (!filter || filter.count >= total) return run(null);

      const btn = event.currentTarget;
      const menu = document.createElement('div');
      menu.className = 'session-menu-popover';
      const verb = kind === 'zip' ? 'Download' : 'Export';
      menu.innerHTML = `
        <button class="session-menu-item" id="exportAllChoice">${verb} all ${total} note${total === 1 ? '' : 's'}</button>
        <button class="session-menu-item" id="exportSelectedChoice">${verb} ${filter.count} selected note${filter.count === 1 ? '' : 's'}</button>
      `;
      document.body.appendChild(menu);
      menu.querySelector('#exportAllChoice').onclick = () => { closeExportMenu(); run(null); };
      menu.querySelector('#exportSelectedChoice').onclick = () => { closeExportMenu(); run(filter); };
      const r = btn.getBoundingClientRect();
      const mw = menu.offsetWidth, mh = menu.offsetHeight;
      let left = r.right - mw;
      let top = r.bottom + 6;
      if (top + mh > window.innerHeight - 8) top = r.top - mh - 6;
      if (left < 8) left = 8;
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
      exportMenuEl = menu;
      document.addEventListener('mousedown', onExportMenuOutside, true);
    }

    // ── GitHub export (one issue per note, screenshots committed to the repo) ──
    const GH_TOKEN_KEY = 'screenNotesGithubToken'; // legacy single-token storage
    const GH_TOKENS_KEY = 'screenNotesGithubTokensV2'; // { [ownerKey]: { token, login } }
    const GH_REPO_KEY = 'screenNotesGithubRepo';
    const GH_LAST_OWNER_KEY = 'screenNotesGithubLastOwner';
    const GH_TOKEN_MASK = '••••••••••••••••••••••••';
    // 1 personal + 3 Shopify resource owners
    const GH_OWNERS = [
      { key: 'personal', label: 'Personal' },
      { key: 'Shopify', label: 'Shopify' },
      { key: 'shop', label: 'shop' },
      { key: 'shopify-playground', label: 'shopify-playground' },
    ];
    window.GH_TOKEN_MASK = GH_TOKEN_MASK;

    function ghLoadTokens() {
      let tokens = {};
      try { tokens = JSON.parse(localStorage.getItem(GH_TOKENS_KEY)) || {}; } catch (_) {}
      // Migrate the legacy single token into the personal slot
      const legacy = localStorage.getItem(GH_TOKEN_KEY);
      if (legacy && !tokens.personal) {
        tokens.personal = { token: legacy };
        localStorage.setItem(GH_TOKENS_KEY, JSON.stringify(tokens));
        localStorage.removeItem(GH_TOKEN_KEY);
      }
      return tokens;
    }

    function ghSaveTokens(tokens) {
      localStorage.setItem(GH_TOKENS_KEY, JSON.stringify(tokens));
    }

    function ghOwnerLabel(key) {
      if (key === 'personal') {
        const personalLogin = currentUser?.github || ghLoadTokens().personal?.login;
        if (personalLogin) return personalLogin;
      }
      return GH_OWNERS.find(o => o.key === key)?.label || key;
    }

    function openGhOwnerPopover(event) {
      const btn = document.getElementById('ghOwnerBtn');
      openRolePopover(event.currentTarget, GH_OWNERS.map(o => ({
        value: o.key,
        label: ghOwnerLabel(o.key),
      })), btn.dataset.value, (value) => {
        btn.dataset.value = value;
        document.getElementById('ghOwnerBtnLabel').textContent = ghOwnerLabel(value);
        ghOwnerChanged();
      }, { fullWidth: true });
    }

    function ghOwnerChanged() {
      const ownerKey = document.getElementById('ghOwnerBtn')?.dataset.value;
      const input = document.getElementById('ghTokenInput');
      if (!input) return;
      const saved = ghLoadTokens()[ownerKey];
      // Empty until a token is added for this specific owner
      input.value = saved?.token ? GH_TOKEN_MASK : '';
      const label = document.getElementById('ghTokenLabel');
      if (label) {
        const owner = GH_OWNERS.find(o => o.key === ownerKey);
        label.textContent = `Access token — ${owner?.label || ownerKey}${saved?.token ? ' (saved)' : ''}`;
      }
    }

    let ghActiveFilter = null;
    function openGithubExportDialog(sessionId, filter = null) {
      document.getElementById('ghDialogOverlay')?.remove();
      ghActiveFilter = filter;
      const session = allSessions.find(s => s.id === sessionId);
      const totalCount = session ? sessionExportTotal(session, filter) : 0;
      const savedRepo = localStorage.getItem(GH_REPO_KEY) || '';
      const savedTokens = ghLoadTokens();
      const lastOwner = localStorage.getItem(GH_LAST_OWNER_KEY) || 'personal';
      const hasToken = !!savedTokens[lastOwner]?.token;
      const overlay = document.createElement('div');
      overlay.className = 'gh-dialog-overlay';
      overlay.id = 'ghDialogOverlay';
      overlay.innerHTML = `
        <div class="gh-dialog">
          <h3>Export ${totalCount} note${totalCount === 1 ? '' : 's'} to GitHub</h3>
          <div>
            <label>Resource owner</label>
            <button class="gh-owner-btn" id="ghOwnerBtn" data-value="${lastOwner}" onclick="openGhOwnerPopover(event)">
              <span id="ghOwnerBtnLabel">${escapeHtml(ghOwnerLabel(lastOwner))}</span>${icon('chevron', 'icon icon-sm')}
            </button>
          </div>
          <div>
            <label for="ghRepoInput">Repository name</label>
            <input type="text" id="ghRepoInput" placeholder="issues-retail" value="${escapeHtml(savedRepo.includes('/') ? savedRepo.split('/')[1] : savedRepo)}" spellcheck="false">
          </div>
          <div>
            <label id="ghTokenLabel" for="ghTokenInput">Access token${hasToken ? ' (saved)' : ''}</label>
            <input type="password" id="ghTokenInput" value="${hasToken ? GH_TOKEN_MASK : ''}" placeholder="github_pat_…" autocomplete="off" onfocus="if(this.value===window.GH_TOKEN_MASK)this.select()">
            <div class="gh-dialog-hint"><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a fine-grained token</a> for this resource owner with <b>Issues: Read & write</b> and <b>Contents: Read & write</b>.</div>
          </div>
          <div class="gh-dialog-status" id="ghStatus"></div>
          <div class="gh-dialog-actions">
            <button class="btn btn-ghost" onclick="closeGithubExportDialog()">Cancel</button>
            <button class="btn btn-primary" id="ghExportGo" onclick="runGithubExport('${sessionId}')">Export</button>
          </div>
        </div>`;
      overlay.addEventListener('mousedown', e => { if (e.target === overlay) closeGithubExportDialog(); });
      document.body.appendChild(overlay);
      requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('in')));
      document.getElementById(savedRepo && hasToken ? 'ghExportGo' : 'ghRepoInput')?.focus();
    }

    function closeGithubExportDialog() {
      const overlay = document.getElementById('ghDialogOverlay');
      if (!overlay) return;
      overlay.classList.remove('in');
      overlay.style.pointerEvents = 'none';
      setTimeout(() => overlay.remove(), 400);
    }

    function ghSetStatus(msg, isError = false) {
      const el = document.getElementById('ghStatus');
      if (!el) return;
      el.textContent = msg;
      el.classList.toggle('error', isError);
    }

    // Translate GitHub API errors into actionable hints
    function ghFriendlyError(msg) {
      if (!msg) return '';
      if (/bad credentials/i.test(msg)) return 'Bad credentials — token is invalid or expired';
      if (/not found/i.test(msg)) return 'Repo not found — check the name, or the token can’t access it';
      if (/resource not accessible/i.test(msg)) return 'Token lacks permission — needs Issues: Read & write (and Contents: Read & write for screenshots)';
      if (/rate limit/i.test(msg)) return 'GitHub rate limit hit — try again in a few minutes';
      if (/issues.*disabled/i.test(msg)) return 'Issues are disabled on that repository';
      return msg;
    }

    async function ghApi(path, token, options = {}) {
      const resp = await fetch(`https://api.github.com${path}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
          ...(options.headers || {}),
        },
      });
      if (!resp.ok) {
        const detail = (await resp.json().catch(() => null))?.message || `HTTP ${resp.status}`;
        throw new Error(detail);
      }
      return resp.json();
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function runGithubExport(sessionId) {
      const session = allSessions.find(s => s.id === sessionId);
      if (!session) return;
      const repoName = document.getElementById('ghRepoInput')?.value.trim();
      if (!/^[\w.-]+$/.test(repoName || '')) return ghSetStatus('Enter a repository name', true);
      const ownerKey = document.getElementById('ghOwnerBtn')?.dataset.value || 'personal';
      const tokens = ghLoadTokens();
      let tokenInput = document.getElementById('ghTokenInput')?.value.trim() || '';
      if (tokenInput === GH_TOKEN_MASK) tokenInput = '';
      const token = tokenInput || tokens[ownerKey]?.token;
      if (!token) return ghSetStatus('Add an access token for this resource owner', true);
      if (tokenInput) {
        tokens[ownerKey] = { ...(tokens[ownerKey] || {}), token: tokenInput };
        ghSaveTokens(tokens);
      }
      localStorage.setItem(GH_LAST_OWNER_KEY, ownerKey);

      const goBtn = document.getElementById('ghExportGo');
      if (goBtn) goBtn.disabled = true;
      let repo;
      try {
        // Personal repos live under the user's GitHub login — quick.id knows it,
        // with the token's own account as fallback
        let ownerLogin = ownerKey;
        if (ownerKey === 'personal') {
          ownerLogin = currentUser?.github || tokens.personal?.login;
          if (!ownerLogin) {
            ghSetStatus('Checking account…');
            ownerLogin = (await ghApi('/user', token)).login;
          }
          tokens.personal = { ...(tokens.personal || {}), token, login: ownerLogin };
          ghSaveTokens(tokens);
        }
        repo = `${ownerLogin}/${repoName}`;
        ghSetStatus('Checking repo…');
        const repoInfo = await ghApi(`/repos/${repo}`, token);
        const branch = repoInfo.default_branch || 'main';
        localStorage.setItem(GH_REPO_KEY, repoName);

        const notes = session.notes || [];
        const sessionSlug = slugifyForFile(session.title || 'untitled');
        const sessionUrl = `${window.location.origin}${window.location.pathname}#session=${encodeURIComponent(sessionId)}`;
        const stamp = Date.now();
        let created = 0, failed = 0;
        const failReasons = [];
        const filter = ghActiveFilter;
        const extras = sessionCanvasExtras(session, filter);
        const total = sessionExportTotal(session, filter);
        let issueNum = 0;

        for (let i = 0; i < notes.length; i++) {
          if (filter && !filter.noteIndexes.has(i)) continue;
          const note = notes[i];
          ghSetStatus(`Creating issue ${++issueNum} of ${total}…`);
          try {
            let imageMarkdown = '';
            const src = note.screenshotUrl || note.screenshot;
            if (src) {
              try {
                const blob = await bakeCanvasStrokesIntoNoteBlob(session, i, await bakeNoteMarkupIntoBlob(note, await (await fetch(src)).blob()));
                const typeExt = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif' }[blob.type] || 'png';
                const path = `.screen-notes/${sessionSlug}-${stamp}/${String(i + 1).padStart(2, '0')}-${slugifyForFile(note.text)}.${typeExt}`;
                await ghApi(`/repos/${repo}/contents/${path}`, token, {
                  method: 'PUT',
                  body: JSON.stringify({
                    message: `Screen Notes: screenshot for "${(note.text || 'note').slice(0, 60)}"`,
                    content: await blobToBase64(blob),
                    branch,
                  }),
                });
                imageMarkdown = `\n\n<img src="https://github.com/${repo}/blob/${branch}/${path}?raw=true" width="600">`;
              } catch (imgErr) {
                imageMarkdown = `\n\n_(screenshot upload failed: ${imgErr.message})_`;
              }
            }
            const firstLine = (note.text || '').split('\n')[0].trim();
            const title = firstLine
              ? (firstLine.length > 80 ? `${firstLine.slice(0, 77)}…` : firstLine)
              : `Note ${i + 1} — ${session.title || 'Untitled session'}`;
            const body = [
              note.text || '',
              imageMarkdown,
              `\n\n---\nFrom [Screen Notes session](${sessionUrl}) “${session.title || 'Untitled session'}” at ${formatDuration(note.timestamp || 0)}.`,
            ].join('');
            await ghApi(`/repos/${repo}/issues`, token, {
              method: 'POST',
              body: JSON.stringify({ title, body }),
            });
            created++;
          } catch (noteErr) {
            console.error('Issue creation failed', noteErr);
            failed++;
            failReasons.push(noteErr.message);
          }
        }

        // Canvas-only images become issues too
        for (let i = 0; i < extras.images.length; i++) {
          const item = extras.images[i];
          ghSetStatus(`Creating issue ${++issueNum} of ${total}…`);
          try {
            let imageMarkdown = '';
            try {
              const blob = await bakeCanvasStrokesIntoImageItemBlob(session, item, await (await fetch(item.url)).blob());
              const typeExt = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif' }[blob.type] || 'png';
              const path = `.screen-notes/${sessionSlug}-${stamp}/canvas-${String(i + 1).padStart(2, '0')}-${slugifyForFile(item.note || 'canvas-image')}.${typeExt}`;
              await ghApi(`/repos/${repo}/contents/${path}`, token, {
                method: 'PUT',
                body: JSON.stringify({
                  message: `Screen Notes: canvas image "${(item.note || 'canvas image').slice(0, 60)}"`,
                  content: await blobToBase64(blob),
                  branch,
                }),
              });
              imageMarkdown = `\n\n<img src="https://github.com/${repo}/blob/${branch}/${path}?raw=true" width="600">`;
            } catch (imgErr) {
              imageMarkdown = `\n\n_(image upload failed: ${imgErr.message})_`;
            }
            const firstLine = (item.note || '').split('\n')[0].trim();
            const title = firstLine
              ? (firstLine.length > 80 ? `${firstLine.slice(0, 77)}…` : firstLine)
              : `Canvas image ${i + 1} — ${session.title || 'Untitled session'}`;
            const body = [
              item.note || '',
              imageMarkdown,
              `\n\n---\nFrom the canvas of [Screen Notes session](${sessionUrl}) “${session.title || 'Untitled session'}”.`,
            ].join('');
            await ghApi(`/repos/${repo}/issues`, token, { method: 'POST', body: JSON.stringify({ title, body }) });
            created++;
          } catch (err) {
            console.error('Canvas image issue failed', err);
            failed++;
            failReasons.push(err.message);
          }
        }

        // Standalone canvas text notes
        for (const t of extras.texts) {
          ghSetStatus(`Creating issue ${++issueNum} of ${total}…`);
          try {
            const firstLine = t.text.trim().split('\n')[0];
            const title = firstLine.length > 80 ? `${firstLine.slice(0, 77)}…` : firstLine;
            const body = `${t.text.trim()}\n\n---\nFrom the canvas of [Screen Notes session](${sessionUrl}) “${session.title || 'Untitled session'}”.`;
            await ghApi(`/repos/${repo}/issues`, token, { method: 'POST', body: JSON.stringify({ title, body }) });
            created++;
          } catch (err) {
            console.error('Canvas text issue failed', err);
            failed++;
            failReasons.push(err.message);
          }
        }

        if (failed) {
          const reason = ghFriendlyError(failReasons.find(Boolean));
          ghSetStatus(`Created ${created} issue${created === 1 ? '' : 's'}, ${failed} failed${reason ? ` — ${reason}` : ''}`, true);
          if (goBtn) goBtn.disabled = false;
        } else {
          closeGithubExportDialog();
          showToast(`Created ${created} issue${created === 1 ? '' : 's'} in ${repo}`);
        }
      } catch (e) {
        ghSetStatus(e.message === 'Bad credentials' ? `Bad credentials — check the ${ownerKey} token` : ghFriendlyError(e.message), true);
        if (e.message === 'Bad credentials') {
          delete tokens[ownerKey];
          ghSaveTokens(tokens);
          ghOwnerChanged();
        }
        if (goBtn) goBtn.disabled = false;
      }
    }

    // ── Session export (zip of SESSION.md + screenshots, agent-ready) ──
    function slugifyForFile(s) {
      return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'note';
    }

    let jszipPromise = null;
    function loadJSZip() {
      if (window.JSZip) return Promise.resolve(window.JSZip);
      jszipPromise = jszipPromise || new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload = () => resolve(window.JSZip);
        s.onerror = () => { jszipPromise = null; reject(new Error('Could not load zip library')); };
        document.head.appendChild(s);
      });
      return jszipPromise;
    }

    async function exportSessionPackage(sessionId, filter = null) {
      const session = allSessions.find(s => s.id === sessionId);
      if (!session) return;
      const btn = document.getElementById('exportSessionBtn');
      if (btn) btn.disabled = true;
      try {
        const JSZip = await loadJSZip();
        const zip = new JSZip();
        const folderName = `session-${slugifyForFile(session.title || 'untitled')}`;
        const root = zip.folder(folderName);
        const shots = root.folder('screenshots');
        const notes = session.notes || [];

        const lines = [
          `# ${session.title || 'Untitled session'}`,
          '',
          `Recorded: ${new Date(session.created_at).toLocaleString()}`,
          `Notes: ${sessionExportTotal(session, filter)}`,
          '',
          'Notes captured during a live screen-share session in Screen Notes.',
          'Timestamps are elapsed recording time. Each screenshot shows what was',
          'on screen at the moment the note was taken.',
          '',
        ];

        let shotNum = 0;
        let noteNum = 0;
        for (let i = 0; i < notes.length; i++) {
          if (filter && !filter.noteIndexes.has(i)) continue;
          const note = notes[i];
          lines.push(`## Note ${++noteNum} — ${formatDuration(note.timestamp || 0)}`, '');
          if (note.text) lines.push(note.text, '');
          const src = note.screenshotUrl || note.screenshot;
          if (src) {
            try {
              const resp = await fetch(src);
              if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
              const blob = await bakeCanvasStrokesIntoNoteBlob(session, i, await bakeNoteMarkupIntoBlob(note, await resp.blob()));
              shotNum++;
              const typeExt = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif' }[blob.type];
              const ext = typeExt || (src.match(/\.(png|jpe?g|webp|gif)(\?|$)/i)?.[1] || 'png').replace(/jpeg/i, 'jpg');
              const name = `${String(shotNum).padStart(2, '0')}-${slugifyForFile(note.text)}.${ext}`;
              shots.file(name, blob);
              lines.push(`![screenshot](screenshots/${name})`, '');
            } catch (_) {
              lines.push('_(screenshot unavailable)_', '');
            }
          }
        }

        // Canvas-only content: dropped images and standalone text notes
        const extras = sessionCanvasExtras(session, filter);
        let imgNum = 0;
        for (const item of extras.images) {
          lines.push(`## Canvas image ${++imgNum}`, '');
          if (item.note?.trim()) lines.push(item.note.trim(), '');
          try {
            const resp = await fetch(item.url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const blob = await bakeCanvasStrokesIntoImageItemBlob(session, item, await resp.blob());
            shotNum++;
            const typeExt = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif' }[blob.type];
            const ext = typeExt || (item.url.match(/\.(png|jpe?g|webp|gif)(\?|$)/i)?.[1] || 'png').replace(/jpeg/i, 'jpg');
            const name = `${String(shotNum).padStart(2, '0')}-${slugifyForFile(item.note || 'canvas-image')}.${ext}`;
            shots.file(name, blob);
            lines.push(`![image](screenshots/${name})`, '');
          } catch (_) {
            lines.push('_(image unavailable)_', '');
          }
        }
        extras.texts.forEach(t => {
          lines.push('## Canvas note', '', t.text.trim(), '');
        });

        root.file('SESSION.md', lines.join('\n'));
        const blob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${folderName}.zip`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
        showToast('Session exported');
      } catch (e) {
        console.error('Export failed', e);
        showToast('Export failed');
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    // Persistent top bar: avatar + theme never re-created, so no flicker.
    // Animates width + slide-in only when the action set actually changes.
    function updateTopBar(session) {
      const bar = ensureTopBar();
      bar.style.display = 'flex';
      const actions = document.getElementById('topBarActions');
      const mode = isRecording ? 'recording'
        : session ? (isMySession(session) ? 'session-own' : 'session-shared') : 'home';

      if (bar.dataset.mode === mode) {
        if (session && !isRecording) {
          // Same mode (e.g. session → session): swap ids without animating
          actions.innerHTML = topBarActionsHTML(session);
          actions.querySelectorAll('.bar-action').forEach(el => el.classList.add('in'));
        }
        return;
      }
      bar.dataset.mode = mode;
      if (!session) renderSelfAvatar(); // drop remote presence avatars when leaving a session

      const prevW = bar.getBoundingClientRect().width;
      bar.style.width = '';
      bar.style.transition = '';
      actions.innerHTML = isRecording
        ? '' // End session lives next to the scrub bar during recording
        : session ? topBarActionsHTML(session) : '';
      const target = bar.getBoundingClientRect().width;
      // Slide distance = width delta so icons travel at the exact pace the bar grows
      const delta = Math.max(target - prevW, 0);
      actions.querySelectorAll('.bar-action').forEach(el => {
        el.style.setProperty('--slide', `${delta || 32}px`);
      });
      if (prevW > 1 && Math.abs(prevW - target) > 1) {
        bar.style.overflow = 'hidden';
        bar.style.width = `${prevW}px`;
        void bar.offsetWidth;
        bar.style.transition = 'width 400ms var(--ease-out)';
        bar.style.width = `${target}px`;
        // Start icon transition in the same frame as the width transition
        actions.querySelectorAll('.bar-action:not(.in)').forEach(el => el.classList.add('in'));
        clearTimeout(bar._widthTimer);
        bar._widthTimer = setTimeout(() => {
          bar.style.width = '';
          bar.style.transition = '';
          bar.style.overflow = '';
        }, 450);
      } else {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          actions.querySelectorAll('.bar-action:not(.in)').forEach(el => el.classList.add('in'));
        }));
      }
    }
