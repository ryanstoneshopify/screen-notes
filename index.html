        if (e.target.closest('.home-hidden-note, button, input, select, textarea, [contenteditable="true"]')) return;
        e.preventDefault();
        const r = svg.getBoundingClientRect();
        const pt = ev => [Math.round(ev.clientX - r.left), Math.round(ev.clientY - r.top)];
        const stroke = { color: '#e5484d', width: 3, dash: 'solid', points: [pt(e)] };
        homeDraw.strokes.push(stroke);
        const onMove = ev => { stroke.points.push(pt(ev)); renderHomeDrawSvg(); };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          if (stroke.points.length < 2) {
            homeDraw.strokes = homeDraw.strokes.filter(s => s !== stroke);
          } else {
            homeDraw.undo.push({ type: 'stroke', stroke });
          }
          renderHomeDrawSvg();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      // Home note text edits are undoable
      document.addEventListener('focusin', (e) => {
        if (e.target.matches?.('.home-hidden-note .note-card-text')) {
          e.target._prevText = e.target.textContent;
        }
      });
      document.addEventListener('focusout', (e) => {
        if (e.target.matches?.('.home-hidden-note .note-card-text')
            && e.target._prevText !== undefined && e.target._prevText !== e.target.textContent) {
          homeDraw.undo.push({ type: 'text', el: e.target, text: e.target._prevText });
          delete e.target._prevText;
        }
      });

      // ⌘⇧P — show/hide the prototype settings gear (proto user only)
      document.addEventListener('keydown', (e) => {
        if (!(e.metaKey || e.ctrlKey) || !e.shiftKey || e.key.toLowerCase() !== 'p') return;
        if (currentUser?.email !== PROTO_PANEL_USER) return;
        e.preventDefault();
        protoGearHidden = !protoGearHidden;
        if (protoGearHidden) toggleProtoPanel(false);
        updateProtoSettingsVisibility();
      });

      // ⌘. — show/hide UI (left nav, nav pill, canvas toolbar)
      document.addEventListener('keydown', (e) => {
        if (!(e.metaKey || e.ctrlKey) || e.key !== '.') return;
        e.preventDefault();
        document.body.classList.toggle('ui-hidden');
      });

      // ⌘Z on home — undo drawings, moves, resizes, and text edits
      document.addEventListener('keydown', (e) => {
        if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z' || e.shiftKey) return;
        if (activeSessionId || isRecording) return; // canvas has its own undo
        if (document.activeElement?.isContentEditable) return;
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
        if (undoHomeAction()) e.preventDefault();
      });
      document.addEventListener('mousemove', (e) => {
        const g = document.getElementById('gridBg');
        if (!g) return;
        const r = g.getBoundingClientRect();
        g.style.setProperty('--mx', `${e.clientX - r.left}px`);
        g.style.setProperty('--my', `${e.clientY - r.top}px`);
      });
      await loadSessions();
      initSessionRealtime();

      const sessionId = getSessionIdFromUrl();
      if (sessionId && allSessions.some(s => s.id === sessionId)) {
        rememberSharedSessionIfNeeded(sessionId);
        await loadSessions();
        viewSession(sessionId, { updateUrl: false });
      } else {
        render();
      }
    }

    window.addEventListener('hashchange', async () => {
      const sessionId = getSessionIdFromUrl();
      if (sessionId && allSessions.some(s => s.id === sessionId)) {
        rememberSharedSessionIfNeeded(sessionId);
        await loadSessions();
        viewSession(sessionId, { updateUrl: false });
      } else if (!sessionId) {
        activeSessionId = null;
        currentNotes = [];
        render();
      }
    });

    function renderUserInfo() {
      updateProtoSettingsVisibility();
      const el = document.getElementById('userInfo');
      if (!currentUser) return;
      el.innerHTML = `
        ${currentUser.slackImageUrl ? `<img class="user-avatar" src="${currentUser.slackImageUrl}" alt="">` : ''}
        <span>${currentUser.fullName || currentUser.email}</span>
      `;
    }

    function getSessionIdFromUrl() {
      const hash = window.location.hash || '';
      const match = hash.match(/^#session=(.+)$/);
      return match ? decodeURIComponent(match[1]) : null;
    }

    function setSessionUrl(id) {
      const next = id ? `#session=${encodeURIComponent(id)}` : window.location.pathname;
      if (id) history.pushState(null, '', next);
      else history.pushState(null, '', window.location.pathname + window.location.search);
    }

    // ── Presence (remote cursors) ──
    const CURSOR_COLORS = ['#4BDBBE','#F59E0B','#8B5CF6','#EC4899','#06B6D4','#10B981','#F43F5E','#6366F1'];
    let presenceRoom = null;

    function getCursorColor(socketId) {
      let hash = 0;
      for (let i = 0; i < socketId.length; i++) hash = ((hash << 5) - hash + socketId.charCodeAt(i)) | 0;
      return CURSOR_COLORS[Math.abs(hash) % CURSOR_COLORS.length];
    }

    async function joinPresenceRoom(sessionId) {
      await leavePresenceRoom();
      presenceRoom = quick.socket.room(`session-${sessionId}`);

      presenceRoom.on('user:state', () => { renderRemoteCursors(); renderPresenceAvatars(); });
      presenceRoom.on('user:join', () => { renderRemoteCursors(); renderPresenceAvatars(); });
      presenceRoom.on('user:leave', () => { renderRemoteCursors(); renderPresenceAvatars(); });

      await presenceRoom.join();
      renderPresenceAvatars();
    }

    async function leavePresenceRoom() {
      if (presenceRoom) {
        await presenceRoom.leave();
        presenceRoom = null;
      }
      const container = document.getElementById('remoteCursors');
      if (container) container.innerHTML = '';
      // Keep your own avatar locked in place; just drop remote users
      renderSelfAvatar();
    }

    function renderPresenceAvatars() {
      const container = document.getElementById('presenceAvatars');
      if (!container || !presenceRoom) return;

      let html = '';
      // Include current user (guard below avoids re-creating identical DOM)
      if (currentUser) {
        if (currentUser.slackImageUrl) {
          html += `<img class="presence-avatar" src="${currentUser.slackImageUrl}" title="${currentUser.fullName || currentUser.email}">`;
        } else {
          const initials = (currentUser.fullName || currentUser.email || '?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
          html += `<div class="presence-avatar-placeholder" title="${currentUser.fullName || currentUser.email}">${initials}</div>`;
        }
      }

      // Remote users
      presenceRoom.users.forEach((user, socketId) => {
        if (socketId === presenceRoom.user?.socketId) return;
        const name = user.name || user.email || 'Anon';
        if (user.slackImageUrl) {
          html += `<img class="presence-avatar" src="${user.slackImageUrl}" title="${name}">`;
        } else {
          const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
          html += `<div class="presence-avatar-placeholder" title="${name}">${initials}</div>`;
        }
      });

      if (container.innerHTML !== html) container.innerHTML = html;
    }

    function broadcastCursorPosition(e) {
      if (!presenceRoom || !activeSessionId) return;
      const viewport = document.getElementById('canvasViewport');
      if (!viewport) return;
      const rect = viewport.getBoundingClientRect();
      // Convert screen position to world coordinates
      const worldX = (e.clientX - rect.left - canvas.x) / canvas.scale;
      const worldY = (e.clientY - rect.top - canvas.y) / canvas.scale;
      presenceRoom.updateUserState({ cursorX: worldX, cursorY: worldY });
    }

    function renderRemoteCursors() {
      const container = document.getElementById('remoteCursors');
      if (!container || !presenceRoom) return;

      let html = '';
      presenceRoom.users.forEach((user, socketId) => {
        if (socketId === presenceRoom.user?.socketId) return;
        const state = user.state;
        if (state?.cursorX == null || state?.cursorY == null) return;
        const color = getCursorColor(socketId);
        const name = user.name?.split(' ')[0] || user.email?.split('@')[0] || 'Anon';
        // Convert world coords to viewport pixel position
        const px = canvas.x + state.cursorX * canvas.scale;
        const py = canvas.y + state.cursorY * canvas.scale;
        html += `<div class="remote-cursor" style="left:${px}px;top:${py}px;--cursor-color:${color}">
          <div class="remote-cursor-pointer"></div>
          <div class="remote-cursor-label">${name}</div>
        </div>`;
      });
      container.innerHTML = html;
    }

    async function goHome() {
      closeNavDrawer();
      if (isRecording) {
        if (!confirm('Stop current recording and return home?')) return;
        await stopRecording();
      }
      // Fresh home canvas: drawings clear on every home load
      homeDraw.strokes = [];
      homeDraw.undo = [];
      activeSessionId = null;
      currentNotes = [];
      setSelectedItems?.([]);
      setSessionUrl(null);
      await leavePresenceRoom();
      render();
    }

    // ── DB ──
    const sessionsDb = quick.db.collection('sessions');

    function currentUserEmail() {
      return (currentUser?.email || '').toLowerCase();
    }

    function sessionOwnerEmail(session) {
      return (session?.ownerEmail || session?.userEmail || session?.createdByEmail || '').toLowerCase();
    }

    function isMySession(session) {
      const owner = sessionOwnerEmail(session);
      // Legacy sessions did not have ownerEmail. Keep them visible for the
      // creator's existing data rather than orphaning old work.
      if (!owner) return true;
      return owner === currentUserEmail();
    }

    // A brand-new session being recorded right now (in this tab or another).
    // These stay out of the session lists: opening the canvas mid-recording
    // materializes canvas items early and forks the session state.
    function sessionIsMidRecording(s) {
      if (!s?.recording) return false;
      if (isRecording && s.id === activeSessionId) return true;
      // Crash safety: if the recording tab died, the flag never clears. Let
      // stale sessions reappear instead of hiding them forever.
      const updated = new Date(s.updated_at || s.created_at || 0).getTime();
      return Date.now() - updated < 15 * 60 * 1000;
    }

    // ── Sharing model ──
    // Legacy sessions (created before sharing existed) stay link-visible.
    function sessionSharing(session) {
      return session?.sharing || { publicView: true, people: [] };
    }

    function sharingEntryFor(session) {
      return sessionSharing(session).people.find(p => (p.email || '').toLowerCase() === currentUserEmail()) || null;
    }

    function canViewSession(session) {
      if (!session) return false;
      if (isMySession(session)) return true;
      return sessionSharing(session).publicView || !!sharingEntryFor(session);
    }

    function canEditSession(session) {
      if (typeof protoReadOnly !== 'undefined' && protoReadOnly) return false; // prototype simulation
      if (!session) return true;
      if (isMySession(session)) return true;
      return sharingEntryFor(session)?.role === 'editor';
    }

    function canvasReadOnly() {
      const s = canvas.session || allSessions.find(x => x.id === activeSessionId);
      return s ? !canEditSession(s) : false;
    }

    function sharedSessionIds() {
      try { return JSON.parse(localStorage.getItem('screenNotesSharedSessionIds') || '[]'); }
      catch(_) { return []; }
    }

    function setSharedSessionIds(ids) {
      localStorage.setItem('screenNotesSharedSessionIds', JSON.stringify([...new Set(ids)]));
    }

    function rememberSharedSessionIfNeeded(id) {
      const session = allSessions.find(s => s.id === id);
      if (!session || isMySession(session) || !canViewSession(session)) return;
      setSharedSessionIds([id, ...sharedSessionIds()]);
    }

    async function loadSessions() {
      try {
        const t0 = performance.now();
        const result = await sessionsDb.find();
        console.log(`[screen-notes] loaded ${result?.length ?? 0} sessions — ${((JSON.stringify(result || []).length) / 1024).toFixed(0)} KB in ${Math.round(performance.now() - t0)}ms`);
        allSessions = (result || []).sort((a, b) =>
          new Date(b.created_at) - new Date(a.created_at)
        );
        refreshSessionLists();
      } catch(e) {
        allSessions = [];
        sessions = [];
        sharedSessions = [];
      }
    }

    // Strip any inline base64 data URLs from a session before persisting.
    // Old sessions may have these stored under note.screenshot — we drop them
    // (the screenshotUrl is what we actually rely on).
    function sanitizeForPersist(session) {
      const clone = JSON.parse(JSON.stringify(session));
      if (Array.isArray(clone.notes)) {
        clone.notes.forEach(n => {
          if (typeof n.screenshot === 'string' && n.screenshot.startsWith('data:')) {
            delete n.screenshot;
          }
          // If screenshotUrl is somehow a data URL (legacy), drop it too
          if (typeof n.screenshotUrl === 'string' && n.screenshotUrl.startsWith('data:')) {
            delete n.screenshotUrl;
          }
          // Display-only markup composite is a data URL — never persist it
          delete n._mkPreview;
        });
      }
      if (clone.canvas && Array.isArray(clone.canvas.items)) {
        clone.canvas.items.forEach(it => {
          if (it.type === 'image' && typeof it.url === 'string' && it.url.startsWith('data:')) {
            // Keep only items whose images we actually managed to upload
            it.url = null;
          }
        });
        clone.canvas.items = clone.canvas.items.filter(it => it.type !== 'image' || it.url);
      }
      return clone;
    }

    async function saveSession(session) {
      // Read-only viewers never write
      if (session.id && !canEditSession(session)) return;
      try {
        const payload = sanitizeForPersist(session);
        const t0 = performance.now();
        const payloadKb = (JSON.stringify(payload).length / 1024).toFixed(1);
        if (session.id) {
          remoteEchoSuppress.set(session.id, Date.now());
          await sessionsDb.update(session.id, payload);
        } else {
          const saved = await sessionsDb.create(payload);
          session.id = saved.id;
          if (saved.created_at) session.created_at = saved.created_at;
          if (saved.updated_at) session.updated_at = saved.updated_at;
          remoteEchoSuppress.set(session.id, Date.now());
        }
        console.log(`[screen-notes] saved session ${session.id} — ${payloadKb} KB in ${Math.round(performance.now() - t0)}ms`);
        // Update the local cache instead of re-fetching the whole collection —
        // find() downloads every session (all users, full notes + canvas) and
        // made every debounced canvas save cost seconds as the DB grew.
        const idx = allSessions.findIndex(s => s.id === session.id);
        if (idx >= 0) allSessions[idx] = session; else allSessions.unshift(session);
        refreshSessionLists();
        renderSidebar();
      } catch(e) {
        console.error('Failed to save session:', e);
      }
    }

    // ── Real-time session sync ──
    // Everyone viewing a session sees canvas/notes changes instantly.
    const remoteEchoSuppress = new Map(); // session id → last local save ts
    let remoteApplyTimer = null;

    function initSessionRealtime() {
      try {
        sessionsDb.subscribe({
          onCreate: (doc) => upsertRemoteSession(doc),
          onUpdate: (doc) => upsertRemoteSession(doc),
          onDelete: (id) => {
            allSessions = allSessions.filter(s => s.id !== id);
            refreshSessionLists();
            if (activeSessionId === id && !isRecording) {
              activeSessionId = null;
              currentNotes = [];
              render();
              showToast('This session was deleted');
            }
            renderSidebar();
          },
        });
      } catch (e) {
        console.warn('[screen-notes] realtime subscribe failed', e);
      }
    }

    function refreshSessionLists() {
      const sharedIds = new Set(sharedSessionIds());
      sessions = allSessions.filter(s => isMySession(s) && !sessionIsMidRecording(s));
      sharedSessions = allSessions.filter(s => !isMySession(s) && canViewSession(s)
        && (sharedIds.has(s.id) || !!sharingEntryFor(s)) && !sessionIsMidRecording(s));
    }

    function upsertRemoteSession(doc) {
      if (!doc?.id) return;
      const idx = allSessions.findIndex(s => s.id === doc.id);
      if (idx >= 0) allSessions[idx] = doc;
      else {
        allSessions.push(doc);
        allSessions.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }
      refreshSessionLists();
      renderSidebar();
      // Our own writes echo back through the subscription — skip re-rendering
      if (Date.now() - (remoteEchoSuppress.get(doc.id) || 0) < 2000) return;
      if (doc.id === activeSessionId && !isRecording) applyRemoteActiveSession(doc);
    }

    function applyRemoteActiveSession(doc) {
      // Never yank items out from under an in-flight interaction — retry shortly
      if (isDraggingItem || isResizing || isResizingGroup || isSelecting || isPanning
          || document.activeElement?.isContentEditable) {
        clearTimeout(remoteApplyTimer);
        remoteApplyTimer = setTimeout(() => {
          const latest = allSessions.find(s => s.id === activeSessionId);
          if (latest) applyRemoteActiveSession(latest);
        }, 800);
        return;
      }
      currentNotes = doc.notes || [];
      canvas.session = doc;
      if (doc.canvas?.items) {
        canvas.items = JSON.parse(JSON.stringify(doc.canvas.items));
      }
      // Keep the local viewport and whatever selection still exists
      canvas.selectedIds = canvas.selectedIds.filter(id => canvas.items.some(i => i.id === id));
      canvas.selectedId = canvas.selectedIds[0] || null;
      renderCanvas();
      updateNavPill();
    }

    async function shareSession(id) {
      const url = `${window.location.origin}${window.location.pathname}#session=${encodeURIComponent(id)}`;
      try {
        await navigator.clipboard.writeText(url);
      } catch (_) {
        const input = document.createElement('input');
        input.value = url;
        input.style.position = 'fixed';
        input.style.left = '-9999px';
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        input.remove();
      }
    }

    async function shareSessionFromHeader(id) {
      const session = allSessions.find(s => s.id === id);
      if (session && canViewSession(session)) {
        openShareModal(id);
      } else {
        await shareSession(id);
        showToast('Link copied');
      }
    }

    // Owners and editors manage sharing fully; viewers can only add other
    // viewers and change/remove their own entry.
    function shareCanManage() {
      const session = shareModalSession();
      if (!session) return false;
      if (protoReadOnly) return false; // prototype read-only simulation
      return isMySession(session) || canEditSession(session);
    }

    // ── Share modal (draft model: changes apply on Save) ──
    let shareModalSessionId = null;
    let shareDraft = null;
    let shareBaseline = null;

    function updateShareSaveEnabled() {
      const btn = document.getElementById('shareSaveBtn');
      if (btn) btn.disabled = !shareDraft || JSON.stringify(shareDraft) === shareBaseline;
    }

    function openShareModal(id) {
      const session = allSessions.find(s => s.id === id);
      if (!session) return;
      shareModalSessionId = id;
      shareDraft = JSON.parse(JSON.stringify(sessionSharing(session)));
      shareBaseline = JSON.stringify(shareDraft);
      document.getElementById('shareOverlay')?.remove();
      const overlay = document.createElement('div');
      overlay.className = 'gh-dialog-overlay';
      overlay.id = 'shareOverlay';
      overlay.innerHTML = `
        <div class="gh-dialog share-dialog">
          <div class="share-head">
            <h3>Share ${escapeHtml(session.title || 'Untitled session')}</h3>
            <button class="share-close-btn" onclick="closeShareModal()" title="Close">${icon('close')}</button>
          </div>
          <div class="share-add-row">
            <div class="share-search-wrap">
              <input type="text" id="shareSearchInput" placeholder="Search and add people…" spellcheck="false" autocomplete="off"
                     oninput="renderShareSuggestions()"
                     onkeydown="if(event.key==='Enter')shareModalAddPerson();if(event.key==='Escape')hideShareSuggestions()">
              <div class="share-suggest" id="shareSuggest" style="display:none"></div>
            </div>
            ${shareCanManage() ? `
            <button class="share-role-btn" id="shareRoleBtn" data-value="editor" onclick="openShareRolePopover(event)">
              <span id="shareRoleBtnLabel">Editor</span>${icon('chevron', 'icon icon-sm')}
            </button>` : `
            <button class="share-role-btn" id="shareRoleBtn" data-value="viewer" disabled>
              <span id="shareRoleBtnLabel">Viewer</span>
            </button>`}
          </div>
          <div class="share-public-row">
            <div class="share-public-info">
              ${icon('globe')}
              <div>
                <div class="share-public-title">Visible to all of Shopify</div>
                <div class="share-public-sub">Anyone at Shopify can view with the link</div>
              </div>
            </div>
            <button class="share-switch${shareDraft.publicView ? ' on' : ''}" id="sharePublicToggle" role="switch" aria-checked="${shareDraft.publicView}" onclick="shareModalTogglePublic()"${shareCanManage() ? '' : ' disabled'}></button>
          </div>
          <div class="share-access-label">Who has access</div>
          <div class="share-access-list" id="shareAccessList"></div>
          <div class="gh-dialog-actions share-footer">
            <button class="btn btn-ghost share-copy-btn" onclick="shareModalCopyLink()">${icon('link', 'icon icon-sm')} Copy link</button>
            <span class="share-footer-right">
              <button class="btn btn-ghost" onclick="closeShareModal()">Cancel</button>
              <button class="btn btn-primary" id="shareSaveBtn" onclick="shareModalSave()" disabled>Save</button>
            </span>
          </div>
        </div>`;
      overlay.addEventListener('mousedown', e => { if (e.target === overlay) closeShareModal(); });
      document.body.appendChild(overlay);
      renderShareAccessList();
      // Warm the directory so access rows can resolve avatars
      loadPeopleDirectory().then(() => { if (shareModalSessionId === id) renderShareAccessList(); });
      requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('in')));
      document.getElementById('shareSearchInput')?.focus();
    }

    async function shareModalSave() {
      const session = shareModalSession();
      if (session && shareDraft) {
        session.sharing = shareDraft;
        shareDraft = null; // consumed — close won't report a discard
        try {
          // Partial update: viewers may manage sharing without canvas write access,
          // and it can't clobber concurrent canvas edits
          remoteEchoSuppress.set(session.id, Date.now());
          await sessionsDb.update(session.id, { sharing: session.sharing });
          refreshSessionLists();
          renderSidebar();
          showToast('Changes saved');
        } catch (e) {
          console.error('Failed to save sharing:', e);
          showToast('Could not save changes');
        }
      }
      closeShareModal();
    }

    function closeShareModal() {
      const overlay = document.getElementById('shareOverlay');
      const session = shareModalSession();
      // Unsaved edits on the way out → they're being discarded
      if (session && shareDraft && JSON.stringify(shareDraft) !== shareBaseline) {
        showToast('Changes discarded');
      }
      shareModalSessionId = null;
      shareDraft = null;
      closeRolePopover();
      if (!overlay) return;
      overlay.classList.remove('in');
      overlay.style.pointerEvents = 'none';
      setTimeout(() => overlay.remove(), 400);
    }

    function shareModalSession() {
      return allSessions.find(s => s.id === shareModalSessionId);
    }

    async function shareModalCopyLink() {
      if (!shareModalSessionId) return;
      await shareSession(shareModalSessionId);
      const btn = document.querySelector('#shareOverlay .share-copy-btn');
      if (btn) {
        btn.innerHTML = `${icon('link', 'icon icon-sm')} Link copied`;
        setTimeout(() => {
          if (document.body.contains(btn)) btn.innerHTML = `${icon('link', 'icon icon-sm')} Copy link`;
        }, 2000);
      }
    }

    // ── People directory (everyone who has used Screen Notes) ──
    const peopleDb = quick.db.collection('people');
    let peopleDirectory = null;

    async function upsertSelfToDirectory() {
      if (!currentUser?.email) return;
      try {
        const existing = (await peopleDb.where({ email: currentUser.email }).find()) || [];
        const data = {
          email: currentUser.email,
          name: currentUser.fullName || currentUser.email,
          image: currentUser.slackImageUrl || null,
        };
        if (existing[0]) await peopleDb.update(existing[0].id, data);
        else await peopleDb.create(data);
      } catch (_) {}
    }

    async function loadPeopleDirectory() {
      if (peopleDirectory) return peopleDirectory;
      // Full Shopify directory ships as a static NDJSON dump (all active employees),
      // merged with quick.db people (Screen Notes users) who carry Slack avatars.
      const byEmail = new Map();
      try {
        const text = await (await fetch(`/people-directory.json?v=${Date.now()}`)).text();
        text.split('\n').forEach(line => {
          if (!line.trim()) return;
          try {
            const p = JSON.parse(line);
            if (p.email) byEmail.set(p.email.toLowerCase(), { email: p.email.toLowerCase(), name: p.name || p.email, image: p.image || p.slack_image_url || null });
          } catch (_) {}
        });
      } catch (_) {}
      try {
        ((await peopleDb.find()) || []).forEach(p => {
          if (!p.email) return;
          const key = p.email.toLowerCase();
          byEmail.set(key, { ...(byEmail.get(key) || {}), email: key, name: p.name || byEmail.get(key)?.name || key, image: p.image || p.slack_image_url || null });
        });
      } catch (_) {}
      peopleDirectory = [...byEmail.values()];
      return peopleDirectory;
    }

    function hideShareSuggestions() {
      const el = document.getElementById('shareSuggest');
      if (el) { el.style.display = 'none'; el.innerHTML = ''; }
    }

    async function renderShareSuggestions() {
      const input = document.getElementById('shareSearchInput');
      const el = document.getElementById('shareSuggest');
      const session = shareModalSession();
      if (!input || !el || !session) return;
      const q = input.value.trim().toLowerCase();
      if (!q) return hideShareSuggestions();
      const people = await loadPeopleDirectory();
      const taken = new Set([sessionOwnerEmail(session), ...(shareDraft?.people || []).map(p => p.email.toLowerCase())]);
      const matches = people
        .filter(p => p.email && !taken.has(p.email.toLowerCase())
          && (`${p.name || ''} ${p.email}`).toLowerCase().includes(q))
        .sort((a, b) => {
          // Prefix matches on first/last name rank first
          const aHit = (`${a.name || ''} ${a.email}`).toLowerCase().split(/[\s@.]+/).some(w => w.startsWith(q));
          const bHit = (`${b.name || ''} ${b.email}`).toLowerCase().split(/[\s@.]+/).some(w => w.startsWith(q));
          return (bHit ? 1 : 0) - (aHit ? 1 : 0);
        })
        .slice(0, 6);
      if (!matches.length) return hideShareSuggestions();
      el.innerHTML = matches.map(p => `
        <button class="share-suggest-row" onmousedown="event.preventDefault()" onclick="shareModalAddPersonEntry('${escapeHtml(p.email)}', '${escapeHtml(p.name || '')}', '${escapeHtml(p.image || '')}')">
          ${p.image ? `<img class="share-avatar share-avatar-sm" src="${escapeHtml(p.image)}" alt="">` : `<div class="share-avatar share-avatar-sm share-avatar-initials">${escapeHtml(shareInitials(p.email))}</div>`}
          <span>${escapeHtml(p.name || p.email)}</span>
        </button>`).join('');
      el.style.display = 'block';
    }

    function shareModalAddPersonEntry(email, name, image) {
      if (!shareDraft) return;
      const role = document.getElementById('shareRoleBtn')?.dataset.value || 'viewer';
      const lower = email.toLowerCase();
      const existing = shareDraft.people.find(p => p.email.toLowerCase() === lower);
      if (existing) existing.role = role;
      else shareDraft.people.push({ email: lower, role, name: name || null, image: image || null });
      const input = document.getElementById('shareSearchInput');
      if (input) input.value = '';
      hideShareSuggestions();
      renderShareAccessList();
      updateShareSaveEnabled();
    }

    // ── Role popovers (shared pattern with the nav more-menu) ──
    let rolePopoverEl = null;
    function closeRolePopover() {
      if (rolePopoverEl) { rolePopoverEl.remove(); rolePopoverEl = null; }
      document.removeEventListener('mousedown', onRolePopoverOutside, true);
    }
    function onRolePopoverOutside(e) {
      if (rolePopoverEl && !rolePopoverEl.contains(e.target)) closeRolePopover();
    }

    function openRolePopover(btn, options, current, onPick, { fullWidth = false } = {}) {
      if (rolePopoverEl) { closeRolePopover(); return; }
      const menu = document.createElement('div');
      menu.className = 'session-menu-popover role-popover';
      if (fullWidth) menu.style.width = `${btn.getBoundingClientRect().width}px`;
      menu.innerHTML = options.map(o => `
        <button class="session-menu-item${o.danger ? ' danger' : ''}" data-value="${o.value}">
          <span class="role-check">${o.value === current ? icon('check', 'icon icon-sm') : ''}</span>${o.label}
        </button>`).join('');
      document.body.appendChild(menu);
      menu.querySelectorAll('.session-menu-item').forEach(item => {
        item.onclick = () => { closeRolePopover(); onPick(item.dataset.value); };
      });
      const r = btn.getBoundingClientRect();
      const mw = menu.offsetWidth, mh = menu.offsetHeight;
      let left = r.right - mw;
      let top = r.bottom + 6;
      if (top + mh > window.innerHeight - 8) top = r.top - mh - 6;
      if (left < 8) left = 8;
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
      rolePopoverEl = menu;
      document.addEventListener('mousedown', onRolePopoverOutside, true);
    }

    function openShareRolePopover(event) {
      const btn = document.getElementById('shareRoleBtn');
      openRolePopover(event.currentTarget, [
        { value: 'editor', label: 'Editor' },
        { value: 'viewer', label: 'Viewer' },
      ], btn.dataset.value, (value) => {
        btn.dataset.value = value;
        document.getElementById('shareRoleBtnLabel').textContent = value === 'editor' ? 'Editor' : 'Viewer';
      });
    }

    function openPersonRolePopover(event, email) {
      const person = shareDraft?.people.find(p => p.email.toLowerCase() === email.toLowerCase());
      if (!person) return;
      const isSelf = email.toLowerCase() === currentUserEmail();
      // A viewer editing their own row can't promote themselves
      const options = shareCanManage() || (isSelf && person.role === 'editor')
        ? [{ value: 'editor', label: 'Editor' }, { value: 'viewer', label: 'Viewer' }, { value: 'remove', label: 'Remove', danger: true }]
        : [{ value: 'viewer', label: 'Viewer' }, { value: 'remove', label: 'Remove', danger: true }];
      openRolePopover(event.currentTarget, options, person.role, (value) => shareModalSetRole(email, value));
    }

    function shareInitials(email) {
      const name = String(email || '?').split('@')[0];
      return name.split(/[._-]/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function renderShareAccessList() {
      const list = document.getElementById('shareAccessList');
      const session = shareModalSession();
      if (!list || !session) return;
      const ownerEmail = sessionOwnerEmail(session) || currentUserEmail();
      const ownerIsMe = ownerEmail === currentUserEmail();
      const ownerAvatar = ownerIsMe && currentUser?.slackImageUrl
        ? `<img class="share-avatar" src="${currentUser.slackImageUrl}" alt="">`
        : `<div class="share-avatar share-avatar-initials">${escapeHtml(shareInitials(ownerEmail))}</div>`;
      const rows = [`
        <div class="share-person">
          ${ownerAvatar}
          <div class="share-person-name">${escapeHtml(ownerEmail)}${ownerIsMe ? ' <span class="share-you">(you)</span>' : ''}</div>
          <div class="share-person-role">Owner</div>
        </div>`];
      (shareDraft?.people || []).forEach(p => {
        // Prefer live directory data (Slack avatars from quick.id) over stored values
        const dir = (peopleDirectory || []).find(d => d.email === p.email.toLowerCase());
        const image = p.image || dir?.image || null;
        const name = p.name || dir?.name || p.email;
        const isSelf = p.email.toLowerCase() === currentUserEmail();
        const editable = shareCanManage() || isSelf;
        rows.push(`
          <div class="share-person">
            ${image ? `<img class="share-avatar" src="${escapeHtml(image)}" alt="">` : `<div class="share-avatar share-avatar-initials">${escapeHtml(shareInitials(p.email))}</div>`}
            <div class="share-person-name">${escapeHtml(name)}${isSelf ? ' <span class="share-you">(you)</span>' : ''}</div>
            ${editable ? `
            <button class="share-role-btn" onclick="openPersonRolePopover(event, '${escapeHtml(p.email)}')">
              <span>${p.role === 'editor' ? 'Editor' : 'Viewer'}</span>${icon('chevron', 'icon icon-sm')}
            </button>` : `
            <div class="share-person-role">${p.role === 'editor' ? 'Editor' : 'Viewer'}</div>`}
          </div>`);
      });
      list.innerHTML = rows.join('');
    }

    function shareModalAddPerson() {
      const input = document.getElementById('shareSearchInput');
      if (!input) return;
      // Prefer the top directory suggestion; otherwise treat input as an email
      const first = document.querySelector('#shareSuggest .share-suggest-row');
      if (first) { first.click(); return; }
      let email = input.value.trim().toLowerCase();
      if (!email) return;
      if (!email.includes('@')) email = `${email.replace(/\s+/g, '.')}@shopify.com`;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showToast('Enter a valid email');
      if (email === currentUserEmail()) return showToast('That\u2019s you — already the owner');
      shareModalAddPersonEntry(email, '', '');
    }

    function shareModalSetRole(email, value) {
      if (!shareDraft) return;
      if (value === 'remove') {
        shareDraft.people = shareDraft.people.filter(p => p.email.toLowerCase() !== email.toLowerCase());
      } else {
        const person = shareDraft.people.find(p => p.email.toLowerCase() === email.toLowerCase());
        if (person) person.role = value;
      }
      renderShareAccessList();
      updateShareSaveEnabled();
    }

    function shareModalTogglePublic() {
      if (!shareDraft) return;
      shareDraft.publicView = !shareDraft.publicView;
      const toggle = document.getElementById('sharePublicToggle');
      toggle?.classList.toggle('on', shareDraft.publicView);
      toggle?.setAttribute('aria-checked', String(shareDraft.publicView));
      updateShareSaveEnabled();
    }

    async function deleteSession(id) {
      if (!confirm('Delete this session and all its notes?')) return false;
      try {
        await sessionsDb.delete(id);
        const wasActive = activeSessionId === id;
        if (wasActive) {
          activeSessionId = null;
          isRecording = false;
        }
        await loadSessions();
        if (wasActive || !activeSessionId) {
          render();
        } else {
          // Deleting a different session must not blow away the open canvas —
          // a full render() rebuilds the review view without re-initializing it.
          renderSidebar();
        }
        return true;
      } catch(e) {
        console.error('Failed to delete:', e);
        return false;
      }
    }

    // ── Recording ──
    // "Session into canvas" mode — notes recorded get appended to the
    // already-open session/canvas instead of creating a new one.
    let recordingIntoCanvas = false;
    let recordingBaseNotes = [];
    let recordingBaseDuration = 0;
    function composedSessionNotes() {
      return recordingIntoCanvas ? [...recordingBaseNotes, ...currentNotes] : [...currentNotes];
    }

    async function startSessionIntoCanvas() {
      const session = allSessions.find(s => s.id === activeSessionId);
      if (!session || !canEditSession(session)) return;
      await startRecording({ intoCanvas: true });
    }

    // ── Session scrubbing ──
    // The screen stream is recorded into an in-memory buffer (never uploaded,
    // freed when the recording stops) so the user can scrub back in time and
    // screenshot a moment they missed.
    let sessionRecorder = null;
    let recordedChunks = [];
    let recordedBytes = 0;
    let recorderMimeType = '';
    let recorderStartTime = null;
    let recorderEndTime = null;
    let scrubActive = false;
    let scrubEntering = false;
    let scrubTimeMs = 0;
    let scrubDurationMs = 0;
    let scrubBlobUrl = null;
    let scrubSeekBusy = false;
    let scrubSeekPending = null;
    const SCRUB_MAX_BYTES = 1_500_000_000; // ~1.5 GB in-memory cap (~10 hrs at 2.5 Mbps → realistically hours)

    function startSessionRecorder() {
      recordedChunks = [];
      recordedBytes = 0;
      recorderStartTime = Date.now();
      recorderEndTime = null;
      const candidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
      recorderMimeType = window.MediaRecorder
        ? candidates.find(t => MediaRecorder.isTypeSupported(t)) || '' : '';
      if (!recorderMimeType || !mediaStream) { sessionRecorder = null; return; }
      try {
        sessionRecorder = new MediaRecorder(mediaStream, {
          mimeType: recorderMimeType,
          videoBitsPerSecond: 2_500_000,
        });
      } catch (e) {
        console.warn('[screen-notes] MediaRecorder unavailable — scrubbing disabled', e);
        sessionRecorder = null;
        return;
      }
      sessionRecorder.ondataavailable = (e) => {
        if (!e.data || !e.data.size) return;
        recordedChunks.push(e.data);
        recordedBytes += e.data.size;
        if (recordedBytes > SCRUB_MAX_BYTES && sessionRecorder?.state === 'recording') {
          // Keep what we have: scrubbing still covers the session so far.
          try { sessionRecorder.stop(); } catch (_) {}
          recorderEndTime = Date.now();
          console.warn('[screen-notes] scrub buffer full — history frozen at', formatDuration(recorderEndTime - recorderStartTime));
        }
      };
      sessionRecorder.onerror = (e) => console.warn('[screen-notes] session recorder error', e?.error || e);
      sessionRecorder.start(1000);
    }

    function stopSessionRecorder() {
      if (sessionRecorder && sessionRecorder.state !== 'inactive') {
        try { sessionRecorder.stop(); } catch (_) {}
      }
      sessionRecorder = null;
      // Free the scrub buffer — the recording is never persisted anywhere.
      recordedChunks = [];
      recordedBytes = 0;
      if (scrubBlobUrl) { URL.revokeObjectURL(scrubBlobUrl); scrubBlobUrl = null; }
      scrubActive = false;
      scrubTimeMs = 0;
      scrubDurationMs = 0;
      scrubSeekBusy = false;
      scrubSeekPending = null;
    }

    function scrubberAvailable() {
      return recordedChunks.length > 0;
    }

    // The scrub timeline is anchored to "now": its right edge is the current
    // moment of the still-running recording, not the end of the loaded blob.
    function scrubElapsedMs() {
      return Math.max(0, (recorderEndTime || Date.now()) - (recorderStartTime || Date.now()));
    }

    async function loadScrubBlob() {
      const video = document.getElementById('playbackVideo');
      if (!video || !scrubberAvailable()) return false;
      if (scrubBlobUrl) URL.revokeObjectURL(scrubBlobUrl);
      // Cheap: the Blob references the chunk memory, it doesn't copy it.
      const blob = new Blob(recordedChunks, { type: recorderMimeType });
      scrubBlobUrl = URL.createObjectURL(blob);
      video.src = scrubBlobUrl;
      await new Promise((resolve, reject) => {
        const ok = () => { cleanup(); resolve(); };
        const bad = () => { cleanup(); reject(new Error('playback load failed')); };
        const cleanup = () => {
          video.removeEventListener('loadedmetadata', ok);
          video.removeEventListener('error', bad);
        };
        video.addEventListener('loadedmetadata', ok);
        video.addEventListener('error', bad);
        setTimeout(bad, 5000);
      });
      // MediaRecorder webm carries no duration header. Seeking far past the
      // end forces the browser to compute the real duration.
      if (!isFinite(video.duration) || !video.duration) {
        video.currentTime = 1e10;
        await new Promise(resolve => {
          const done = () => { video.removeEventListener('seeked', done); resolve(); };
          video.addEventListener('seeked', done);
          setTimeout(done, 3000);
        });
      }
      scrubDurationMs = isFinite(video.duration) && video.duration
        ? video.duration * 1000
        : scrubElapsedMs();
      scrubSeekBusy = false;
      scrubSeekPending = null;
      return true;
    }

    async function enterScrubMode() {
      if (scrubActive) return true;
      if (scrubEntering || !scrubberAvailable()) return false;
      scrubEntering = true;
      try {
        if (!await loadScrubBlob()) return false;
        scrubActive = true;
        scrubTimeMs = Math.min(scrubDurationMs, scrubElapsedMs());
        document.getElementById('videoPanel')?.classList.add('scrubbing');
        updateScrubBarUI();
        return true;
      } catch (e) {
        console.warn('[screen-notes] could not enter scrub mode', e);
        return false;
      } finally {
        scrubEntering = false;
      }
    }

    // Footage keeps recording while scrubbed; the loaded blob goes stale.
    // Reload it so the user can scrub right up to (and back onto) live.
    async function refreshScrubBlobIfStale() {
      if (!scrubActive || scrubEntering) return;
      if (!sessionRecorder || sessionRecorder.state !== 'recording') return;
      if (scrubElapsedMs() - scrubDurationMs < 2000) return;
      scrubEntering = true;
      try { await loadScrubBlob(); } catch (_) {} finally { scrubEntering = false; }
    }

    function backToLive() {
      scrubActive = false;
      scrubSeekBusy = false;
      scrubSeekPending = null;
      const video = document.getElementById('playbackVideo');
      if (video) { video.removeAttribute('src'); video.load(); }
      if (scrubBlobUrl) { URL.revokeObjectURL(scrubBlobUrl); scrubBlobUrl = null; }
      document.getElementById('videoPanel')?.classList.remove('scrubbing');
      updateScrubBarUI();
    }

    function seekScrub(ms) {
      const video = document.getElementById('playbackVideo');
      if (!video || !scrubActive) return;
      scrubTimeMs = Math.max(0, Math.min(ms, scrubElapsedMs()));
      // Clamp to the loaded footage, a hair short of its end so a decodable
      // frame is always shown
      const target = Math.min(scrubTimeMs / 1000, Math.max(0, (video.duration || 0) - 0.05));
      if (scrubSeekBusy) {
        scrubSeekPending = target;
      } else {
        scrubSeekBusy = true;
        video.currentTime = target;
      }
      updateScrubBarUI();
    }

    function onScrubTrackMouseDown(e) {
      e.preventDefault();
      const track = document.getElementById('scrubTrack');
      if (!track) return;
      // Listeners attach synchronously: if they attached after awaiting the
      // blob load and the mouse was released during the await, mouseup was
      // missed and the handle stuck to the cursor.
      let lastX = e.clientX;
      let released = false;
      const apply = () => {
        if (!scrubActive) return;
        const r = track.getBoundingClientRect();
        const frac = Math.max(0, Math.min(1, (lastX - r.left) / r.width));
        seekScrub(frac * scrubElapsedMs());
      };
      const finish = () => {
        if (!scrubActive) return;
        apply();
        // Releasing at the live edge returns to the live view — no button needed
        if (scrubTimeMs >= scrubElapsedMs() - 500) backToLive();
      };
      const onMove = (ev) => { lastX = ev.clientX; apply(); };
      const onUp = (ev) => {
        released = true;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        lastX = ev.clientX;
        finish();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      (async () => {
        if (!scrubActive) {
          const ok = await enterScrubMode();
          if (!ok) {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            return;
          }
        } else {
          await refreshScrubBlobIfStale();
        }
        // Mouse released while the blob was loading — apply the final position
        if (released) finish();
        else apply();
      })();
    }

    function setupScrubber() {
      const video = document.getElementById('playbackVideo');
      const track = document.getElementById('scrubTrack');
      if (!video || !track) return;
      video.addEventListener('seeked', () => {
        scrubSeekBusy = false;
        if (scrubSeekPending != null) {
          const t = scrubSeekPending;
          scrubSeekPending = null;
          scrubSeekBusy = true;
          video.currentTime = t;
        }
      });
      track.addEventListener('mousedown', onScrubTrackMouseDown);
      updateScrubBarUI();
    }

    function updateScrubBarUI() {
      const bar = document.getElementById('scrubBar');
      if (!bar) return;
      // Visible as soon as the recorder is running — not delayed until the
      // first chunk lands. Scrub attempts before footage exists just no-op.
      const recorderRunning = !!sessionRecorder && sessionRecorder.state === 'recording';
      bar.classList.toggle('hidden', !recorderRunning && !scrubberAvailable() && !scrubActive);
      bar.classList.toggle('scrubbing', scrubActive);
      const elapsed = scrubElapsedMs();
      const frac = scrubActive && elapsed ? Math.min(1, scrubTimeMs / elapsed) : 1;
      const fill = document.getElementById('scrubFill');
      const handle = document.getElementById('scrubHandle');
      if (fill) fill.style.width = `${frac * 100}%`;
      if (handle) handle.style.left = `${frac * 100}%`;
      // Current-time clock (the rec pill's replacement) — fixed in place,
      // keeps ticking in both live and scrubbed modes.
      const clock = document.getElementById('liveClock');
      if (clock && recordingStartTime) {
        clock.textContent = formatDuration(scrubActive ? elapsed : Date.now() - recordingStartTime);
      }
      const label = document.getElementById('scrubTimeLabel');
      if (label) label.textContent = `${formatDuration(scrubTimeMs)} /`;
      document.getElementById('scrubBackFloat')?.classList.toggle('visible', scrubActive);
    }

    // Screenshots come from the scrubbed frame while scrubbing, live otherwise
    function activeCaptureVideo() {
      const playback = document.getElementById('playbackVideo');
      if (scrubActive && playback && playback.readyState >= 2) return playback;
      return document.getElementById('screenVideo');
    }

    // Note timestamps reflect the moment shown on screen, not wall-clock time
    function currentCaptureTimestampMs() {
      return scrubActive ? Math.round(scrubTimeMs) : (Date.now() - recordingStartTime);
    }

    async function startRecording(opts = {}) {
      try {
        // Request highest possible resolution. Browsers will clamp to what the source supports.
        mediaStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            cursor: 'always',
            width:    { ideal: 7680, max: 7680 },
            height:   { ideal: 4320, max: 4320 },
            frameRate:{ ideal: 30 },
          },
          audio: false
        });
        // After acquisition, try to push the track to its native resolution
        // (some browsers won't honor constraints in getDisplayMedia itself).
        const track = mediaStream.getVideoTracks()[0];
        try {
          const caps = track.getCapabilities ? track.getCapabilities() : null;
          if (caps && caps.width && caps.height) {
            await track.applyConstraints({
              width:  { ideal: caps.width.max  || 7680 },
              height: { ideal: caps.height.max || 4320 },
            });
          }
        } catch(_) { /* not all UAs support this; fine */ }
      } catch(e) {
        // User cancelled
        return;
      }

      isRecording = true;
      recordingStartTime = Date.now();
      currentNotes = [];
      screenshotCaptured = null;
      // Stale composer state from a previous recording blocks the first
      // auto-capture (beginNoteScreenshotCapture guards on these)
      pendingScreenshot = null;
      screenshotRemoved = false;

      const targetSession = opts.intoCanvas
        ? allSessions.find(s => s.id === activeSessionId) : null;
      recordingIntoCanvas = !!targetSession;
      recordingBaseNotes = targetSession ? [...(targetSession.notes || [])] : [];
      recordingBaseDuration = targetSession ? (targetSession.duration || 0) : 0;

      if (!targetSession) {
        // Create a new session immediately
        const session = {
          title: 'Untitled session',
          ownerEmail: currentUser?.email || null,
          ownerName: currentUser?.fullName || currentUser?.email || null,
          notes: [],
          duration: 0,
          // New sessions are hidden from the rest of Shopify by default
          sharing: { publicView: false, people: [] },
          // Keeps the session out of session lists until recording ends
          recording: true,
        };
        await saveSession(session);
        activeSessionId = session.id;
      }

      // Handle stream ending (user clicks "Stop sharing")
      mediaStream.getVideoTracks()[0].onended = () => {
        stopRecording();
      };

      // In-memory recording that powers the scrubber (freed at session end)
      startSessionRecorder();

      render();
      startTimer();
      if (voiceCommandsEnabledPreference) {
        // Start in dictation mode right away: marker visible, speech transcribed,
        // and the first spoken words auto-capture a screenshot (same as tapping the mic).
        voiceNoteDictationActive = true;
        voiceCaptureOnFirstDictationText = true;
        voiceInterimStart = null;
        voiceInterimText = '';
        enableVoiceCommands(false);
        updateVoiceCommandControl();
      }
    }

    // ── Blank canvas (no recording required) ──
    async function createNewCanvas() {
      closeNavDrawer();
      const session = {
        title: 'Untitled canvas',
        ownerEmail: currentUser?.email || null,
        ownerName: currentUser?.fullName || currentUser?.email || null,
        notes: [],
        duration: 0,
        // New canvases are hidden from the rest of Shopify by default
        sharing: { publicView: false, people: [] },
        canvas: { viewport: { x: 0, y: 0, scale: 1 }, items: [] },
      };
      await saveSession(session);
      if (session.id) await viewSession(session.id);
    }

    async function stopRecording() {
      const stoppedSessionId = activeSessionId;
      isRecording = false;
      // Stop this recording's listener without changing the user's choice for
      // whether voice commands should start automatically next time.
      stopVoiceCommands(false);

      stopSessionRecorder();
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }

      clearInterval(timerInterval);
      renderLoadingState('Preparing your session…');

      if (stoppedSessionId) {
        let session = allSessions.find(s => s.id === stoppedSessionId);
        if (session) {
          const intoCanvas = recordingIntoCanvas;
          session.duration = recordingBaseDuration + (Date.now() - recordingStartTime);
          session.notes = composedSessionNotes();
          session.recording = false;
          recordingIntoCanvas = false;
          recordingBaseNotes = [];
          recordingBaseDuration = 0;
          // Lightbox squiggles get baked into their screenshots at session end
          await bakeNoteMarkupsIntoImages(session);
          // If the canvas had not yet been created, create it now so stop lands
          // directly on a populated canvas without requiring refresh/navigation.
          if (!session.canvas || !session.canvas.items || session.canvas.items.length === 0) {
            session.canvas = {
              viewport: { x: 0, y: 0, scale: 1 },
              items: generateInitialLayout(session.notes),
            };
          } else {
            // Canvas already exists (recording into an existing canvas, or
            // another tab opened this session mid-recording and materialized
            // it early). Append items for any notes that don't have one yet,
            // to the right of the existing content, leaving everything already
            // on the canvas untouched.
            const existing = session.canvas.items;
            const covered = new Set(existing
              .filter(it => it.noteIndex != null)
              .map(it => it.noteIndex));
            const missing = session.notes.map((_, i) => i).filter(i => !covered.has(i));
            if (missing.length) {
              const offsetX = existing.length
                ? Math.max(...existing.map(it => it.x + (it.w || 0))) + 128 : 0;
              const minY = existing.length
                ? Math.min(...existing.map(it => it.y)) : 0;
              const newItems = generateInitialLayout(missing.map(i => session.notes[i])).map(it => ({
                ...it,
                noteIndex: missing[it.noteIndex],
                x: it.x + offsetX,
                y: it.y + minY,
              }));
              session.canvas.items = [...existing, ...newItems];
            }
          }
          await saveSession(session);
          activeSessionId = stoppedSessionId;
          currentNotes = session.notes || [];
          setSessionUrl(stoppedSessionId);
          render();
          requestAnimationFrame(() => {
            initCanvas(session);
            // Let images/text render, then measure actual heights and arrange once.
            // (Skip auto-arrange when appending to an existing canvas.)
            setTimeout(() => {
              if (!intoCanvas) autoArrangeCanvas();
              fitToScreen();
            }, 100);
          });
          return;
        }
      }

      render();
    }

    function renderLoadingState(message = 'Loading…') {
      const main = document.getElementById('mainContent');
      if (!main) return;
      main.innerHTML = `
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <div>${escapeHtml(message)}</div>
        </div>
      `;
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const el = document.getElementById('recTimer');
        if (el) el.textContent = formatDuration(Date.now() - recordingStartTime);
        // Reveals the scrub bar once the first recorded chunk exists
        updateScrubBarUI();
      }, 1000);
    }

    // ── Voice commands ──
    function waitForVoiceHintAnimation(ms) {
      return new Promise(resolve => window.setTimeout(resolve, ms));
    }

    async function animateVoiceListeningHint(labelElement, runId) {
      let labelIndex = 0;
      while (runId === voiceHintAnimationRun && voiceCommandsVisualActive && labelElement.isConnected) {
        const label = VOICE_LISTENING_HINTS[labelIndex];
        labelElement.replaceChildren();

        for (const value of label) {
          if (runId !== voiceHintAnimationRun || !voiceCommandsVisualActive || !labelElement.isConnected) return;
          const character = document.createElement('span');
          character.className = 'voice-hint-character entering';
          character.textContent = value;
          labelElement.appendChild(character);
          await waitForVoiceHintAnimation(90);
        }

        await waitForVoiceHintAnimation(3000);
        while (labelElement.lastElementChild) {
          if (runId !== voiceHintAnimationRun || !voiceCommandsVisualActive || !labelElement.isConnected) return;
          const character = labelElement.lastElementChild;
          character.classList.remove('entering');
          character.classList.add('exiting');
          // Let the exit animation reach its blurred state before removing it.
          await waitForVoiceHintAnimation(160);
          character.remove();
        }

        await waitForVoiceHintAnimation(220);
        labelIndex = (labelIndex + 1) % VOICE_LISTENING_HINTS.length;
      }
    }

    function syncVoiceListeningHint() {
      const hint = document.getElementById('voiceListeningHint');
      const label = document.getElementById('voiceListeningLabel');
      const visible = voiceCommandsVisualActive;
      if (hint) hint.classList.toggle('visible', visible);

      if (!visible || !label) {
        voiceHintAnimationRun += 1;
        voiceHintAnimationElement = null;
        if (label) label.replaceChildren();
        return;
      }
      if (voiceHintAnimationElement === label) return;

      voiceHintAnimationElement = label;
      const runId = ++voiceHintAnimationRun;
      animateVoiceListeningHint(label, runId);
    }

    function updateVoiceCommandControl() {
      const toggle = document.getElementById('voiceInputToggle');
      if (toggle) {
        toggle.classList.toggle('listening', voiceCommandsVisualActive);
        toggle.setAttribute('aria-pressed', String(voiceCommandsVisualActive));
        toggle.setAttribute('aria-label', voiceCommandsVisualActive ? 'Turn off voice commands' : 'Start voice dictation');
        toggle.title = voiceCommandsVisualActive ? 'Turn off voice commands' : 'Start voice dictation';
      }
      syncVoiceListeningHint();
      updateVoiceDictationMarker();
    }

    function toggleVoiceCommands() {
      if (voiceCommandsVisualActive || voiceCommandsStarting) {
        stopVoiceCommands();
      } else {
        voiceNoteDictationActive = true;
        voiceCaptureOnFirstDictationText = true;
        voiceInterimStart = null;
        voiceInterimText = '';
        if (!voiceCommandsShouldListen) enableVoiceCommands();
        else startVoiceRecognition();
        updateVoiceCommandControl();
        const input = document.getElementById('noteInput');
        if (input && document.activeElement !== input) {
          suppressNextNoteFocusCapture = true;
          input.focus();
        }
      }
    }

    function resetVoiceNoteDictation() {
      voiceNoteDictationActive = false;
      voiceCaptureOnFirstDictationText = false;
      voiceInterimStart = null;
      voiceInterimText = '';
      updateVoiceCommandControl();
    }

    function formatVoiceDictationText(prefix, text) {
      const next = String(text || '').replace(/^[ \t]+|[ \t]+$/g, '');
      if (!next) return '';
      if (!prefix || /\s$/.test(prefix) || /^[,.;:!?\u2026\n)\]]/.test(next)) return next;
      return ` ${next}`;
    }

    function updateVoiceDictationText(text, isFinal) {
      const input = document.getElementById('noteInput');
      if (!input) return;

      let start = voiceInterimStart;
      let previous = voiceInterimText;
      if (start == null || input.value.slice(start, start + previous.length) !== previous) {
        start = input.value.length;
        previous = '';
      }

      const next = formatVoiceDictationText(input.value.slice(0, start), text);
      if (!isFinal && previous && next.length < previous.length) return;
      input.setRangeText(next, start, start + previous.length, 'end');
      if (voiceCaptureOnFirstDictationText && next.trim()) {
        voiceCaptureOnFirstDictationText = false;
        beginNoteScreenshotCapture().then(updateSaveNoteButtonState);
      }
      if (isFinal) {
        voiceInterimStart = null;
        voiceInterimText = '';
      } else {
        voiceInterimStart = start;
        voiceInterimText = next;
      }

      input.scrollLeft = 0;
      // Typing scrolls the caret into view automatically; setRangeText does
      // not. Keep the latest dictated line visible.
      input.scrollTop = input.scrollHeight;
      updateSaveNoteButtonState();
      requestAnimationFrame(updateVoiceDictationMarker);
    }

    function stripVoiceControlPhrases(text) {
      return String(text || '')
        .replace(/\bsave\s+note\b/ig, ' ')
        .replace(/\b(?:remove|delete)\s+(?:the\s+)?screenshot\b/ig, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Spoken punctuation, e.g. "hello comma world period" -> "hello, world."
    function applyVoicePunctuation(text) {
      return String(text || '')
        .replace(/\s*\b(?:new\s+paragraph|paragraph\s+break)\b\s*/ig, '\n\n')
        .replace(/\s*\b(?:new\s+line|line\s+break)\b\s*/ig, '\n')
        .replace(/\s*\bquestion\s+mark\b/ig, '?')
        .replace(/\s*\bexclamation\s+(?:mark|point)\b/ig, '!')
        .replace(/\s*\bfull\s+stop\b/ig, '.')
        .replace(/\s*\bperiod\b/ig, '.')
        .replace(/\s*\bcomma\b/ig, ',')
        .replace(/\s*\bsemicolon\b/ig, ';')
        .replace(/\s*\bcolon\b/ig, ':')
        .replace(/\s*\bellips[ei]s\b/ig, '\u2026')
        .replace(/\s*\bdot\s+dot\s+dot\b/ig, '\u2026')
        .replace(/\s*\bdash\b\s*/ig, ' \u2014 ')
        .replace(/\s*\bhyphen\b\s*/ig, '-')
        .replace(/\b(?:open|left)\s+paren(?:thesis|theses)?\b\s*/ig, '(')
        .replace(/\s*\b(?:close[d]?|right)\s+paren(?:thesis|theses)?\b/ig, ')')
        .replace(/\b(?:open|left)\s+bracket\b\s*/ig, '[')
        .replace(/\s*\b(?:close[d]?|right)\s+bracket\b/ig, ']')
        .replace(/\b(?:open|begin)\s+quotes?\b\s*/ig, '"')
        .replace(/\s*\b(?:close[d]?|end)\s+quotes?\b/ig, '"')
        .replace(/[ \t]+\n/g, '\n');
    }

    async function saveNoteFromVoice() {
      if (voiceSaveNoteInFlight) return;
      voiceSaveNoteInFlight = true;
      voiceInterimStart = null;
      voiceInterimText = '';
      updateVoiceCommandControl();
      try {
        await addNote();
      } finally {
        voiceSaveNoteInFlight = false;
      }
    }

    function removeTrailingVoiceCommandPrefix() {
      const input = document.getElementById('noteInput');
      if (!input) return;
      const next = input.value.replace(/\s*(?:remove|delete)(?:\s+the)?\s*$/i, '');
      if (next === input.value) return;
      input.value = next;
      voiceInterimStart = null;
      voiceInterimText = '';
      input.scrollLeft = 0;
      updateSaveNoteButtonState();
      requestAnimationFrame(updateVoiceDictationMarker);
    }

    function handleVoiceRecognitionResult(event) {
      if (!voiceCommandsShouldListen || voiceSaveNoteInFlight) return;

      for (let i = event.resultIndex; i < event.results.length; i += 1) {
        const result = event.results[i];
        const transcript = String(result[0]?.transcript || '').trim();
        const previousResult = i > 0 ? event.results[i - 1] : null;
        const previousTranscript = String(previousResult?.[0]?.transcript || '').trim();
        const removeScreenshotAcrossResults = !!previousResult?.isFinal
          && /\b(?:remove|delete)(?:\s+the)?$/i.test(previousTranscript)
          && /^screenshot\b/i.test(transcript);
        const removeScreenshotCommand = /\b(?:remove|delete)\s+(?:the\s+)?screenshot\b/i.test(transcript)
          || removeScreenshotAcrossResults;
        const command = removeScreenshotCommand ? null : /\bscreenshot\b/i.exec(transcript);
        const saveCommand = /\bsave\s+note\b/i.test(transcript);
        let noteText = '';

        if (removeScreenshotCommand) {
          if (!voiceRemoveScreenshotResultIndexes.has(i)) {
            voiceRemoveScreenshotResultIndexes.add(i);
            if (removeScreenshotAcrossResults) removeTrailingVoiceCommandPrefix();
            removeScreenshot();
          }
          if (voiceNoteDictationActive) {
            noteText = removeScreenshotAcrossResults
              ? transcript.replace(/^screenshot\b/i, '')
              : transcript;
          }
        } else if (command) {
          // Interim recognition often reports "screenshot" before revising it
          // to "remove screenshot". Only a final generic command may capture.
          if (!result.isFinal && !voiceNoteDictationActive) continue;
          if (result.isFinal && !voiceCommandResultIndexes.has(i)) {
            voiceCommandResultIndexes.add(i);
            voiceNoteDictationActive = true;
            voiceCaptureOnFirstDictationText = false;
            updateVoiceCommandControl();
            takeVoiceScreenshot();
          } else if (result.isFinal && !voiceNoteDictationActive) {
            // The note may have been saved while this result was still interim.
            // Ignore its late final event instead of starting the old note again.
            continue;
          }
          noteText = transcript.slice(command.index + command[0].length);
        } else if (voiceNoteDictationActive) {
          noteText = transcript;
        }

        if (voiceNoteDictationActive) {
          updateVoiceDictationText(applyVoicePunctuation(stripVoiceControlPhrases(noteText)), result.isFinal);
        }

        if (saveCommand && result.isFinal && !voiceSaveResultIndexes.has(i)) {
          voiceSaveResultIndexes.add(i);
          saveNoteFromVoice();
        }
      }
    }

    function updateVoiceDictationMarker() {
      const input = document.getElementById('noteInput');
      const marker = document.getElementById('voiceDictationMarker');
      if (!input || !marker) return;

      const visible = voiceCommandsVisualActive && voiceNoteDictationActive;
      marker.classList.toggle('visible', visible);
      if (!visible) return;

      const style = getComputedStyle(input);
      const mirror = document.createElement('div');
      const copiedStyles = [
        'fontFamily', 'fontSize', 'fontStyle', 'fontWeight', 'letterSpacing',
        'lineHeight', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
        'textAlign', 'textIndent', 'textTransform', 'direction', 'tabSize',
        'wordBreak', 'overflowWrap',
      ];
      copiedStyles.forEach(property => { mirror.style[property] = style[property]; });
      mirror.style.position = 'absolute';
      mirror.style.left = '-9999px';
      mirror.style.top = '0';
      mirror.style.visibility = 'hidden';
      mirror.style.boxSizing = 'border-box';
      // clientWidth excludes the textarea's scrollbar. Matching that usable
      // width keeps long, wrapped text on the same lines in both elements.
      mirror.style.width = `${input.clientWidth}px`;
      mirror.style.whiteSpace = 'pre-wrap';
      mirror.style.wordWrap = 'break-word';
      mirror.style.overflow = 'hidden';
      const caretPosition = input.selectionEnd ?? input.value.length;
      const textBeforeCaret = input.value.slice(0, caretPosition);
      mirror.textContent = textBeforeCaret;
      if (textBeforeCaret.endsWith('\n')) mirror.appendChild(document.createTextNode('\u200b'));
      const caret = document.createElement('span');
      caret.textContent = '\u200b';
      mirror.appendChild(caret);
      document.body.appendChild(mirror);

      const left = input.offsetLeft + input.clientLeft + caret.offsetLeft - input.scrollLeft;
      const top = input.offsetTop + input.clientTop + caret.offsetTop - input.scrollTop;
      mirror.remove();

      const caretHeight = Number.parseFloat(style.lineHeight) || 22;
      marker.style.setProperty('--voice-caret-height', `${caretHeight}px`);
      marker.style.left = `${Math.max(input.offsetLeft + 4, Math.min(left - 12, input.offsetLeft + input.clientWidth - 30))}px`;
      // The bubble sits 27px above the caret. Do not clamp this to zero:
      // first-line dictation intentionally overlaps the textarea border so the
      // blue caret begins at the same vertical position as the text itself.
      marker.style.top = `${Math.min(top - 27, input.offsetTop + input.clientHeight - caretHeight - 27)}px`;
    }

    function startVoiceRecognition() {
      if (!voiceCommandsShouldListen || !isRecording || voiceCommandsListening || voiceCommandsStarting) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        voiceCommandsShouldListen = false;
        voiceCommandsVisualActive = false;
        setVoiceCommandsPreference(false);
        resetVoiceNoteDictation();
        updateVoiceCommandControl();
        return;
      }

      if (!speechRecognition) {
        speechRecognition = new SpeechRecognition();
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;
        speechRecognition.maxAlternatives = 1;
        speechRecognition.lang = navigator.language || 'en-US';

        speechRecognition.onstart = () => {
          voiceCommandsStarting = false;
          if (!voiceCommandsShouldListen || !isRecording) {
            voiceCommandsListening = false;
            voiceCommandsVisualActive = false;
            updateVoiceCommandControl();
            try { speechRecognition.abort(); } catch (_) {}
            return;
          }
          voiceCommandsListening = true;
          voiceCommandsVisualActive = true;
          voiceCommandResultIndexes.clear();
          voiceSaveResultIndexes.clear();
          voiceRemoveScreenshotResultIndexes.clear();
          updateVoiceCommandControl();
        };

        speechRecognition.onresult = handleVoiceRecognitionResult;

        speechRecognition.onerror = event => {
          voiceCommandsStarting = false;
          voiceCommandsListening = false;
          if (['not-allowed', 'service-not-allowed', 'audio-capture', 'network'].includes(event.error)) {
            voiceCommandsShouldListen = false;
            voiceCommandsVisualActive = false;
            if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(event.error)) {
              setVoiceCommandsPreference(false);
            }
            voiceCommandResultIndexes.clear();
            voiceSaveResultIndexes.clear();
            voiceRemoveScreenshotResultIndexes.clear();
            resetVoiceNoteDictation();
          }
          console.warn('[screen-notes] voice command error:', event.error);
          updateVoiceCommandControl();
        };

        speechRecognition.onend = () => {
          voiceCommandsStarting = false;
          voiceCommandsListening = false;
          // The session ended before finalizing the last interim result. Commit
          // it as-is: the next session starts fresh results at index 0 and must
          // append after the existing text (e.g. a dictated "new paragraph"),
          // not replace it.
          voiceInterimStart = null;
          voiceInterimText = '';
          clearTimeout(voiceRecognitionRestartTimer);
          if (voiceCommandsShouldListen && isRecording) {
            // SpeechRecognition regularly ends its own session. Keep the UI
            // continuously active while the engine silently reconnects.
            voiceCommandsVisualActive = true;
            updateVoiceCommandControl();
            voiceRecognitionRestartTimer = setTimeout(() => {
              voiceRecognitionRestartTimer = null;
              startVoiceRecognition();
            }, 400);
          } else {
            voiceCommandsVisualActive = false;
            updateVoiceCommandControl();
          }
        };
      }

      voiceCommandsStarting = true;
      try {
        // Starting speech recognition from this click requests microphone
        // permission; only onstart changes the link to the listening hint.
        speechRecognition.start();
      } catch (error) {
        voiceCommandsStarting = false;
        if (error?.name !== 'InvalidStateError') {
          voiceCommandsShouldListen = false;
          voiceCommandsVisualActive = false;
        }
        console.warn('[screen-notes] could not start voice commands:', error);
        updateVoiceCommandControl();
      }
    }

    function setVoiceCommandsPreference(enabled) {
      voiceCommandsEnabledPreference = enabled;
      try { localStorage.setItem(VOICE_COMMANDS_PREFERENCE_KEY, String(enabled)); }
      catch (_) {}
    }

    function enableVoiceCommands(persistPreference = true) {
      if (persistPreference) setVoiceCommandsPreference(true);
      voiceCommandsShouldListen = true;
      startVoiceRecognition();
    }

    function stopVoiceCommands(persistPreference = true) {
      if (persistPreference) setVoiceCommandsPreference(false);
      voiceCommandsShouldListen = false;
      voiceCommandsStarting = false;
      voiceCommandsListening = false;
      voiceCommandsVisualActive = false;
      clearTimeout(voiceRecognitionRestartTimer);
      voiceRecognitionRestartTimer = null;
      voiceCommandResultIndexes.clear();
      voiceSaveResultIndexes.clear();
      voiceRemoveScreenshotResultIndexes.clear();
      resetVoiceNoteDictation();
      try { speechRecognition?.abort(); } catch (_) {}
      updateVoiceCommandControl();
    }

    async function takeVoiceScreenshot() {
      const now = Date.now();
      if (!isRecording || voiceScreenshotInFlight || now - lastVoiceScreenshotAt < 1200) return;
      lastVoiceScreenshotAt = now;
      voiceScreenshotInFlight = true;
      try {
        await retakeScreenshot(false);
      } finally {
        voiceScreenshotInFlight = false;
      }
    }

    // ── Screenshot ──
    // Simple, proven path: draw the <video> tag onto a canvas and produce a
    // JPEG. JPEG keeps file size tiny (typ. <500 KB) which avoids any quick.fs
    // size limits while still looking great for screenshots.
    const MAX_DIM = 2560; // longest-edge cap, in CSS pixels of the source

    async function captureScreenshotBlob() {
      const video = activeCaptureVideo();
      if (!video || !video.videoWidth) {
        console.warn('[screen-notes] no video frame available');
        return null;
      }
      // Ensure a fresh frame is rendered
      await new Promise(r => requestAnimationFrame(r));

      const srcW = video.videoWidth;
      const srcH = video.videoHeight;
      const longest = Math.max(srcW, srcH);
      const scale = longest > MAX_DIM ? MAX_DIM / longest : 1;
      const dstW = Math.round(srcW * scale);
      const dstH = Math.round(srcH * scale);

      const c = document.getElementById('screenshotCanvas');
      c.width  = dstW;
      c.height = dstH;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(video, 0, 0, dstW, dstH);

      // High-quality JPEG. ~92% looks visually identical to the source for
      // screenshots and stays well under any reasonable upload size limit.
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));
      return blob;
    }

    // Quick low-cost preview of the current frame for the "captured" indicator.
    // We DON'T persist this — only the uploaded URL goes into the DB.
    function captureScreenshotPreview() {
      const video = activeCaptureVideo();
      if (!video || !video.videoWidth) return null;
      const c = document.getElementById('screenshotCanvas');
      c.width  = video.videoWidth;
      c.height = video.videoHeight;
      c.getContext('2d').drawImage(video, 0, 0);
      return c.toDataURL('image/png');
    }

    // ── Notes ──
    // When user focuses the note box we IMMEDIATELY grab a high-res blob and
    // start uploading it. The upload promise is stored on `screenshotCaptured`
    // so by the time they click Save Note the URL is usually already ready.
    let pendingScreenshot = null; // { blob, previewDataUrl, uploadPromise }
    let screenshotRemoved = false; // user explicitly removed pending screenshot
    let enteringNoteCreatedAt = null;

    async function beginNoteScreenshotCapture() {
      if (!isRecording || pendingScreenshot || screenshotRemoved) return pendingScreenshot;
      // Quick preview for indicator (not persisted)
      const preview = captureScreenshotPreview();
      if (!preview) return null;

      const timeStr = formatDuration(currentCaptureTimestampMs());
      const indicator = document.getElementById('screenshotIndicator');
      const previewEl = document.getElementById('screenshotPreview');
      const previewImg = document.getElementById('screenshotPreviewImg');
      const previewTimestamp = document.getElementById('screenshotPreviewTimestamp');
      if (previewEl && previewImg) {
        previewImg.src = preview;
        previewEl.classList.remove('capturing-image');
        previewEl.classList.add('has-image');
        // Restart the subtle scale-in every time a new screenshot is captured.
        void previewEl.offsetWidth;
        previewEl.classList.add('capturing-image');
        window.setTimeout(() => previewEl.classList.remove('capturing-image'), 320);
      }
      if (previewTimestamp) {
        previewTimestamp.innerHTML = `<span>${escapeHtml(timeStr)}</span>`;
      }

      // Grab the blob and start uploading it in the background
      const blob = await captureScreenshotBlob();
      if (!blob) {
        if (indicator) indicator.innerHTML = `${icon('warning', 'icon icon-sm')} Capture failed (no frame)`;
        return null;
      }
      const file = new File([blob], `screenshot-${Date.now()}.jpg`, { type: 'image/jpeg' });
      console.log(`[screen-notes] captured ${(blob.size/1024).toFixed(1)} KB ${blob.type}`);

      const uploadPromise = (async () => {
        try {
          const r = await quick.fs.uploadFile(file);
          console.log('[screen-notes] upload response:', r);
          // Handle multiple known response shapes
          const f = r?.files?.[0] || r?.[0] || r?.file || null;
          const url = f?.fullUrl || f?.url || r?.url || r?.fullUrl || null;
          if (!url) {
            const msg = 'No URL in response: ' + JSON.stringify(r).slice(0, 200);
