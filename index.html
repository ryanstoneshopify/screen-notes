        const saveCommand = /\bsave\s+note\b/i.test(transcript);
        let noteText = '';

        if (removeScreenshotCommand) {
          if (!voiceRemoveScreenshotResultIndexes.has(i)) {
            voiceRemoveScreenshotResultIndexes.add(i);
            if (removeScreenshotAcrossResults) removeTrailingVoiceCommandPrefix();
            removeScreenshot();
          }
          if (voiceNoteDictationActive) {
            noteText = removeScreenshotAcrossResults
              ? transcript.replace(/^screenshot\b/i, '')
              : transcript;
          }
        } else if (command) {
          // Interim recognition often reports "screenshot" before revising it
          // to "remove screenshot". Only a final generic command may capture.
          if (!result.isFinal && !voiceNoteDictationActive) continue;
          if (result.isFinal && !voiceCommandResultIndexes.has(i)) {
            voiceCommandResultIndexes.add(i);
            voiceNoteDictationActive = true;
            voiceCaptureOnFirstDictationText = false;
            updateVoiceCommandControl();
            takeVoiceScreenshot();
          } else if (result.isFinal && !voiceNoteDictationActive) {
            // The note may have been saved while this result was still interim.
            // Ignore its late final event instead of starting the old note again.
            continue;
          }
          noteText = transcript.slice(command.index + command[0].length);
        } else if (voiceNoteDictationActive) {
          noteText = transcript;
        }

        if (voiceNoteDictationActive) {
          updateVoiceDictationText(stripVoiceControlPhrases(noteText), result.isFinal);
        }

        if (saveCommand && result.isFinal && !voiceSaveResultIndexes.has(i)) {
          voiceSaveResultIndexes.add(i);
          saveNoteFromVoice();
        }
      }
    }

    function updateVoiceDictationMarker() {
      const input = document.getElementById('noteInput');
      const marker = document.getElementById('voiceDictationMarker');
      if (!input || !marker) return;

      const visible = voiceCommandsVisualActive && voiceNoteDictationActive;
      marker.classList.toggle('visible', visible);
      if (!visible) return;

      const style = getComputedStyle(input);
      const mirror = document.createElement('div');
      const copiedStyles = [
        'fontFamily', 'fontSize', 'fontStyle', 'fontWeight', 'letterSpacing',
        'lineHeight', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
        'textAlign', 'textIndent', 'textTransform', 'direction', 'tabSize',
        'wordBreak', 'overflowWrap',
      ];
      copiedStyles.forEach(property => { mirror.style[property] = style[property]; });
      mirror.style.position = 'absolute';
      mirror.style.left = '-9999px';
      mirror.style.top = '0';
      mirror.style.visibility = 'hidden';
      mirror.style.boxSizing = 'border-box';
      // clientWidth excludes the textarea's scrollbar. Matching that usable
      // width keeps long, wrapped text on the same lines in both elements.
      mirror.style.width = `${input.clientWidth}px`;
      mirror.style.whiteSpace = 'pre-wrap';
      mirror.style.wordWrap = 'break-word';
      mirror.style.overflow = 'hidden';
      const caretPosition = input.selectionEnd ?? input.value.length;
      const textBeforeCaret = input.value.slice(0, caretPosition);
      mirror.textContent = textBeforeCaret;
      if (textBeforeCaret.endsWith('\n')) mirror.appendChild(document.createTextNode('\u200b'));
      const caret = document.createElement('span');
      caret.textContent = '\u200b';
      mirror.appendChild(caret);
      document.body.appendChild(mirror);

      const left = input.offsetLeft + input.clientLeft + caret.offsetLeft - input.scrollLeft;
      const top = input.offsetTop + input.clientTop + caret.offsetTop - input.scrollTop;
      mirror.remove();

      const caretHeight = Number.parseFloat(style.lineHeight) || 22;
      marker.style.setProperty('--voice-caret-height', `${caretHeight}px`);
      marker.style.left = `${Math.max(input.offsetLeft + 4, Math.min(left - 12, input.offsetLeft + input.clientWidth - 30))}px`;
      // The bubble sits 27px above the caret. Do not clamp this to zero:
      // first-line dictation intentionally overlaps the textarea border so the
      // blue caret begins at the same vertical position as the text itself.
      marker.style.top = `${Math.min(top - 27, input.offsetTop + input.clientHeight - caretHeight - 27)}px`;
    }

    function startVoiceRecognition() {
      if (!voiceCommandsShouldListen || !isRecording || voiceCommandsListening || voiceCommandsStarting) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        voiceCommandsShouldListen = false;
        voiceCommandsVisualActive = false;
        setVoiceCommandsPreference(false);
        resetVoiceNoteDictation();
        updateVoiceCommandControl();
        return;
      }

      if (!speechRecognition) {
        speechRecognition = new SpeechRecognition();
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;
        speechRecognition.maxAlternatives = 1;
        speechRecognition.lang = navigator.language || 'en-US';

        speechRecognition.onstart = () => {
          voiceCommandsStarting = false;
          if (!voiceCommandsShouldListen || !isRecording) {
            voiceCommandsListening = false;
            voiceCommandsVisualActive = false;
            updateVoiceCommandControl();
            try { speechRecognition.abort(); } catch (_) {}
            return;
          }
          voiceCommandsListening = true;
          voiceCommandsVisualActive = true;
          voiceCommandResultIndexes.clear();
          voiceSaveResultIndexes.clear();
          voiceRemoveScreenshotResultIndexes.clear();
          updateVoiceCommandControl();
        };

        speechRecognition.onresult = handleVoiceRecognitionResult;

        speechRecognition.onerror = event => {
          voiceCommandsStarting = false;
          voiceCommandsListening = false;
          if (['not-allowed', 'service-not-allowed', 'audio-capture', 'network'].includes(event.error)) {
            voiceCommandsShouldListen = false;
            voiceCommandsVisualActive = false;
            if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(event.error)) {
              setVoiceCommandsPreference(false);
            }
            voiceCommandResultIndexes.clear();
            voiceSaveResultIndexes.clear();
            voiceRemoveScreenshotResultIndexes.clear();
            resetVoiceNoteDictation();
          }
          console.warn('[screen-notes] voice command error:', event.error);
          updateVoiceCommandControl();
        };

        speechRecognition.onend = () => {
          voiceCommandsStarting = false;
          voiceCommandsListening = false;
          clearTimeout(voiceRecognitionRestartTimer);
          if (voiceCommandsShouldListen && isRecording) {
            // SpeechRecognition regularly ends its own session. Keep the UI
            // continuously active while the engine silently reconnects.
            voiceCommandsVisualActive = true;
            updateVoiceCommandControl();
            voiceRecognitionRestartTimer = setTimeout(() => {
              voiceRecognitionRestartTimer = null;
              startVoiceRecognition();
            }, 400);
          } else {
            voiceCommandsVisualActive = false;
            updateVoiceCommandControl();
          }
        };
      }

      voiceCommandsStarting = true;
      try {
        // Starting speech recognition from this click requests microphone
        // permission; only onstart changes the link to the listening hint.
        speechRecognition.start();
      } catch (error) {
        voiceCommandsStarting = false;
        if (error?.name !== 'InvalidStateError') {
          voiceCommandsShouldListen = false;
          voiceCommandsVisualActive = false;
        }
        console.warn('[screen-notes] could not start voice commands:', error);
        updateVoiceCommandControl();
      }
    }

    function setVoiceCommandsPreference(enabled) {
      voiceCommandsEnabledPreference = enabled;
      try { localStorage.setItem(VOICE_COMMANDS_PREFERENCE_KEY, String(enabled)); }
      catch (_) {}
    }

    function enableVoiceCommands(persistPreference = true) {
      if (persistPreference) setVoiceCommandsPreference(true);
      voiceCommandsShouldListen = true;
      startVoiceRecognition();
    }

    function stopVoiceCommands(persistPreference = true) {
      if (persistPreference) setVoiceCommandsPreference(false);
      voiceCommandsShouldListen = false;
      voiceCommandsStarting = false;
      voiceCommandsListening = false;
      voiceCommandsVisualActive = false;
      clearTimeout(voiceRecognitionRestartTimer);
      voiceRecognitionRestartTimer = null;
      voiceCommandResultIndexes.clear();
      voiceSaveResultIndexes.clear();
      voiceRemoveScreenshotResultIndexes.clear();
      resetVoiceNoteDictation();
      try { speechRecognition?.abort(); } catch (_) {}
      updateVoiceCommandControl();
    }

    async function takeVoiceScreenshot() {
      const now = Date.now();
      if (!isRecording || voiceScreenshotInFlight || now - lastVoiceScreenshotAt < 1200) return;
      lastVoiceScreenshotAt = now;
      voiceScreenshotInFlight = true;
      try {
        await retakeScreenshot(false);
      } finally {
        voiceScreenshotInFlight = false;
      }
    }

    // ── Screenshot ──
    // Simple, proven path: draw the <video> tag onto a canvas and produce a
    // JPEG. JPEG keeps file size tiny (typ. <500 KB) which avoids any quick.fs
    // size limits while still looking great for screenshots.
    const MAX_DIM = 2560; // longest-edge cap, in CSS pixels of the source

    async function captureScreenshotBlob() {
      const video = document.getElementById('screenVideo');
      if (!video || !video.videoWidth) {
        console.warn('[screen-notes] no video frame available');
        return null;
      }
      // Ensure a fresh frame is rendered
      await new Promise(r => requestAnimationFrame(r));

      const srcW = video.videoWidth;
      const srcH = video.videoHeight;
      const longest = Math.max(srcW, srcH);
      const scale = longest > MAX_DIM ? MAX_DIM / longest : 1;
      const dstW = Math.round(srcW * scale);
      const dstH = Math.round(srcH * scale);

      const c = document.getElementById('screenshotCanvas');
      c.width  = dstW;
      c.height = dstH;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(video, 0, 0, dstW, dstH);

      // High-quality JPEG. ~92% looks visually identical to the source for
      // screenshots and stays well under any reasonable upload size limit.
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));
      return blob;
    }

    // Quick low-cost preview of the current frame for the "captured" indicator.
    // We DON'T persist this — only the uploaded URL goes into the DB.
    function captureScreenshotPreview() {
      const video = document.getElementById('screenVideo');
      if (!video || !video.videoWidth) return null;
      const c = document.getElementById('screenshotCanvas');
      c.width  = video.videoWidth;
      c.height = video.videoHeight;
      c.getContext('2d').drawImage(video, 0, 0);
      return c.toDataURL('image/png');
    }

    // ── Notes ──
    // When user focuses the note box we IMMEDIATELY grab a high-res blob and
    // start uploading it. The upload promise is stored on `screenshotCaptured`
    // so by the time they click Save Note the URL is usually already ready.
    let pendingScreenshot = null; // { blob, previewDataUrl, uploadPromise }
    let screenshotRemoved = false; // user explicitly removed pending screenshot
    let enteringNoteCreatedAt = null;

    async function beginNoteScreenshotCapture() {
      if (!isRecording || pendingScreenshot || screenshotRemoved) return pendingScreenshot;
      // Quick preview for indicator (not persisted)
      const preview = captureScreenshotPreview();
      if (!preview) return null;

      const timeStr = formatDuration(Date.now() - recordingStartTime);
      const indicator = document.getElementById('screenshotIndicator');
      const previewEl = document.getElementById('screenshotPreview');
      const previewImg = document.getElementById('screenshotPreviewImg');
      const previewTimestamp = document.getElementById('screenshotPreviewTimestamp');
      if (previewEl && previewImg) {
        previewImg.src = preview;
        previewEl.classList.remove('capturing-image');
        previewEl.classList.add('has-image');
        // Restart the subtle scale-in every time a new screenshot is captured.
        void previewEl.offsetWidth;
        previewEl.classList.add('capturing-image');
        window.setTimeout(() => previewEl.classList.remove('capturing-image'), 320);
      }
      if (previewTimestamp) {
        previewTimestamp.innerHTML = `<span>${escapeHtml(timeStr)}</span>`;
      }

      // Grab the blob and start uploading it in the background
      const blob = await captureScreenshotBlob();
      if (!blob) {
        if (indicator) indicator.innerHTML = `${icon('warning', 'icon icon-sm')} Capture failed (no frame)`;
        return null;
      }
      const file = new File([blob], `screenshot-${Date.now()}.jpg`, { type: 'image/jpeg' });
      console.log(`[screen-notes] captured ${(blob.size/1024).toFixed(1)} KB ${blob.type}`);

      const uploadPromise = (async () => {
        try {
          const r = await quick.fs.uploadFile(file);
          console.log('[screen-notes] upload response:', r);
          // Handle multiple known response shapes
          const f = r?.files?.[0] || r?.[0] || r?.file || null;
          const url = f?.fullUrl || f?.url || r?.url || r?.fullUrl || null;
          if (!url) {
            const msg = 'No URL in response: ' + JSON.stringify(r).slice(0, 200);
            console.error('[screen-notes] ' + msg);
            if (indicator) indicator.innerHTML = `${icon('warning', 'icon icon-sm')} ${escapeHtml(msg)}`;
            return null;
          }
          return url;
        } catch(err) {
          console.error('[screen-notes] upload threw:', err);
          const msg = err?.message || err?.toString() || 'Unknown error';
          if (indicator) indicator.innerHTML = `${icon('warning', 'icon icon-sm')} ${escapeHtml(msg)}`;
          return null;
        }
      })();

      pendingScreenshot = { previewDataUrl: preview, uploadPromise };
      updateSaveNoteButtonState();

      uploadPromise.then(() => {});

      return pendingScreenshot;
    }

    function updateSaveNoteButtonState() {
      const input = document.getElementById('noteInput');
      const button = document.getElementById('saveNoteBtn');
      if (!button) return;
      const hasText = !!input?.value.trim();
      const hasScreenshot = !!pendingScreenshot && !screenshotRemoved;
      button.disabled = !(hasText || hasScreenshot);
    }

    async function retakeScreenshot(focusNoteInput = true) {
      pendingScreenshot = null;
      screenshotRemoved = false;
      updateSaveNoteButtonState();
      const indicator = document.getElementById('screenshotIndicator');
      if (indicator) indicator.innerHTML = '';
      const previewEl = document.getElementById('screenshotPreview');
      const previewTimestamp = document.getElementById('screenshotPreviewTimestamp');
      if (previewEl) previewEl.classList.remove('has-image', 'saving-out', 'capturing-image');
      if (previewTimestamp) previewTimestamp.innerHTML = '';
      await beginNoteScreenshotCapture();
      updateSaveNoteButtonState();
      const input = document.getElementById('noteInput');
      if (focusNoteInput) input?.focus();
    }

    function removeScreenshot() {
      pendingScreenshot = null;
      screenshotRemoved = true;
      const indicator = document.getElementById('screenshotIndicator');
      if (indicator) {
        indicator.classList.remove('visible');
        indicator.innerHTML = '';
      }
      const previewEl = document.getElementById('screenshotPreview');
      const previewImg = document.getElementById('screenshotPreviewImg');
      const previewTimestamp = document.getElementById('screenshotPreviewTimestamp');
      if (previewEl) previewEl.classList.remove('has-image', 'saving-out', 'capturing-image');
      if (previewImg) previewImg.src = '';
      if (previewTimestamp) previewTimestamp.innerHTML = '';
      updateSaveNoteButtonState();
    }

    function onNoteFocus() {
      if (suppressNextNoteFocusCapture) {
        suppressNextNoteFocusCapture = false;
        return;
      }
      // Preserve existing behaviour: clicking into the box captures the moment.
      beginNoteScreenshotCapture();
    }

    function onNoteInput() {
      // Important after saving: the textarea remains focused, so focus won't fire
      // again. The next screenshot should be captured when typing starts.
      const input = document.getElementById('noteInput');
      updateSaveNoteButtonState();
      if (input?.value.trim()) beginNoteScreenshotCapture().then(updateSaveNoteButtonState);
      requestAnimationFrame(updateVoiceDictationMarker);
    }

    function animateScreenshotPreviewOut() {
      const previewEl = document.getElementById('screenshotPreview');
      if (!previewEl?.classList.contains('has-image')) return Promise.resolve();
      previewEl.classList.remove('capturing-image');
      previewEl.classList.add('saving-out');
      return new Promise(resolve => window.setTimeout(resolve, 250));
    }

    function openPendingScreenshotLightbox() {
      const previewImg = document.getElementById('screenshotPreviewImg');
      const src = pendingScreenshot?.previewDataUrl || previewImg?.src;
      if (src) openLightbox(src);
    }

    async function addNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();

      let url = null;
      if (!screenshotRemoved) {
        if (!pendingScreenshot) {
          await beginNoteScreenshotCapture();
        }
        if (pendingScreenshot) {
          url = await pendingScreenshot.uploadPromise;
          if (!url) {
            alert('Screenshot upload failed — please try the note again.');
            return;
          }
        }
      }

      // Allow image-only or text-only notes, but don't save a completely empty note.
      if (!text && !url) return;

      const note = {
        text,
        screenshotUrl: url,    // null = text-only note (no screenshot)
        timestamp: Date.now() - recordingStartTime,
        createdAt: new Date().toISOString(),
      };

      const saveButton = document.getElementById('saveNoteBtn');
      if (saveButton) saveButton.disabled = true;
      if (url) await animateScreenshotPreviewOut();

      currentNotes.push(note);
      enteringNoteCreatedAt = note.createdAt;
      input.value = '';
      input.scrollTop = 0;
      input.scrollLeft = 0;
      input.setSelectionRange(0, 0);
      pendingScreenshot = null;
      screenshotRemoved = false;
      voiceInterimStart = null;
      voiceInterimText = '';
      voiceCaptureOnFirstDictationText = voiceCommandsShouldListen && voiceNoteDictationActive;
      updateVoiceCommandControl();

      const indicator = document.getElementById('screenshotIndicator');
      if (indicator) indicator.classList.remove('visible');
      const previewEl = document.getElementById('screenshotPreview');
      const previewImg = document.getElementById('screenshotPreviewImg');
      const previewTimestamp = document.getElementById('screenshotPreviewTimestamp');
      if (previewEl) previewEl.classList.remove('has-image', 'saving-out', 'capturing-image');
      if (previewImg) previewImg.src = '';
      if (previewTimestamp) previewTimestamp.innerHTML = '';
      updateSaveNoteButtonState();

      // Save to DB (no data URLs included)
      const session = allSessions.find(s => s.id === activeSessionId);
      if (session) {
        session.notes = [...currentNotes];
        session.duration = Date.now() - recordingStartTime;
        await saveSession(session);
      }

      renderNotesList();
    }

    function deleteNote(index) {
      currentNotes.splice(index, 1);
      const session = allSessions.find(s => s.id === activeSessionId);
      if (session) {
        session.notes = [...currentNotes];
        // Canvas is not created during recording, but if it exists later, keep
        // screenshot items aligned to the remaining note indexes.
        if (session.canvas?.items) {
          session.canvas.items = session.canvas.items
            .filter(item => item.type !== 'screenshot' || item.noteIndex !== index)
            .map(item => item.type === 'screenshot' && item.noteIndex > index
              ? { ...item, noteIndex: item.noteIndex - 1 }
              : item);
        }
        saveSession(session);
      }
      renderNotesList();
    }

    async function updateRecordingNote(index, value) {
      if (!currentNotes[index]) return;
      currentNotes[index].text = value;
      const session = allSessions.find(s => s.id === activeSessionId);
      if (session) {
        session.notes = [...currentNotes];
        await saveSession(session);
      }
    }

    async function uploadCurrentFrameScreenshot() {
      const blob = await captureScreenshotBlob();
      if (!blob) throw new Error('Could not capture a screenshot yet. Please try again.');
      const file = new File([blob], `screenshot-${Date.now()}.jpg`, { type: 'image/jpeg' });
      const r = await quick.fs.uploadFile(file);
      const f = r?.files?.[0] || r?.[0] || r?.file || null;
      const url = f?.fullUrl || f?.url || r?.url || r?.fullUrl || null;
      if (!url) throw new Error('Screenshot upload failed — please try again.');
      return url;
    }

    async function removeRecordingNoteScreenshot(index) {
      if (!currentNotes[index]) return;
      currentNotes[index].screenshotUrl = null;
      delete currentNotes[index].screenshot;
      const session = allSessions.find(s => s.id === activeSessionId);
      if (session) {
        session.notes = [...currentNotes];
        await saveSession(session);
      }
      renderNotesList();
    }

    async function retakeRecordingNoteScreenshot(index) {
      if (!currentNotes[index]) return;
      try {
        const url = await uploadCurrentFrameScreenshot();
        currentNotes[index].screenshotUrl = url;
        currentNotes[index].timestamp = Date.now() - recordingStartTime;
        delete currentNotes[index].screenshot;
        const session = allSessions.find(s => s.id === activeSessionId);
        if (session) {
          session.notes = [...currentNotes];
          await saveSession(session);
        }
        renderNotesList();
      } catch (err) {
        alert(err?.message || 'Screenshot capture failed — please try again.');
      }
    }

      if (openMenuEl) { closeSessionMenu(); return; }

      const mw = menu.offsetWidth, mh = menu.offsetHeight;
      let left = r.right - mw;
      let top = r.bottom + 6;
      if (top + mh > window.innerHeight - 8) top = r.top - mh - 6;
      if (left < 8) left = 8;
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;

      document.addEventListener('mousedown', onSessionMenuOutside, true);

      const session = allSessions.find(s => s.id === id);

    // ── Center toast ──
    let toastTimer = null;
    function showToast(message) {
      let toast = document.getElementById('centerToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'centerToast';
        toast.className = 'toast-center';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      const toolbar = document.querySelector('.canvas-toolbar');
      if (toolbar) {
        // Emerge from behind the canvas toolbar, resting 24px above it
        const r = toolbar.getBoundingClientRect();
        toast.style.left = `${r.left + r.width / 2}px`;
        toast.style.bottom = `${window.innerHeight - r.top + 24}px`;
        toast.style.zIndex = '15'; // below .canvas-toolbar (20)
      } else {
        const main = document.getElementById('mainContent');
        if (main) {
          const r = main.getBoundingClientRect();
          toast.style.left = `${r.left + r.width / 2}px`;
        }
        toast.style.bottom = '24px';
        toast.style.zIndex = '500';
      }
      clearTimeout(toastTimer);
      toast.classList.remove('visible');
      void toast.offsetHeight; // restart animation from below
      requestAnimationFrame(() => toast.classList.add('visible'));
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 1000 + 1000);
    }

    // ── Sidebar resize ──
    function initSidebarResize() {
      const handle = document.getElementById('sidebarResize');
      const sidebar = document.querySelector('.sidebar');
      if (!handle || !sidebar) return;
      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handle.classList.add('dragging');
        const startX = e.clientX;
        const startW = sidebar.getBoundingClientRect().width;
        const onMove = (ev) => {
          const w = Math.min(400, Math.max(240, startW + (ev.clientX - startX)));
          sidebar.style.width = `${w}px`;
          document.documentElement.style.setProperty('--sidebar-w', `${w}px`);
        };
        const onUp = () => {
          handle.classList.remove('dragging');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    function renderHomeHiddenNotes() {
      const samples = [
        { text: 'The onboarding flow skips step 2 when you resize — capture this for the team.', time: '0:42', image: true },
        { text: 'Love the new empty state. Ship it.', time: '1:15', image: true },
        { text: 'Bug: toast overlaps the composer on small screens.', time: '3:08', image: true },
        { text: 'Voice note — remember to annotate the pricing modal.', time: '5:27', image: true },
        { text: 'Quick thought — the empty state could double as a playground.', time: '2:34', image: false },
        { text: 'Follow up with the team about session sharing permissions.', time: '4:51', image: false },
      ];
      const W = window.innerWidth, H = window.innerHeight;
      const cardW = 260, margin = 24;
      const sidebarRight = (document.querySelector('.sidebar')?.getBoundingClientRect().right || 312) + margin;
      // Random non-overlapping-ish placement: sample positions, reject ones too close to existing.
      const placed = [];
      const randomPos = () => ({
        x: Math.round(sidebarRight + Math.random() * Math.max(1, W - cardW - margin - sidebarRight)),
        y: Math.round(margin + Math.random() * Math.max(1, H - 320 - margin * 2)),
      });
      const pick = () => {
        for (let attempt = 0; attempt < 30; attempt++) {
          const p = randomPos();
          const cx = W / 2, cy = H / 2;
          const nearCenter = Math.abs(p.x + cardW / 2 - cx) < 320 && Math.abs(p.y + 140 - cy) < 260;
          const overlaps = placed.some(q => Math.abs(q.x - p.x) < cardW + 20 && Math.abs(q.y - p.y) < 280);
          if (!nearCenter && !overlaps) { placed.push(p); return p; }
        }
        const p = randomPos(); placed.push(p); return p;
      };
      return samples.map((s) => {
        const p = pick();
        const rot = (Math.random() * 16 - 8).toFixed(1);
        return `
          <div class="note-card home-hidden-note${s.image ? '' : ' note-card-text-only'}"
               style="left: ${p.x}px; top: ${p.y}px; transform: rotate(${rot}deg);">
            ${s.image ? '<div class="note-card-screenshot-wrap"><div class="note-card-screenshot"></div></div>' : ''}
            <div class="note-card-body">
              <div class="note-card-text" contenteditable="true" spellcheck="false">${s.text}</div>
              <div class="note-card-meta"><span>${s.time}</span></div>
            </div>
            <div class="home-note-resize"></div>
          </div>
        `;
      }).join('');
    }

                <button type="button" class="screenshot-preview-btn" onclick="event.stopPropagation(); retakeRecordingNoteScreenshot(${realIndex})" title="Retake screenshot">${icon('refresh', 'icon icon-sm')}</button>
                <button type="button" class="screenshot-preview-btn" onclick="event.stopPropagation(); removeRecordingNoteScreenshot(${realIndex})" title="Remove screenshot">${icon('trash', 'icon icon-sm')}</button>
              </div>
            </div>` : ''}
            <div class="note-card-body">
              <textarea class="recording-note-edit"
                        rows="1"
                        oninput="autoGrowTextarea(this)"
                        onfocus="autoGrowTextarea(this)"
                        onblur="updateRecordingNote(${realIndex}, this.value)">${escapeHtml(note.text)}</textarea>
              <div class="note-card-meta">
                <span>${formatDuration(note.timestamp)}</span>
                <div class="note-card-actions">
                  <button class="note-delete-link" onclick="deleteNote(${realIndex})" title="Delete note">Delete note</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (previousTops.size) {
        list.querySelectorAll('.note-card[data-note-key]:not(.note-card-entering)').forEach(card => {
          const previousTop = previousTops.get(card.dataset.noteKey);
          if (previousTop === undefined) return;
          const nextTop = card.getBoundingClientRect().top;
          const deltaY = previousTop - nextTop;
          if (Math.abs(deltaY) < 1) return;
          card.style.transition = 'none';
          card.style.transform = `translateY(${deltaY}px)`;
          requestAnimationFrame(() => {
            card.style.transition = 'transform 450ms cubic-bezier(0.4, 0.22, 0.28, 1)';
            card.style.transform = 'translateY(0)';
            window.setTimeout(() => {
              card.style.transition = '';
              card.style.transform = '';
            }, 470);
          });
        });
      }

      if (enteringNoteCreatedAt) {
        window.setTimeout(() => { enteringNoteCreatedAt = null; }, 470);
      }
    }
