<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Notes</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <script src="/client/quick.js"></script>
  <script>try{if(localStorage.getItem('sn-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
  <style>
    /* ════════════════════════════════════════════════════════════════
       Claude Theme — Academic Journal on Vellum
       Soft, tactile precision. Light editorial interface.
       ════════════════════════════════════════════════════════════════ */
    :root {
      --vellum-white: #faf9f5;
      --ink-black: #141413;
      --onyx: #1f1e1d;
      --graphite: #3d3d3a;
      --dusty-gray: #73726c;
      --stone: #9c9a92;
      --parchment: #dedcd1;
      --snow-white: #ffffff;
      --pale-azure: #ccdbe8;
      --terra-cotta: #4092E5;

      --bg: var(--vellum-white);
      --surface: var(--vellum-white);
      --surface-hover: #f2f0ea;
      --surface-raised: var(--snow-white);
      --border: var(--parchment);
      --border-soft: rgba(31, 30, 29, 0.10);
      --border-strong: rgba(31, 30, 29, 0.3);
      --text: var(--ink-black);
      --text-dim: var(--dusty-gray);
      --text-muted: var(--stone);
      --accent: var(--terra-cotta);
      --accent-soft: #f0d8cc;
      --red: var(--terra-cotta);
      --red-hover: #c56548;
      --green: #557f62;

      --font-serif: 'Lora', ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --radius: 9.6px;
      --radius-sm: 9.6px;
      --radius-lg: 16px;
      --radius-hero: 24px;
      --surface-sunken: #f4f2ec;
      --surface-hover-strong: #ebe8df;
      --bg-translucent: rgba(250, 249, 245, 0.92);
      --shadow-soft: 0 1px 0 rgba(20,20,19,0.04), 0 8px 24px rgba(20,20,19,0.045);
      --shadow-pop: 0 16px 40px rgba(20,20,19,0.10);
    }

    html.dark {
      color-scheme: dark;
      --vellum-white: #1b1a17;
      --ink-black: #f0efe9;
      --onyx: #dbd9d1;
      --graphite: #c6c4bb;
      --dusty-gray: #96948b;
      --stone: #75736b;
      --parchment: #3a3831;
      --snow-white: #242320;
      --pale-azure: #31445a;
      --surface-hover: #26251f;
      --surface-hover-strong: #302e27;
      --surface-sunken: #141310;
      --border-soft: rgba(240, 239, 233, 0.10);
      --border-strong: rgba(240, 239, 233, 0.30);
      --accent-soft: #33465c;
      --bg-translucent: rgba(27, 26, 23, 0.92);
      --shadow-soft: 0 1px 0 rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
      --shadow-pop: 0 16px 40px rgba(0,0,0,0.5);
    }
    html.dark .kbd-hint { color: rgba(20,20,19,0.65); }
    html.dark .selection-rect { border-color: rgba(240,239,233,0.55); }
    html.dark .note-delete-link { color: #e0655a; }
    html.dark .note-delete-link:hover { color: #f08a80; }
    html.dark .session-tabs::before {
      background: #403e36;
      border-color: rgba(240,239,233,0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--vellum-white);
      color: var(--ink-black);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ── Header ── */
    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--bg-translucent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--parchment);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-black);
      cursor: pointer;
      border-radius: 9.6px;
      padding: 4px 6px;
      margin-left: -6px;
      transition: background 160ms ease;
    }
    .logo:hover {
      background: var(--surface-hover);
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      color: var(--terra-cotta);
      flex-shrink: 0;
    }

    .icon {
      width: 16px;
      height: 16px;
      display: inline-block;
      vertical-align: -3px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-filled { fill: currentColor; stroke: none; }
    .icon-sm { width: 12px; height: 12px; vertical-align: -2px; }

    .header-actions { display: flex; align-items: center; gap: 12px; }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--graphite);
      font-size: 14px;
      font-weight: 400;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid var(--parchment);
    }

    /* ── Buttons ── */
    .btn {
      padding: 9px 20px;
      border-radius: 99px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--ink-black);
      color: var(--snow-white);
      border-color: var(--ink-black);
    }
    .btn-primary:hover { background: var(--onyx); }

    .btn-danger {
      background: transparent;
      color: var(--ink-black);
      border-color: var(--onyx);
    }
    .btn-danger:hover { background: var(--surface-hover-strong); }

    .btn-ghost {
      background: transparent;
      color: var(--ink-black);
      border-color: var(--border-strong);
    }
    .btn-ghost:hover { background: var(--surface-hover); }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-icon { font-size: 14px; line-height: 1; }
    .kbd-hint { color: rgba(255,255,255,0.7); font-size: 12px; }

    /* Keep every native button fully rounded, including icon-only controls. */
    button { border-radius: 99px !important; }

    /* ── Layout ── */
    .app-layout {
      display: flex;
      height: 100vh;
      background: var(--vellum-white);
    }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed;
      top: 12px;
      left: 12px;
      bottom: 12px;
      z-index: 200;
      width: 300px;
      min-width: 240px;
      max-width: 400px;
      background: var(--vellum-white);
      border: 1px solid var(--parchment);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-pop);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-resize {
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 5;
    }
    .sidebar-resize:hover,
    .sidebar-resize.dragging {
      background: var(--pale-azure);
    }

    .sidebar-header {
      padding: 14px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      background: transparent;
      padding: 0;
      color: var(--ink-black);
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 18px;
      line-height: 1.33;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }
    .sidebar-home-btn .logo-icon {
      width: 20px;
      height: 20px;
      color: var(--terra-cotta);
      flex: 0 0 auto;
    }

    .sidebar-new-btn {
      width: 36px;
      height: 36px;
      border-radius: 9.6px;
      border: none;
      background: transparent;
      color: var(--ink-black);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 160ms ease;
    }
    .sidebar-new-btn:hover {
      background: var(--surface-hover);
    }

    .session-tabs {
      position: relative;
      display: flex;
      gap: 0;
      margin: 8px 12px 16px;
      padding: 4px;
      background: var(--surface-hover);
      border: 1px solid var(--parchment);
      border-radius: 99px;
      overflow: hidden;
    }
    .session-tabs::before {
      content: '';
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc((100% - 12px) / 2);
      background: var(--snow-white);
      border: 1px solid rgba(31,30,29,0.12);
      border-radius: 99px;
      box-shadow: 0 1px 2px rgba(20,20,19,.04);
      transition: left 180ms ease;
      z-index: 0;
    }
    .session-tabs[data-active="others"]::before {
      left: calc(50% + 2px);
    }
    .session-tab {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 8px 12px;
      border-radius: 99px;
      border: none;
      background: transparent;
      color: var(--graphite);
      font-family: var(--font-sans);
      font-size: 14px;
      cursor: pointer;
      transition: color 180ms ease;
    }
    .session-tab.active {
      color: var(--ink-black);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 20px;
    }

    .session-empty-state {
      padding: 32px 12px;
      color: var(--dusty-gray);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    .session-item {
      position: relative;
      padding: 14px 12px;
      border-radius: 9.6px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
      transition: background 160ms ease, border-color 160ms ease;
    }
    .session-item:hover {
      background: var(--snow-white);
    }
    .session-item.active {
      background: var(--snow-white);
      border-color: transparent;
    }

    .session-item-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-black);
      margin-bottom: 6px;
      padding-right: 36px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-item-meta {
      font-size: 12px;
      color: var(--dusty-gray);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .session-meta-separator {
      color: var(--stone);
    }

    .session-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 160ms ease;
    }
    .session-item:hover .session-actions { opacity: 1; }
    .session-actions .btn { padding: 5px 10px; font-size: 12px; }

    .session-menu-btn {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--dusty-gray);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 140ms ease, background 140ms ease, color 140ms ease;
    }
    .session-item:hover .session-menu-btn,
    .session-menu-btn.open { opacity: 1; }
    .session-menu-btn:hover, .session-menu-btn.open {
      background: var(--surface-hover-strong);
      color: var(--ink-black);
    }
    .session-menu-btn .icon { width: 16px; height: 16px; }

    .session-menu-popover {
      position: fixed;
      z-index: 300;
      min-width: 160px;
      padding: 6px;
      background: var(--snow-white);
      border: 1px solid var(--parchment);
      border-radius: 12px;
      box-shadow: var(--shadow-pop);
    }
    .session-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-black);
      font-family: var(--font-sans);
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
    }
    .session-menu-item:hover { background: var(--surface-hover-strong); }
    .session-menu-item .icon { width: 15px; height: 15px; color: var(--dusty-gray); flex: 0 0 auto; }
    .session-menu-item.danger { color: #d0453c; }
    .session-menu-item.danger .icon { color: #d0453c; }
    html.dark .session-menu-item.danger { color: #e0655a; }
    html.dark .session-menu-item.danger .icon { color: #e0655a; }

    .session-title-input {
      width: 100%;
      padding: 2px 6px;
      margin: -3px 0 3px -7px;
      border: 1px solid var(--pale-azure);
      border-radius: 6px;
      background: var(--snow-white);
      color: var(--ink-black);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      outline: none;
    }

    /* ── Bottom toast ── */
    :root {
      --ease-out-spring: cubic-bezier(0.1, 1.25, 0, 1);
      --ease-out-spring-duration: 1000ms;
      --ease-out: cubic-bezier(0.2, 0.8, 0, 1);
      --ease-out-duration: 400ms;
    }
    .toast-center {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, calc(100% + 24px));
      z-index: 500;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--ink-black);
      color: var(--vellum-white);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-pop);
      pointer-events: none;
      transition: transform var(--ease-out-duration) var(--ease-out);
      white-space: nowrap;
    }
    .toast-center.visible {
      transform: translate(-50%, 0);
      transition: transform var(--ease-out-spring-duration) var(--ease-out-spring);
    }

    /* ── Main ── */
    .main-content {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--vellum-white);
    }

    /* ── Home grid backdrop ── */
    .grid-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--border-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
      background-size: 32px 32px;
      -webkit-mask-image: radial-gradient(375px circle at var(--mx, 50%) var(--my, 50%), rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
      mask-image: radial-gradient(375px circle at var(--mx, 50%) var(--my, 50%), rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
    }
    .empty-state { position: relative; z-index: 1; pointer-events: none; }
    .empty-state .btn { pointer-events: auto; }

    .home-hidden-note {
      position: absolute;
      width: 260px;
      margin: 0;
      box-shadow: var(--shadow-soft);
      pointer-events: auto;
      cursor: grab;
      user-select: none;
    }
    .home-hidden-note.dragging { cursor: grabbing; }
    .note-card.home-hidden-note { overflow: visible; }
    .home-hidden-note .note-card-screenshot-wrap {
      border-radius: 23px 23px 0 0;
      overflow: hidden;
    }
    .home-hidden-note .note-card-text {
      cursor: text;
      user-select: text;
      outline: none;
    }
    .note-card.home-hidden-note:hover {
      outline: 2px solid var(--terra-cotta);
      outline-offset: 0;
    }
    .home-note-resize {
      position: absolute;
      width: 14px;
      height: 14px;
      background: var(--terra-cotta);
      border: 2px solid var(--vellum-white);
      border-radius: 999px;
      bottom: -7px;
      right: -7px;
      cursor: nwse-resize;
      z-index: 10;
      opacity: 0;
      transition: opacity 140ms ease;
    }
    .home-hidden-note:hover .home-note-resize { opacity: 1; }
    .home-hidden-note .note-card-screenshot {
      aspect-ratio: 16/9;
      background:
        linear-gradient(135deg, var(--surface-hover) 0%, var(--surface-hover-strong) 100%);
      cursor: grab;
    }
    .home-hidden-note.dragging .note-card-screenshot { cursor: grabbing; }

    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--parchment);
      background: var(--snow-white);
      color: var(--graphite);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      box-shadow: var(--shadow-soft);
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }
    .theme-toggle:hover {
      background: var(--surface-hover);
      color: var(--ink-black);
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px;
      text-align: center;
      color: var(--graphite);
    }
    .empty-state::before { content: none; }
    .empty-state > * { max-width: 640px; }
    .empty-state > .use-cases { max-width: 810px; }

    .empty-state-icon {
      font-size: 40px;
      color: var(--terra-cotta);
      line-height: 1;
      margin-bottom: 4px;
    }
    .empty-state-icon .logo-icon,
    .empty-state-icon .icon {
      width: 48px;
      height: 48px;
    }

    .empty-state h2 {
      font-family: var(--font-serif);
      font-size: 56px;
      line-height: 1.2;
      font-weight: 400;
      color: var(--ink-black);
      letter-spacing: 0;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 16px;
      line-height: 1.5;
      color: var(--graphite);
      margin-bottom: 40px;
      white-space: nowrap;
    }

    .use-cases {
      margin-top: 248px;
      width: 100%;
      max-width: 810px;
      margin-left: auto;
      margin-right: auto;
    }
    .use-cases-label {
      font-family: var(--font-sans);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--dusty-gray);
      margin-bottom: 16px;
      text-align: left;
    }
    .use-cases-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    @media (max-width: 1100px) {
      .use-cases { max-width: 420px; }
      .empty-state > .use-cases { max-width: 420px; }
      .use-cases-grid { grid-template-columns: 1fr; }
    }
    .use-case-card {
      min-width: 0;
      background: var(--snow-white);
      border: 1px solid var(--parchment);
      border-radius: 12px;
      padding: 20px;
      text-align: left;
    }
    .use-case-card h4 {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 400;
      color: var(--ink-black);
      margin: 0 0 6px;
    }
    .use-case-card p {
      font-size: 13px;
      color: var(--graphite);
      margin: 0;
      line-height: 1.5;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    /* ── Recording ── */
    .recording-view,
    .review-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--vellum-white);
    }

    .recording-header,
    .review-header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--parchment);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--vellum-white);
      z-index: 10;
    }

    .recording-status,
    .review-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--terra-cotta);
      animation: pulse 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.38} }

    .rec-timer {
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-black);
    }
    .rec-status-label {
      font-size: 12px;
      color: var(--dusty-gray);
    }

    .recording-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .video-panel {
      flex: 1;
      min-width: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--surface-sunken);
      border-right: 1px solid var(--parchment);
    }

    video {
      max-width: 100%;
      max-height: 100%;
      border-radius: 24px;
      background: #000;
      object-fit: contain;
      border: 1px solid rgba(31,30,29,0.18);
      box-shadow: var(--shadow-soft);
    }

    canvas { display: none; }

    .video-overlay-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--snow-white);
      color: var(--graphite);
      padding: 8px 12px;
      border: 1px solid var(--parchment);
      border-radius: 999px;
      font-size: 13px;
      pointer-events: none;
      box-shadow: var(--shadow-soft);
    }

    .notes-panel {
      width: 390px;
      min-width: 390px;
      background: var(--vellum-white);
      display: flex;
      flex-direction: column;
    }

    .notes-panel-header {
      padding: 14px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .notes-panel-header h3 {
      font-family: var(--font-serif);
      font-size: 24px;
      line-height: 1.33;
      font-weight: 400;
      color: var(--ink-black);
    }
    .note-count-label {
      color: var(--dusty-gray);
      font-size: 13px;
    }

    .note-input-area { padding: 0 20px 20px; flex-shrink: 0; }
    .note-input-wrapper {
      position: relative;
      background: var(--snow-white);
      border: 1px solid var(--border-soft);
      border-radius: 24px;
      overflow: hidden;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .note-input-wrapper:focus-within {
      border-color: var(--pale-azure);
      box-shadow: 0 0 0 3px rgba(204, 219, 232, 0.5);
    }

    .note-input {
      display: block;
      width: 100%;
      min-height: 100px;
      max-height: 200px;
      background: transparent;
      border: 0;
      border-radius: 0;
      color: var(--ink-black);
      padding: 12px 14px 8px;
      font-size: 15px;
      line-height: 1.45;
      font-family: var(--font-sans);
      resize: none;
      overflow-x: hidden;
    }
    .note-input:focus { outline: none; }
    .note-input::placeholder { color: var(--stone); }

    .note-input-footer { padding: 0 14px 14px; }
    .note-input-button-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .save-note-inline {
      flex: 1 1 auto;
      width: auto;
      height: 40px;
      min-height: 40px;
      border-radius: 99px;
    }

    .voice-input-toggle {
      position: relative;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--surface-hover);
      color: var(--graphite);
      cursor: pointer;
      transition: color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .voice-input-toggle:hover { background: var(--surface-hover-strong); }
    .voice-input-toggle:active { transform: translateY(0) scale(0.94); }
    .voice-input-toggle:focus-visible {
      outline: 2px solid var(--pale-azure);
      outline-offset: 2px;
    }
    .voice-input-toggle.listening {
      color: var(--terra-cotta);
      background: rgba(64, 146, 229, 0.10);
    }
    .voice-input-toggle.listening .icon { animation: pulse 1.6s ease-in-out infinite; }

    .voice-dictation-marker {
      position: absolute;
      z-index: 2;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--terra-cotta);
      color: var(--snow-white);
      box-shadow: 0 2px 8px rgba(64, 146, 229, 0.32);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-1px) scale(0.88);
      transition: opacity 120ms ease, transform 120ms ease, left 140ms ease-out, top 140ms ease-out;
    }
    .voice-dictation-marker::after {
      content: '';
      position: absolute;
      left: 50%;
      top: calc(100% + 3px);
      width: 3px;
      height: var(--voice-caret-height, 22px);
      border-radius: 999px;
      background: var(--terra-cotta);
      transform: translateX(-50%);
    }
    .voice-dictation-marker.visible {
      opacity: 1;
      transform: translateY(-1px) scale(1);
    }
    .voice-dictation-marker.visible .icon { animation: pulse 1.6s ease-in-out infinite; }
    .voice-dictation-marker .icon { width: 14px; height: 14px; }

    .screenshot-indicator {
      color: var(--graphite);
      font-size: 13px;
      opacity: 0;
      transition: opacity 160ms ease;
      display: none;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .screenshot-indicator > span:not(.screenshot-indicator-actions) {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .screenshot-indicator.visible { opacity: 1; display: inline-flex; }
    .screenshot-indicator-actions { display: inline-flex; gap: 2px; margin-left: 2px; }
    .screenshot-indicator-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      color: var(--graphite);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .screenshot-indicator-btn:hover { background: rgba(0,0,0,0.06); color: var(--ink-black); }

    .screenshot-preview {
      position: relative;
      margin: 0;
      border-radius: 0;
      overflow: hidden;
      background: var(--surface-sunken);
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      display: block;
      height: 220px;
    }
    .screenshot-preview.has-image { border-bottom-style: solid; }
    .screenshot-preview img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transform-origin: center center;
    }
    .screenshot-preview.has-image img { display: block; cursor: zoom-in; }
    .screenshot-preview.capturing-image img {
      animation: screenshotCaptureIn 300ms cubic-bezier(0.2, 0.8, 0.3, 1.15);
    }
    .screenshot-preview.saving-out {
      border-style: dashed;
    }
    .screenshot-preview.saving-out .screenshot-preview-empty {
      display: flex;
    }
    .screenshot-preview.saving-out img {
      display: block;
      position: absolute;
      inset: 0;
      z-index: 2;
      animation: screenshotSaveOut 250ms cubic-bezier(0.17, 0.84, 0.44, 1) forwards;
    }
    .screenshot-preview.saving-out .screenshot-preview-actions,
    .screenshot-preview.saving-out .screenshot-preview-timestamp {
      display: none;
    }
    @keyframes screenshotCaptureIn {
      from { transform: scale(0.86); }
      to { transform: scale(1); }
    }
    @keyframes screenshotSaveOut {
      from { transform: translateY(0); }
      to { transform: translateY(110%); }
    }
    .screenshot-preview-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 100%;
      color: var(--stone);
      font-size: 13px;
      text-align: center;
      padding: 16px;
    }
    .screenshot-preview.has-image .screenshot-preview-empty { display: none; }
    .screenshot-preview.has-image.saving-out .screenshot-preview-empty { display: flex; }
    .screenshot-preview-empty .icon { width: 22px; height: 22px; opacity: 0.7; }
    .screenshot-preview-empty-copy { display: flex; flex-direction: column; gap: 2px; }
    .screenshot-empty-action { padding: 7px 12px; font-size: 13px; }
    .voice-listening-hint {
      position: relative;
      width: 100%;
      height: 30px;
      max-height: 30px;
      display: flex;
      align-items: center;
      color: var(--stone);
      font-size: 12px;
      line-height: 1;
      white-space: pre;
      opacity: 0;
      overflow: hidden;
      margin-bottom: 8px;
      pointer-events: none;
      transform: translateY(1px);
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .voice-listening-hint.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .voice-listening-label { display: inline-flex; white-space: pre; }
    .voice-hint-character {
      display: inline-block;
      opacity: 1;
      filter: blur(0);
    }
    .voice-hint-character.entering {
      animation: voiceHintCharacterIn 180ms ease-out both;
    }
    .voice-hint-character.exiting {
      animation: voiceHintCharacterOut 140ms ease-in both;
    }
    @keyframes voiceHintCharacterIn {
      from { opacity: 0; filter: blur(3px); transform: translateY(1px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes voiceHintCharacterOut {
      from { opacity: 1; filter: blur(0); transform: translateY(0); }
      to { opacity: 0; filter: blur(3px); transform: translateY(-1px); }
    }
    .screenshot-preview.has-image .screenshot-preview-actions { display: flex; }
    .screenshot-preview .screenshot-preview-actions { display: none; }
    .screenshot-preview-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
    }
    .screenshot-preview-btn {
      background: var(--snow-white);
      border: 1px solid rgba(0, 0, 0, 0.08);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      color: var(--ink-black);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      transition: background 120ms ease;
    }
    .screenshot-preview-btn:hover { background: var(--snow-white); }
    .screenshot-preview-timestamp {
      position: absolute;
      left: 8px;
      bottom: 8px;
      display: none;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: var(--ink-black);
      font-size: 12px;
      line-height: 1;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      pointer-events: none;
    }
    .screenshot-preview.has-image .screenshot-preview-timestamp { display: inline-flex; }
    .screenshot-preview.has-image.saving-out .screenshot-preview-actions,
    .screenshot-preview.has-image.saving-out .screenshot-preview-timestamp { display: none; }

    .notes-panel-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .notes-list {
      padding: 0 20px 20px;
    }

    .note-card {
      background: var(--snow-white);
      border: 1px solid var(--parchment);
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .note-card.note-card-entering {
      animation: noteCardEnter 450ms cubic-bezier(0.4, 0.22, 0.28, 1);
    }
    @keyframes noteCardEnter {
      from {
        opacity: 0;
        transform: translateY(-36px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .note-card-screenshot-wrap {
      position: relative;
      border-bottom: 1px solid var(--border-soft);
    }
    .note-card-screenshot {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
      background: var(--surface-hover);
    }
    .note-card-screenshot-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      filter: blur(4px);
      transform: translateY(1px);
      pointer-events: none;
      transition: opacity 180ms ease, filter 180ms ease, transform 180ms ease;
    }
    .note-card:hover .note-card-screenshot-actions,
    .note-card:focus-within .note-card-screenshot-actions {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
      pointer-events: auto;
    }
    .note-card-body { padding: 14px; }
    .note-card-text,
    .recording-note-edit {
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink-black);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .recording-note-edit {
      width: calc(100% + 12px);
      min-height: 24px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 4px 6px;
      margin: -4px -6px 0;
      resize: none;
      overflow: hidden;
      font-family: var(--font-sans);
      transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }
    .recording-note-edit:hover:not(:focus) { background: var(--surface-hover); }
    .recording-note-edit:focus {
      outline: none;
      background: var(--snow-white);
      border-color: var(--pale-azure);
      box-shadow: 0 0 0 3px rgba(204,219,232,.5);
    }
    .note-card-meta {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--dusty-gray);
    }
    .note-card-actions { display: flex; gap: 4px; }
    .note-delete-link {
      background: transparent;
      border: none;
      color: #b42318;
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      font-family: var(--font-sans);
      text-decoration: none;
      opacity: 0;
      filter: blur(4px);
      transform: translateY(1px);
      pointer-events: none;
      transition: opacity 180ms ease, filter 180ms ease, transform 180ms ease, color 120ms ease;
    }
    .note-card:hover .note-delete-link,
    .note-card:focus-within .note-delete-link {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
      pointer-events: auto;
    }
    .note-delete-link:hover { text-decoration: underline; color: #8f1d14; }

    .loading-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--graphite);
      background: var(--vellum-white);
      text-align: center;
    }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 2px solid var(--parchment);
      border-top-color: var(--terra-cotta);
      animation: spin 900ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Review header ── */
    .review-title-input {
      font-family: var(--font-serif);
      font-size: 18px;
      line-height: 1.33;
      font-weight: 400;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9.6px;
      color: var(--ink-black);
      padding: 4px 8px;
      outline: none;
      width: 340px;
    }
    .review-title-input:hover { background: var(--surface-hover); }
    .review-title-input:focus {
      background: var(--snow-white);
      border-color: var(--pale-azure);
      box-shadow: 0 0 0 3px rgba(204,219,232,.5);
    }
    .review-header-right {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .review-meta {
      font-size: 13px;
      color: var(--dusty-gray);
    }

    .review-delete-btn,
    .review-share-btn {
      padding: 7px 12px;
      font-size: 13px;
    }
    .review-share-btn.copied {
      background: var(--ink-black);
      border-color: var(--ink-black);
      color: var(--snow-white);
    }

    .presence-avatars {
      display: flex;
      align-items: center;
      flex-direction: row-reverse;
    }
    .presence-avatar {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 2px solid var(--vellum-white);
      margin-left: -8px;
      background: var(--parchment);
      object-fit: cover;
      position: relative;
    }
    .presence-avatar:last-child {
      margin-left: 0;
    }
    .presence-avatar-placeholder {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 2px solid var(--vellum-white);
      margin-left: -8px;
      background: var(--parchment);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--font-sans);
      color: var(--graphite);
      position: relative;
    }
    .presence-avatar-placeholder:last-child {
      margin-left: 0;
    }

    /* ── Canvas ── */
    .canvas-viewport {
      --grid-size: 32px;
      --grid-dot: 1.25px;
      --grid-x: 0px;
      --grid-y: 0px;
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: var(--surface-sunken);
      background-image: none;
      background-size: auto;
      background-position: var(--grid-x) var(--grid-y);
      cursor: default;
      user-select: none;
    }
    .canvas-viewport.panning { cursor: default; }

    .canvas-world {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      will-change: transform;
      z-index: 1;
    }

    .canvas-item { position: absolute; cursor: pointer; box-sizing: border-box; }
    .canvas-item.selected {
      outline: 2px solid var(--terra-cotta);
      outline-offset: 0;
      border-radius: 9.6px;
    }

    .ci-screenshot {
      background: var(--vellum-white);
      border: 1px solid var(--parchment);
      border-radius: 9.6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      width: min-content;
      box-shadow: var(--shadow-soft);
    }
    .ci-screenshot .ci-screenshot-img-wrap {
      background: var(--surface-hover-strong);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ci-screenshot .ci-screenshot-img-wrap img {
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .ci-note {
      width: 100%;
      padding: 14px;
      border-top: 1px solid var(--parchment);
      background: var(--vellum-white);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ci-note-text {
      font-size: 15px;
      line-height: 1.45;
      color: var(--ink-black);
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 4px 6px;
      margin: -4px -6px;
      cursor: text;
      min-height: 22px;
    }
    .ci-note-text:hover { border-color: var(--parchment); }
    .ci-note-text[contenteditable="true"] {
      background: var(--snow-white);
      border-color: var(--pale-azure);
      outline: none;
      box-shadow: 0 0 0 3px rgba(204,219,232,.5);
    }
    .ci-note-text:empty::before {
      content: 'Add note';
      color: var(--stone);
      font-style: normal;
      pointer-events: none;
    }
    .ci-note-time {
      width: fit-content;
      font-size: 12px;
      color: var(--dusty-gray);
      background: var(--surface-hover);
      border: 1px solid var(--parchment);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .ci-text .ci-note-time { margin-top: 10px; }
    .ci-text-note {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }
    .ci-text-note .ci-note-time { margin-top: 0; }

    .ci-text {
      padding: 10px 12px;
      color: var(--ink-black);
      background: var(--vellum-white);
      border: 1px solid var(--parchment);
      border-radius: 9.6px;
      font-size: 16px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      min-width: 120px;
      min-height: 36px;
      box-shadow: var(--shadow-soft);
    }
    .ci-text[contenteditable="true"] {
      cursor: text;
      background: var(--snow-white);
      border-color: var(--pale-azure);
      outline: none;
      box-shadow: 0 0 0 3px rgba(204,219,232,.5);
    }

    .ci-image {
      border-radius: 9.6px;
      overflow: hidden;
      border: 1px solid var(--parchment);
      background: var(--snow-white);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
    }
    .ci-image-img-wrap {
      width: 100%;
      background: var(--snow-white);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ci-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* Let selected resize handles render outside the card instead of being clipped. */
    .ci-screenshot.selected,
    .ci-image.selected {
      overflow: visible;
    }

    .resize-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      background: var(--ink-black);
      border: 2px solid var(--vellum-white);
      border-radius: 999px;
      bottom: -7px;
      right: -7px;
      cursor: nwse-resize;
      z-index: 10;
    }

    .group-selection-box {
      position: absolute;
      display: none;
      pointer-events: none;
      border: 2px solid var(--terra-cotta);
      border-radius: 9.6px;
      z-index: 9;
      box-sizing: border-box;
    }
    .group-selection-box .resize-handle {
      pointer-events: auto;
      background: var(--terra-cotta);
      border-color: var(--vellum-white);
    }

    .canvas-toolbar {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--vellum-white);
      border: 1px solid var(--parchment);
      border-radius: 16px;
      padding: 6px;
      display: flex;
      gap: 4px;
      z-index: 20;
      box-shadow: var(--shadow-pop);
    }
    .tb-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--graphite);
      padding: 8px 12px;
      border-radius: 9.6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 160ms ease, border-color 160ms ease;
      font-family: var(--font-sans);
    }
    .tb-btn:hover {
      background: var(--snow-white);
      color: var(--ink-black);
    }
    .tb-icon { color: var(--terra-cotta); }
    .tb-divider { width: 1px; background: var(--parchment); margin: 6px 4px; }

    .zoom-indicator,
    .canvas-help {
      position: absolute;
      background: var(--bg-translucent);
      border: 1px solid var(--parchment);
      border-radius: 9.6px;
      color: var(--graphite);
      z-index: 20;
      box-shadow: var(--shadow-soft);
      pointer-events: none;
    }
    .zoom-indicator {
      top: 16px;
      right: 16px;
      padding: 6px 10px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .canvas-help {
      right: 24px;
      bottom: 84px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.8;
      max-width: 300px;
      display: none;
      pointer-events: auto;
    }
    .canvas-help.visible { display: block; }
    .canvas-help kbd {
      background: var(--snow-white);
      border: 1px solid var(--parchment);
      border-radius: 5px;
      padding: 1px 5px;
      color: var(--ink-black);
      font-size: 11px;
      font-family: var(--font-sans);
    }

    .help-fab {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--parchment);
      background: var(--vellum-white);
      color: var(--graphite);
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 21;
      cursor: pointer;
      box-shadow: var(--shadow-pop);
      font-family: var(--font-serif);
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }
    .help-fab:hover {
      background: var(--snow-white);
      border-color: var(--border-soft);
      color: var(--ink-black);
    }

    .alignment-guide {
      position: absolute;
      pointer-events: none;
      z-index: 18;
      display: none;
      background: rgba(217, 119, 87, 0.72);
      box-shadow: 0 0 0 1px rgba(250, 249, 245, 0.75);
    }
    .alignment-guide.vertical {
      top: 0;
      bottom: 0;
      width: 1px;
    }
    .alignment-guide.horizontal {
      left: 0;
      right: 0;
      height: 1px;
    }

    .selection-rect {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 19;
      border: 1px solid rgba(31, 30, 29, 0.55);
      background: rgba(204, 219, 232, 0.28);
      border-radius: 4px;
    }

    .canvas-viewport.space-down,
    .canvas-viewport.space-down * {
      cursor: grab !important;
    }
    .canvas-viewport.space-down.panning,
    .canvas-viewport.space-down.panning * {
      cursor: grabbing !important;
    }

    .canvas-drop-overlay {
      position: absolute;
      inset: 16px;
      background: var(--bg-translucent);
      border: 1.5px dashed var(--onyx);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--ink-black);
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 160ms ease;
    }
    .canvas-drop-overlay.visible { opacity: 1; }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(20,20,19,.78);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
      opacity: 0;
      transition: opacity 160ms ease;
    }
    .lightbox.show { opacity: 1; }
    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 16px;
      object-fit: contain;
      background: var(--vellum-white);
      box-shadow: var(--shadow-pop);
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--parchment);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--stone); }

    /* ── Remote cursors ── */
    .remote-cursor {
      position: absolute;
      pointer-events: none;
      z-index: 50;
      transition: left 80ms linear, top 80ms linear;
    }
    .remote-cursor-pointer {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid var(--cursor-color, #4BDBBE);
      transform: rotate(-30deg);
      transform-origin: top left;
    }
    .remote-cursor-label {
      margin-top: 2px;
      margin-left: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--cursor-color, #4BDBBE);
      color: #fff;
      font-size: 11px;
      font-family: var(--font-sans);
      white-space: nowrap;
      line-height: 1.4;
    }

    .app-layout.recording-active .sidebar {
      display: none;
    }

    :root { --sidebar-w: 300px; }
    .app-layout.session-active .review-header {
      padding-left: calc(var(--sidebar-w) + 12px + 24px);
    }

    @media (max-width: 900px) {
      .app-layout.session-active .sidebar {
        display: none;
      }
      .app-layout.session-active .review-header {
        padding-left: 24px;
      }
      .notes-panel { width: 320px; min-width: 320px; }
      .empty-state h2 { font-size: 40px; }
    }
  </style>
</head>
<body>

  <div class="app-layout" id="appLayout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-home-btn" onclick="goHome()" title="Home">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 4H6.4C5.1 4 4 5.1 4 6.4V8"/>
            <path d="M16 4h1.6C18.9 4 20 5.1 20 6.4V8"/>
            <path d="M20 16v1.6c0 1.3-1.1 2.4-2.4 2.4H16"/>
            <path d="M8 20H6.4C5.1 20 4 18.9 4 17.6V16"/>
            <path d="M8.2 16.1l.7-2.6 5.3-5.3 2 2-5.3 5.3-2.7.6Z"/>
            <path d="M13.1 9.3l2 2"/>
          </svg>
          <span>Screen Notes</span>
        </button>
        <button class="sidebar-new-btn" id="newSessionBtn" title="New session">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14"/><path d="M5 12h14"/>
          </svg>
        </button>
      </div>
      <div class="session-tabs" id="sessionTabs" data-active="yours">
        <button class="session-tab active" id="sessionsTabYours" onclick="setSessionListTab('yours')">Yours</button>
        <button class="session-tab" id="sessionsTabOthers" onclick="setSessionListTab('others')">Others</button>
      </div>
      <div class="session-list" id="sessionList"></div>
      <div class="sidebar-resize" id="sidebarResize"></div>
    </div>

    <!-- Main content -->
    <div class="main-content" id="mainContent">
      <!-- Default: empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 4H6.4C5.1 4 4 5.1 4 6.4V8"/>
            <path d="M16 4h1.6C18.9 4 20 5.1 20 6.4V8"/>
            <path d="M20 16v1.6c0 1.3-1.1 2.4-2.4 2.4H16"/>
            <path d="M8 20H6.4C5.1 20 4 18.9 4 17.6V16"/>
            <path d="M8.2 16.1l.7-2.6 5.3-5.3 2 2-5.3 5.3-2.7.6Z"/>
            <path d="M13.1 9.3l2 2"/>
          </svg>
        </div>
        <h2>Screen Notes</h2>
        <p>Automate screenshots with every<br>text or voice note</p>
        <button class="btn btn-primary" id="emptyStartBtn">
          New session
        </button>
      </div>
    </div>
  </div>

  <!-- Hidden canvas for screenshots -->
  <canvas id="screenshotCanvas"></canvas>

  <script>
    // ── Icons ──
    function icon(name, className = 'icon') {
      const icons = {
        camera: '<path d="M8 4H6.4C5.1 4 4 5.1 4 6.4V8"/><path d="M16 4h1.6C18.9 4 20 5.1 20 6.4V8"/><path d="M20 16v1.6c0 1.3-1.1 2.4-2.4 2.4H16"/><path d="M8 20H6.4C5.1 20 4 18.9 4 17.6V16"/><path d="M8.2 16.1l.7-2.6 5.3-5.3 2 2-5.3 5.3-2.7.6Z"/><path d="M13.1 9.3l2 2"/>',
        record: '<circle cx="12" cy="12" r="5" class="icon-filled"/>',
        stop: '<rect x="7" y="7" width="10" height="10" rx="1.5" class="icon-filled"/>',
        trash: '<path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 14h10l1-14"/><path d="M9 7V4h6v3"/>',
        image: '<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M7 17l4-4 3 3 2-2 3 3"/>',
        text: '<path d="M5 6h14"/><path d="M12 6v12"/><path d="M9 18h6"/>',
        arrange: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',
        fit: '<path d="M8 4H4v4"/><path d="M16 4h4v4"/><path d="M8 20H4v-4"/><path d="M16 20h4v-4"/>',
        pin: '<path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11z"/><circle cx="12" cy="10" r="2"/>',
        check: '<path d="M5 12.5l4 4L19 6"/>',
        warning: '<path d="M12 4l9 16H3L12 4z"/><path d="M12 9v5"/><path d="M12 17h.01"/>',
        refresh: '<path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/>',
        close: '<path d="M6 6l12 12"/><path d="M18 6L6 18"/>',
        mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/><path d="M9 21h6"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/>',
        moon: '<path d="M20 13.2A8 8 0 0 1 10.8 4 8 8 0 1 0 20 13.2z"/>',
        more: '<circle cx="5" cy="12" r="1.7" class="icon-filled"/><circle cx="12" cy="12" r="1.7" class="icon-filled"/><circle cx="19" cy="12" r="1.7" class="icon-filled"/>',
        link: '<path d="M10 14a4.5 4.5 0 0 0 6.4.4l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.6 1.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4-.4l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.6-1.6"/>',
        pencil: '<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/>',
      };
      return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || ''}</svg>`;
    }

    // ── State ──
    let currentUser = null;
    let allSessions = [];
    let sessions = [];
    let sharedSessions = [];
    let sessionListTab = 'yours';
    let activeSessionId = null;
    let mediaStream = null;
    let mediaRecorder = null;
    let recordingStartTime = null;
    let timerInterval = null;
    let currentNotes = [];
    let screenshotCaptured = null; // data URL of screenshot taken on focus
    let isRecording = false;
    let speechRecognition = null;
    let voiceCommandsShouldListen = false;
    let voiceCommandsListening = false;
    let voiceCommandsVisualActive = false;
    let voiceCommandsStarting = false;
    const VOICE_COMMANDS_PREFERENCE_KEY = 'screenNotesVoiceCommandsEnabled';
    let voiceCommandsEnabledPreference = (() => {
      try { return localStorage.getItem(VOICE_COMMANDS_PREFERENCE_KEY) === 'true'; }
      catch (_) { return false; }
    })();
    let voiceRecognitionRestartTimer = null;
    let voiceScreenshotInFlight = false;
    let lastVoiceScreenshotAt = 0;
    let voiceNoteDictationActive = false;
    let voiceCaptureOnFirstDictationText = false;
    let voiceInterimStart = null;
    let voiceInterimText = '';
    const voiceCommandResultIndexes = new Set();
    const voiceSaveResultIndexes = new Set();
    const voiceRemoveScreenshotResultIndexes = new Set();
    let voiceSaveNoteInFlight = false;
    let suppressNextNoteFocusCapture = false;
    const VOICE_LISTENING_HINTS = ['screenshot', 'remove screenshot', 'delete screenshot', 'save note'];
    let voiceHintAnimationRun = 0;
    let voiceHintAnimationElement = null;

    // ── Init ──
    function blurActiveFieldIfClickedOutside(event) {
      const active = document.activeElement;
      if (!active || active === document.body) return;

      const isTextInput = active.matches?.('input, textarea, [contenteditable="true"]');
      if (!isTextInput) return;
      if (active === event.target || active.contains(event.target)) return;

      active.blur();
      if (active.isContentEditable) {
        window.getSelection()?.removeAllRanges();
      }
    }

    document.addEventListener('mousedown', blurActiveFieldIfClickedOutside, true);

    async function init() {
      try {
        currentUser = await quick.id.waitForUser();
        renderUserInfo();
      } catch(e) {
        console.log('Could not get user info');
      }
      initSidebarResize();
      document.addEventListener('mousedown', (e) => {
        const card = e.target.closest('.home-hidden-note');
        if (!card) return;
        if (e.target.closest('.note-card-text')) return; // allow text editing
        e.preventDefault();
        const sx = e.clientX, sy = e.clientY;

        if (e.target.classList.contains('home-note-resize')) {
          const startW = card.offsetWidth;
          const onMove = (ev) => {
            const w = Math.min(480, Math.max(160, startW + (ev.clientX - sx)));
            card.style.width = `${w}px`;
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
          return;
        }

        card.classList.add('dragging');
        const ox = card.offsetLeft, oy = card.offsetTop;
        card.style.left = `${ox}px`;
        card.style.top = `${oy}px`;
        card.style.right = 'auto';
        card.style.bottom = 'auto';
        const onMove = (ev) => {
          card.style.left = `${ox + ev.clientX - sx}px`;
          card.style.top = `${oy + ev.clientY - sy}px`;
        };
        const onUp = () => {
          card.classList.remove('dragging');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
      document.addEventListener('mousemove', (e) => {
        const g = document.getElementById('gridBg');
        if (!g) return;
        const r = g.getBoundingClientRect();
        g.style.setProperty('--mx', `${e.clientX - r.left}px`);
        g.style.setProperty('--my', `${e.clientY - r.top}px`);
      });
      await loadSessions();

      const sessionId = getSessionIdFromUrl();
      if (sessionId && allSessions.some(s => s.id === sessionId)) {
        rememberSharedSessionIfNeeded(sessionId);
        await loadSessions();
        viewSession(sessionId, { updateUrl: false });
      } else {
        render();
      }
    }

    window.addEventListener('hashchange', async () => {
      const sessionId = getSessionIdFromUrl();
      if (sessionId && allSessions.some(s => s.id === sessionId)) {
        rememberSharedSessionIfNeeded(sessionId);
        await loadSessions();
        viewSession(sessionId, { updateUrl: false });
      } else if (!sessionId) {
        activeSessionId = null;
        currentNotes = [];
        render();
      }
    });

    function renderUserInfo() {
      const el = document.getElementById('userInfo');
      if (!currentUser) return;
      el.innerHTML = `
        ${currentUser.slackImageUrl ? `<img class="user-avatar" src="${currentUser.slackImageUrl}" alt="">` : ''}
        <span>${currentUser.fullName || currentUser.email}</span>
      `;
    }

    function getSessionIdFromUrl() {
      const hash = window.location.hash || '';
      const match = hash.match(/^#session=(.+)$/);
      return match ? decodeURIComponent(match[1]) : null;
    }

    function setSessionUrl(id) {
      const next = id ? `#session=${encodeURIComponent(id)}` : window.location.pathname;
      if (id) history.pushState(null, '', next);
      else history.pushState(null, '', window.location.pathname + window.location.search);
    }

    // ── Presence (remote cursors) ──
    const CURSOR_COLORS = ['#4BDBBE','#F59E0B','#8B5CF6','#EC4899','#06B6D4','#10B981','#F43F5E','#6366F1'];
    let presenceRoom = null;

    function getCursorColor(socketId) {
      let hash = 0;
      for (let i = 0; i < socketId.length; i++) hash = ((hash << 5) - hash + socketId.charCodeAt(i)) | 0;
      return CURSOR_COLORS[Math.abs(hash) % CURSOR_COLORS.length];
    }

    async function joinPresenceRoom(sessionId) {
      await leavePresenceRoom();
      presenceRoom = quick.socket.room(`session-${sessionId}`);

      presenceRoom.on('user:state', () => { renderRemoteCursors(); renderPresenceAvatars(); });
      presenceRoom.on('user:join', () => { renderRemoteCursors(); renderPresenceAvatars(); });
      presenceRoom.on('user:leave', () => { renderRemoteCursors(); renderPresenceAvatars(); });

      await presenceRoom.join();
      renderPresenceAvatars();
    }

    async function leavePresenceRoom() {
      if (presenceRoom) {
        await presenceRoom.leave();
        presenceRoom = null;
      }
      const container = document.getElementById('remoteCursors');
      if (container) container.innerHTML = '';
      const avatars = document.getElementById('presenceAvatars');
      if (avatars) avatars.innerHTML = '';
    }

    function renderPresenceAvatars() {
      const container = document.getElementById('presenceAvatars');
      if (!container || !presenceRoom) return;

      let html = '';
      // Include current user
      if (currentUser) {
        if (currentUser.slackImageUrl) {
          html += `<img class="presence-avatar" src="${currentUser.slackImageUrl}" title="${currentUser.fullName || currentUser.email}">`;
        } else {
          const initials = (currentUser.fullName || currentUser.email || '?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
          html += `<div class="presence-avatar-placeholder" title="${currentUser.fullName || currentUser.email}">${initials}</div>`;
        }
      }

      // Remote users
      presenceRoom.users.forEach((user, socketId) => {
        if (socketId === presenceRoom.user?.socketId) return;
        const name = user.name || user.email || 'Anon';
        if (user.slackImageUrl) {
          html += `<img class="presence-avatar" src="${user.slackImageUrl}" title="${name}">`;
        } else {
          const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
          html += `<div class="presence-avatar-placeholder" title="${name}">${initials}</div>`;
        }
      });

      container.innerHTML = html;
    }

    function broadcastCursorPosition(e) {
      if (!presenceRoom || !activeSessionId) return;
      const viewport = document.getElementById('canvasViewport');
      if (!viewport) return;
      const rect = viewport.getBoundingClientRect();
      // Convert screen position to world coordinates
      const worldX = (e.clientX - rect.left - canvas.x) / canvas.scale;
      const worldY = (e.clientY - rect.top - canvas.y) / canvas.scale;
      presenceRoom.updateUserState({ cursorX: worldX, cursorY: worldY });
    }

    function renderRemoteCursors() {
      const container = document.getElementById('remoteCursors');
      if (!container || !presenceRoom) return;

      let html = '';
      presenceRoom.users.forEach((user, socketId) => {
        if (socketId === presenceRoom.user?.socketId) return;
        const state = user.state;
        if (state?.cursorX == null || state?.cursorY == null) return;
        const color = getCursorColor(socketId);
        const name = user.name?.split(' ')[0] || user.email?.split('@')[0] || 'Anon';
        // Convert world coords to viewport pixel position
        const px = canvas.x + state.cursorX * canvas.scale;
        const py = canvas.y + state.cursorY * canvas.scale;
        html += `<div class="remote-cursor" style="left:${px}px;top:${py}px;--cursor-color:${color}">
          <div class="remote-cursor-pointer"></div>
          <div class="remote-cursor-label">${name}</div>
        </div>`;
      });
      container.innerHTML = html;
    }

    async function goHome() {
      if (isRecording) {
        if (!confirm('Stop current recording and return home?')) return;
        await stopRecording();
      }
      activeSessionId = null;
      currentNotes = [];
      setSelectedItems?.([]);
      setSessionUrl(null);
      await leavePresenceRoom();
      render();
    }

    // ── DB ──
    const sessionsDb = quick.db.collection('sessions');

    function currentUserEmail() {
      return (currentUser?.email || '').toLowerCase();
    }

    function sessionOwnerEmail(session) {
      return (session?.ownerEmail || session?.userEmail || session?.createdByEmail || '').toLowerCase();
    }

    function isMySession(session) {
      const owner = sessionOwnerEmail(session);
      // Legacy sessions did not have ownerEmail. Keep them visible for the
      // creator's existing data rather than orphaning old work.
      if (!owner) return true;
      return owner === currentUserEmail();
    }

    function sharedSessionIds() {
      try { return JSON.parse(localStorage.getItem('screenNotesSharedSessionIds') || '[]'); }
      catch(_) { return []; }
    }

    function setSharedSessionIds(ids) {
      localStorage.setItem('screenNotesSharedSessionIds', JSON.stringify([...new Set(ids)]));
    }

    function rememberSharedSessionIfNeeded(id) {
      const session = allSessions.find(s => s.id === id);
      if (!session || isMySession(session)) return;
      setSharedSessionIds([id, ...sharedSessionIds()]);
    }

    async function loadSessions() {
      try {
        const result = await sessionsDb.find();
        allSessions = (result || []).sort((a, b) =>
          new Date(b.created_at) - new Date(a.created_at)
        );
        const sharedIds = new Set(sharedSessionIds());
        sessions = allSessions.filter(isMySession);
        sharedSessions = allSessions.filter(s => sharedIds.has(s.id) && !isMySession(s));
      } catch(e) {
        allSessions = [];
        sessions = [];
        sharedSessions = [];
      }
    }

    // Strip any inline base64 data URLs from a session before persisting.
    // Old sessions may have these stored under note.screenshot — we drop them
    // (the screenshotUrl is what we actually rely on).
    function sanitizeForPersist(session) {
      const clone = JSON.parse(JSON.stringify(session));
      if (Array.isArray(clone.notes)) {
        clone.notes.forEach(n => {
          if (typeof n.screenshot === 'string' && n.screenshot.startsWith('data:')) {
            delete n.screenshot;
          }
          // If screenshotUrl is somehow a data URL (legacy), drop it too
          if (typeof n.screenshotUrl === 'string' && n.screenshotUrl.startsWith('data:')) {
            delete n.screenshotUrl;
          }
        });
      }
      if (clone.canvas && Array.isArray(clone.canvas.items)) {
        clone.canvas.items.forEach(it => {
          if (it.type === 'image' && typeof it.url === 'string' && it.url.startsWith('data:')) {
            // Keep only items whose images we actually managed to upload
            it.url = null;
          }
        });
        clone.canvas.items = clone.canvas.items.filter(it => it.type !== 'image' || it.url);
      }
      return clone;
    }

    async function saveSession(session) {
      try {
        const payload = sanitizeForPersist(session);
        if (session.id) {
          await sessionsDb.update(session.id, payload);
        } else {
          const saved = await sessionsDb.create(payload);
          session.id = saved.id;
        }
        await loadSessions();
        renderSidebar();
      } catch(e) {
        console.error('Failed to save session:', e);
      }
    }

    async function shareSession(id) {
      const url = `${window.location.origin}${window.location.pathname}#session=${encodeURIComponent(id)}`;
      try {
        await navigator.clipboard.writeText(url);
      } catch (_) {
        const input = document.createElement('input');
        input.value = url;
        input.style.position = 'fixed';
        input.style.left = '-9999px';
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        input.remove();
      }
      const button = document.getElementById('shareSessionBtn');
      if (button) {
        button.textContent = 'Link copied';
        button.classList.add('copied');
        clearTimeout(button._resetTimer);
        button._resetTimer = setTimeout(() => {
          button.textContent = 'Share';
          button.classList.remove('copied');
        }, 1600);
      }
    }

    async function deleteSession(id) {
      if (!confirm('Delete this session and all its notes?')) return false;
      try {
        await sessionsDb.delete(id);
        if (activeSessionId === id) {
          activeSessionId = null;
          isRecording = false;
        }
        await loadSessions();
        render();
        return true;
      } catch(e) {
        console.error('Failed to delete:', e);
        return false;
      }
    }

    // ── Recording ──
    async function startRecording() {
      try {
        // Request highest possible resolution. Browsers will clamp to what the source supports.
        mediaStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            cursor: 'always',
            width:    { ideal: 7680, max: 7680 },
            height:   { ideal: 4320, max: 4320 },
            frameRate:{ ideal: 30 },
          },
          audio: false
        });
        // After acquisition, try to push the track to its native resolution
        // (some browsers won't honor constraints in getDisplayMedia itself).
        const track = mediaStream.getVideoTracks()[0];
        try {
          const caps = track.getCapabilities ? track.getCapabilities() : null;
          if (caps && caps.width && caps.height) {
            await track.applyConstraints({
              width:  { ideal: caps.width.max  || 7680 },
              height: { ideal: caps.height.max || 4320 },
            });
          }
        } catch(_) { /* not all UAs support this; fine */ }
      } catch(e) {
        // User cancelled
        return;
      }

      isRecording = true;
      recordingStartTime = Date.now();
      currentNotes = [];
      screenshotCaptured = null;

      // Create a new session immediately
      const session = {
        title: 'Untitled Session',
        ownerEmail: currentUser?.email || null,
        ownerName: currentUser?.fullName || currentUser?.email || null,
        notes: [],
        duration: 0,
      };
      await saveSession(session);
      activeSessionId = session.id;

      // Handle stream ending (user clicks "Stop sharing")
      mediaStream.getVideoTracks()[0].onended = () => {
        stopRecording();
      };

      render();
      startTimer();
      if (voiceCommandsEnabledPreference) enableVoiceCommands(false);
    }

    async function stopRecording() {
      const stoppedSessionId = activeSessionId;
      isRecording = false;
      // Stop this recording's listener without changing the user's choice for
      // whether voice commands should start automatically next time.
      stopVoiceCommands(false);

      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }

      clearInterval(timerInterval);
      renderLoadingState('Preparing your session…');

      if (stoppedSessionId) {
        let session = allSessions.find(s => s.id === stoppedSessionId);
        if (session) {
          session.duration = Date.now() - recordingStartTime;
          session.notes = [...currentNotes];
          // If the canvas had not yet been created, create it now so stop lands
          // directly on a populated canvas without requiring refresh/navigation.
          if (!session.canvas || !session.canvas.items || session.canvas.items.length === 0) {
            session.canvas = {
              viewport: { x: 0, y: 0, scale: 1 },
              items: generateInitialLayout(session.notes),
            };
          }
          await saveSession(session);
          await loadSessions();
          session = allSessions.find(s => s.id === stoppedSessionId) || session;
          activeSessionId = stoppedSessionId;
          currentNotes = session.notes || [];
          setSessionUrl(stoppedSessionId);
          render();
          requestAnimationFrame(() => {
            initCanvas(session);
            // Let images/text render, then measure actual heights and arrange once.
            setTimeout(() => {
              autoArrangeCanvas();
              fitToScreen();
            }, 100);
          });
          return;
        }
      }

      render();
    }

    function renderLoadingState(message = 'Loading…') {
      const main = document.getElementById('mainContent');
      if (!main) return;
      main.innerHTML = `
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <div>${escapeHtml(message)}</div>
        </div>
      `;
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const el = document.getElementById('recTimer');
        if (el) el.textContent = formatDuration(Date.now() - recordingStartTime);
      }, 1000);
    }

    // ── Voice commands ──
    function waitForVoiceHintAnimation(ms) {
      return new Promise(resolve => window.setTimeout(resolve, ms));
    }

    async function animateVoiceListeningHint(labelElement, runId) {
      let labelIndex = 0;
      while (runId === voiceHintAnimationRun && voiceCommandsVisualActive && labelElement.isConnected) {
        const label = VOICE_LISTENING_HINTS[labelIndex];
        labelElement.replaceChildren();

        for (const value of label) {
          if (runId !== voiceHintAnimationRun || !voiceCommandsVisualActive || !labelElement.isConnected) return;
          const character = document.createElement('span');
          character.className = 'voice-hint-character entering';
          character.textContent = value;
          labelElement.appendChild(character);
          await waitForVoiceHintAnimation(90);
        }

        await waitForVoiceHintAnimation(3000);
        while (labelElement.lastElementChild) {
          if (runId !== voiceHintAnimationRun || !voiceCommandsVisualActive || !labelElement.isConnected) return;
          const character = labelElement.lastElementChild;
          character.classList.remove('entering');
          character.classList.add('exiting');
          // Let the exit animation reach its blurred state before removing it.
          await waitForVoiceHintAnimation(160);
          character.remove();
        }

        await waitForVoiceHintAnimation(220);
        labelIndex = (labelIndex + 1) % VOICE_LISTENING_HINTS.length;
      }
    }

    function syncVoiceListeningHint() {
      const hint = document.getElementById('voiceListeningHint');
      const label = document.getElementById('voiceListeningLabel');
      const visible = voiceCommandsVisualActive;
      if (hint) hint.classList.toggle('visible', visible);

      if (!visible || !label) {
        voiceHintAnimationRun += 1;
        voiceHintAnimationElement = null;
        if (label) label.replaceChildren();
        return;
      }
      if (voiceHintAnimationElement === label) return;

      voiceHintAnimationElement = label;
      const runId = ++voiceHintAnimationRun;
      animateVoiceListeningHint(label, runId);
    }

    function updateVoiceCommandControl() {
      const toggle = document.getElementById('voiceInputToggle');
      if (toggle) {
        toggle.classList.toggle('listening', voiceCommandsVisualActive);
        toggle.setAttribute('aria-pressed', String(voiceCommandsVisualActive));
        toggle.setAttribute('aria-label', voiceCommandsVisualActive ? 'Turn off voice commands' : 'Start voice dictation');
        toggle.title = voiceCommandsVisualActive ? 'Turn off voice commands' : 'Start voice dictation';
      }
      syncVoiceListeningHint();
      updateVoiceDictationMarker();
    }

    function toggleVoiceCommands() {
      if (voiceCommandsVisualActive || voiceCommandsStarting) {
        stopVoiceCommands();
      } else {
        voiceNoteDictationActive = true;
        voiceCaptureOnFirstDictationText = true;
        voiceInterimStart = null;
        voiceInterimText = '';
        if (!voiceCommandsShouldListen) enableVoiceCommands();
        else startVoiceRecognition();
        updateVoiceCommandControl();
        const input = document.getElementById('noteInput');
        if (input && document.activeElement !== input) {
          suppressNextNoteFocusCapture = true;
          input.focus();
        }
      }
    }

    function resetVoiceNoteDictation() {
      voiceNoteDictationActive = false;
      voiceCaptureOnFirstDictationText = false;
      voiceInterimStart = null;
      voiceInterimText = '';
      updateVoiceCommandControl();
    }

    function formatVoiceDictationText(prefix, text) {
      const next = String(text || '').trim();
      if (!next) return '';
      if (!prefix || /\s$/.test(prefix) || /^[,.;!?]/.test(next)) return next;
      return ` ${next}`;
    }

    function updateVoiceDictationText(text, isFinal) {
      const input = document.getElementById('noteInput');
      if (!input) return;

      let start = voiceInterimStart;
      let previous = voiceInterimText;
      if (start == null || input.value.slice(start, start + previous.length) !== previous) {
        start = input.value.length;
        previous = '';
      }

      const next = formatVoiceDictationText(input.value.slice(0, start), text);
      if (!isFinal && previous && next.length < previous.length) return;
      input.setRangeText(next, start, start + previous.length, 'end');
      if (voiceCaptureOnFirstDictationText && next.trim()) {
        voiceCaptureOnFirstDictationText = false;
        beginNoteScreenshotCapture().then(updateSaveNoteButtonState);
      }
      if (isFinal) {
        voiceInterimStart = null;
        voiceInterimText = '';
      } else {
        voiceInterimStart = start;
        voiceInterimText = next;
      }

      input.scrollLeft = 0;
      updateSaveNoteButtonState();
      requestAnimationFrame(updateVoiceDictationMarker);
    }

    function stripVoiceControlPhrases(text) {
      return String(text || '')
        .replace(/\bsave\s+note\b/ig, ' ')
        .replace(/\b(?:remove|delete)\s+(?:the\s+)?screenshot\b/ig, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    async function saveNoteFromVoice() {
      if (voiceSaveNoteInFlight) return;
      voiceSaveNoteInFlight = true;
      voiceInterimStart = null;
      voiceInterimText = '';
      updateVoiceCommandControl();
      try {
        await addNote();
      } finally {
        voiceSaveNoteInFlight = false;
      }
    }

    function removeTrailingVoiceCommandPrefix() {
      const input = document.getElementById('noteInput');
      if (!input) return;
      const next = input.value.replace(/\s*(?:remove|delete)(?:\s+the)?\s*$/i, '');
      if (next === input.value) return;
      input.value = next;
      voiceInterimStart = null;
      voiceInterimText = '';
      input.scrollLeft = 0;
      updateSaveNoteButtonState();
      requestAnimationFrame(updateVoiceDictationMarker);
    }

    function handleVoiceRecognitionResult(event) {
      if (!voiceCommandsShouldListen || voiceSaveNoteInFlight) return;

      for (let i = event.resultIndex; i < event.results.length; i += 1) {
        const result = event.results[i];
        const transcript = String(result[0]?.transcript || '').trim();
        const previousResult = i > 0 ? event.results[i - 1] : null;
        const previousTranscript = String(previousResult?.[0]?.transcript || '').trim();
        const removeScreenshotAcrossResults = !!previousResult?.isFinal
          && /\b(?:remove|delete)(?:\s+the)?$/i.test(previousTranscript)
          && /^screenshot\b/i.test(transcript);
        const removeScreenshotCommand = /\b(?:remove|delete)\s+(?:the\s+)?screenshot\b/i.test(transcript)
          || removeScreenshotAcrossResults;
        const command = removeScreenshotCommand ? null : /\bscreenshot\b/i.exec(transcript);
